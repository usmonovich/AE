# Вид для студентов: исправленные тексты записей с принятыми замечаниями (исходные записи не меняются).
records:
  crm-analyzers-dyn-acuity:
    body: 'Восприятие движущихся объектов особенно важно на взлёте, посадке и на малых высотах. Острота зрения зависит от скорости движения объекта: **чем больше скорость, тем ниже острота зрения** — быстро движущиеся предметы различаются хуже (вблизи самолёта они сливаются в полосу).'
  crm-vestibular-apparatus:
    body: |
      **Вестибулярный аппарат** (лат. vestibulum — преддверие) превращает энергию ускорений в биоэлектрические сигналы; по ним нервные центры анализируют положение головы и тела в пространстве.
      - Рецепторы **полукружных каналов** реагируют на **угловые** ускорения.
      - Рецепторы эллиптического и сферического мешочков преддверия (**отолитовые** рецепторы) реагируют на **линейные** ускорения.

      Чувствительные области ампул полукружных протоков называют **кристами**, или гребешками, а в мешочках преддверия — пятнами (макулами). Длительное возбуждение вестибулярного аппарата вызывает «морскую (воздушную) болезнь».
  crm-aviapsy-methods-exp:
    body: 'Эксперимент (лат. experimentum — проба, опыт) — научно поставленный опыт: явление изучается в точно учитываемых условиях по определённой программе, за ходом явления можно следить и воссоздать его при повторении условий. Разновидности: лабораторный, естественный и обучающий (формирующий) эксперименты.'
