<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="inherit"><title>Структура образа полёта: система информации даёт инструментальные и неинструментальные сигналы, из них складываются образ пространственного положения, чувство самолёта и приборный образ, а над ними — образ-цель (схема лекции 2, слайд 8)</title><defs><marker id="crm-flight-image-m-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-acc" d="M0,0L10,5L0,10Z"/></marker><marker id="crm-flight-image-m-mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path class="f-mute" d="M0,0L10,5L0,10Z"/></marker></defs><line class="s-acc" x1="170" y1="228" x2="100" y2="206" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#crm-flight-image-m-acc)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1s" begin="0s" repeatCount="indefinite"/></line><line class="s-acc" x1="230" y1="228" x2="300" y2="206" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#crm-flight-image-m-acc)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1s" begin="0s" repeatCount="indefinite"/></line><line class="s-acc" x1="80" y1="178" x2="70" y2="136" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#crm-flight-image-m-acc)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1s" begin="0.2s" repeatCount="indefinite"/></line><line class="s-acc" x1="110" y1="178" x2="190" y2="136" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#crm-flight-image-m-acc)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1s" begin="0.2s" repeatCount="indefinite"/></line><line class="s-acc" x1="310" y1="178" x2="320" y2="136" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#crm-flight-image-m-acc)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1s" begin="0.2s" repeatCount="indefinite"/></line><line class="s-acc" x1="70" 