<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" font-family="inherit"><title>Зоны восприятия земли на посадке (по Г. Г. Голубеву): вдали — зона ясной видимости, ближе — зона мелькания, у самолёта — зона слияния, где предметы сливаются в сплошную полосу</title><path class="s-ink" d="M8,150H392" stroke-width="2"/><path class="f-acc" d="M14,96h40q16,4 0,10h-40z"/><path class="f-acc" d="M18,96l-6,-12h8l8,12z"/><rect class="f-red-soft" x="60" y="154" width="80" height="22" opacity="0.8"/><text class="t-s" x="100" y="194" text-anchor="middle">зона слияния</text><rect class="f-soft" x="140" y="154" width="110" height="22" opacity="0.8"/><text class="t-s" x="195" y="194" text-anchor="middle">зона мелькания</text><rect class="f-soft" x="250" y="154" width="142" height="22" opacity="0.8"/><text class="t-s" x="321" y="194" text-anchor="middle">зона ясной видимости</text><circle class="f-grn" cx="392" cy="142" r="6"><animate attributeName="cx" values="392;60" keyTimes="0;1" keySplines="0.6 0 1 1" calcMode="spline" dur="6s" begin="0s" repeatCount="indefinite"/></circle><circle class="f-grn" cx="392" cy="142" r="6"><animate attributeName="cx" values="392;60" keyTimes="0;1" keySplines="0.6 0 1 1" calcMode="spline" dur="6s" begin="-1.2s" repeatCount="indefinite"/></circle><circle class="f-grn" cx="392" cy="142" r="6"><animate attributeName="cx" values="392;60" keyTimes="0;1" keySplines="0.6 0 1 1" calcMode="spline" dur="6s" begin="-2.4s" repeatCount="indefinite"/></circle><circle class="f-grn" cx="392" cy="142" r="6"><animate attributeName="cx" values="392;60" keyTimes="0;1" keySplines="0.6 0 1 1" calcMode="spline" dur="6s" begin="-3.6s" repeatCount="indefinite"/></circle><circle class="f-grn" cx="392" cy="142" r="6"><animate attributeName="cx" values="392;60" keyTimes="0;1" keySplines="0.6 0 1 1" calcMode="spline" dur="6s" begin="-4.8s" repeatCount="indefinite"/></circle><line class="s-grn" x1="62" y1="136" x2="138" y2="136" stroke-width="2" stroke-dasharray="30 6"><animate attributeName="stroke-dashoffset" values="0;36" dur="0.25s" repeatCount="indefinite"/></line><line class="s-grn" x1="62" y1="142" x2="138" y2="142" stroke-width="2" stroke-dasharray="30 6"><animate attributeName="stroke-dashoffset" values="0;36" dur="0.3s" repeatCount="indefinite"/></line><line class="s-grn" x1="62" y1="148" x2="138" y2="148" stroke-width="2" stroke-dasharray="30 6"><animate attributeName="stroke-dashoffset" values="0;36" dur="0.35s" repeatCount="indefinite"/></line><rect class="f-paper" x="56" y="126" width="6" height="22"/><text class="t-s" x="225" y="30" text-anchor="middle">Чем ближе к самолёту, тем быстрее</text><text class="t-s" x="225" y="46" text-anchor="middle">предметы проносятся мимо взгляда</text></svg>
