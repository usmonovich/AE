# Тема 10. Управление ресурсами экипажа CRM — методика обучения экипажей взаимодействовать друг с другом
# (лекция 10, слайды j01–j08).
subsection: crm-t10

refs:
  - &faacrm { title: 'The Evolution of Crew Resource Management Training (history of CRM, Helmreich et al.)', url: 'https://www.faa.gov/sites/faa.gov/files/crmhistory.pdf', org: FAA, checked: '2026-11-10' }

topics:
  - id: crm-crm-intro
    title: Что такое CRM и откуда она появилась
    pages: [j01, j02, j03, j04]
    theory:
      - kind: text
        title: Учебные вопросы темы 10
        body: '1) Введение в управление ресурсами экипажа, применение CRM; 2) эволюция CRM и её ключевые принципы; 3) проблемы в управлении ресурсами экипажа; 4) программы обучения CRM и их развитие. Время: 2 часа лекции и 2 часа практики.'
        src: j01
      - kind: definition
        title: Crew Resource Management (CRM)
        body: |
          **CRM — управление ресурсами (возможностями) экипажа** — методика обучения персонала в тех сферах, где **человеческая ошибка может привести к катастрофе**.

          CRM делает упор не на технических знаниях, а на **взаимоотношениях** членов команды или экипажа в одной кабине, включая **лидерство** и **принятие решений**.

          Методика появилась в авиации, затем её внедрили в других службах — пожарной и морской (Bridge Resource Management, Maritime Resource Management).
        src: j02
      - kind: list
        title: История появления CRM
        body: |
          - **1977 — катастрофа на Тенерифе** (столкновение двух Boeing 747 на ВПП) — крупнейшая в истории авиации. Произошла отчасти потому, что пилоты пренебрегли сомнениями бортинженера в том, что полоса свободна, полагаясь на свой опыт.
          - **1979 — семинар NASA** по повышению безопасности полётов. Исследования NASA показали: причина большинства авиакатастроф — **человеческий фактор**, в том числе проблемы во взаимоотношениях.
          - **1981 — United Airlines** первой внедрила CRM для обучения лётных экипажей.
        src: j02
      - kind: text
        title: Рейс 232 (Су-Сити, 1989) — CRM в действии
        body: |
          **19 июля 1989 года** у DC-10 (рейс United 232) разрушился ротор **среднего (хвостового) двигателя**; обломки пробили горизонтальное оперение и вывели из строя **все три гидросистемы** — управлять самолётом штурвалом стало невозможно. Инструкций для такой ситуации не было.

          В салоне летел **пилот-инструктор**, который незадолго до этого изучал управление самолётом только двигателями. Он предложил помощь, экипаж согласился, и вместе они выровняли самолёт и посадили его в Су-Сити. При посадке самолёт разрушился, погибли 111 человек, но **185 человек (почти 2/3) выжили**, включая всех в кабине.
        src: j03
      - kind: rule
        title: Вывод капитана Альфреда Хайнса
        body: 'Капитан рейса 232 объяснял успех подготовкой по CRM. До 1980 года действовал принцип **непререкаемого авторитета капитана** — «что он сказал, то и будет», и из-за этого терялись самолёты. В кабине у экипажа было **103 года лётного опыта**, но ни минуты практики в такой ситуации. Только потому, что **каждый мог внести свой вклад**, экипажу удалось посадить самолёт.'
        src: j03
      - kind: rule
        title: Зачем нужна CRM
        body: |
          - CRM — набор процедур обучения для повышения безопасности; главное внимание — **межличностному общению, лидерству и принятию решений** в лётном экипаже.
          - Концепция появилась из признания того, что **человеческая ошибка — более серьёзная причина** происшествий, чем механические неисправности.
          - CRM признаёт, что ошибки возможны в любой человеческой деятельности, и создаёт условия, чтобы **обнаруживать и исправлять ошибки до того, как они станут катастрофическими**.
          - Цель — **максимально использовать все имеющиеся ресурсы** для безопасности и эффективности полётов. Это касается всех — от кабины пилота до диспетчерской вышки.
        src: j04
      - kind: note
        title: 'Дополнение: поколения CRM'
        body: |
          По обзору истории CRM (Helmreich и соавт., материалы FAA) — **этого нет в лекции**:
          1. **Cockpit Resource Management** — семинары по стилю управления и межличностному поведению.
          2. **Crew Resource Management** — командная работа, брифинги, ситуационная осведомлённость, принятие решений.
          3. Расширение на организационную культуру, автоматизацию, бортпроводников, диспетчеров и техников.
          4. Интеграция CRM в техническую подготовку и процедуры (программа FAA AQP, 1990).
          5. **Управление ошибками**: ошибки неизбежны — их нужно избегать, перехватывать и смягчать последствия.

          В том же документе сказано, что название «Cockpit Resource Management» появилось на семинаре NASA 1979 года «Resource Management on the Flightdeck».
        src: j05
        web: [*faacrm]
