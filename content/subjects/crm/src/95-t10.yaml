  - id: crm-crm-principles
    title: Эволюция и ключевые принципы CRM
    pages: [j05, j06]
    theory:
      - kind: list
        title: Как развивалась CRM
        body: |
          - Концепция появилась в **конце 1970-х годов** и сначала касалась только **экипажа лётной кабины**. Позже её распространили на **весь персонал**, участвующий в производстве полётов, включая **авиадиспетчеров** и **бригады технического обслуживания**.
          - Сначала главное внимание уделялось межличностному общению и принятию решений; затем добавились **управление стрессом и усталостью**; современная CRM охватывает более широкий круг человеческих факторов, включая **когнитивные и личные ресурсы**.
          - Произошёл переход от **реактивного** подхода (реагировать на ошибки после их возникновения) к **проактивному** — предотвращать ошибки, создавая среду, в которой их обнаруживают и исправляют.
        src: j05
        errata: [crm-e10]
      - kind: rule
        title: Ключевые принципы CRM
        body: |
          1. **Общая ситуационная осведомлённость** — каждый член экипажа понимает текущее состояние полёта, включая возможные риски и проблемы.
          2. **Чёткое и эффективное общение** — вербальное, невербальное и письменное; всё общение должно быть **ясным, кратким и недвусмысленным**. В кабине любое недопонимание может привести к серьёзной ошибке.
          3. **Лидерство и подчинение** — обычно лидер — командир, остальные — его последователи. Но руководство **может и должно меняться** по ситуации: если у другого члена экипажа больше нужных знаний или опыта, он должен взять на себя руководящую роль.
        src: j06
      - kind: list
        title: Компоненты CRM на схеме слайда
        body: 'Общение (communication), управление рабочей нагрузкой (workload management), принятие решений (decision making), разрешение конфликтов (conflict resolution), лидерство (leadership), управление командой (team management), управление стрессом (stress management).'
        src: j06
    questions:
      - type: multiple
        cat: theory
        q: На кого со временем распространилась CRM, кроме экипажа лётной кабины?
        opts: ['Авиадиспетчеры', 'Бригады технического обслуживания', 'Весь персонал, участвующий в производстве полётов', 'Только пассажиры']
        ans: [a, b, c]
        hint: Пассажиров CRM не обучает.
        explain: 'Сфера CRM расширилась на весь персонал производства полётов, включая диспетчеров и техников.'
        src: j05
      - type: single
        cat: theory
        q: Как изменился подход CRM к ошибкам?
        opts: ['От реактивного (после ошибки) к проактивному (предотвращение)', 'От проактивного к реактивному', 'Ошибки перестали учитывать', 'Не изменился']
        ans: a
        hint: Современная CRM старается не допустить ошибку.
        explain: 'Современная CRM делает упор на предотвращение ошибок и среду, где их обнаруживают и исправляют.'
        src: j05
      - type: matching
