        q: Какие компоненты CRM показаны на схеме слайда?
        opts: ['Управление рабочей нагрузкой', 'Разрешение конфликтов', 'Управление стрессом', 'Расчёт центровки']
        ans: [a, b, c]
        hint: Центровка — техническая задача.
        explain: 'На схеме: общение, рабочая нагрузка, решения, конфликты, лидерство, команда, стресс.'
        src: j06
      - type: single
        cat: theory
        q: Что добавилось к содержанию CRM по мере её развития, кроме общения и принятия решений?
        opts: ['Управление стрессом и усталостью', 'Аэродинамика', 'Навигационные расчёты', 'Правила продажи билетов']
        ans: a
        hint: Человеческие факторы.
        explain: 'Концепция стала включать управление стрессом и усталостью, а затем когнитивные и личные ресурсы.'
        src: j05

  - id: crm-crm-training
    title: Внедрение CRM, проблемы и программы обучения
    pages: [j07, j08]
    theory:
      - kind: rule
        title: Как внедряют CRM
        body: |
          1. **Оценка потребностей** — определить области, где обучение CRM полезно: общение, принятие решений, командная работа.
          2. **Разработка программы** обучения под выявленные потребности и конкретный контекст — роли и обязанности членов экипажа.
          3. **Реализация** — структурированно и систематически, с регулярной оценкой прогресса.

          CRM — **не разовое обучение, а непрерывный процесс**: программа должна включать постоянные курсы повышения квалификации и оценки.
        src: j07
      - kind: list
        title: Проблемы внедрения CRM
        body: |
          - **Сопротивление переменам** — CRM требует менять организационную культуру; возможно сопротивление и руководства, и членов команды.
          - **Постоянное обучение и оценка** — нужны приверженность руководства и экипажа, время и ресурсы.
          - **Трудность измерения эффективности** — в отличие от технических навыков, навыки CRM трудно измерить количественно, поэтому сложно оценить их влияние на безопасность.
        src: j07
      - kind: list
        title: Программы обучения CRM
        body: |
          - Модули: **общение, командная работа, принятие решений, ситуационная осведомлённость**.
          - Кроме очного обучения — **тренажёры**: экипаж применяет концепции в контролируемой среде и получает отзывы о своей работе.
          - **Оценка** применения принципов CRM в реальных полётах — помогает найти области для улучшения.
        src: j08
      - kind: list
        title: Будущее CRM
        body: |
          - Роль человеческого фактора признаётся всё шире — это будет и дальше развивать CRM.
          - **Новые технологии**: чем технологичнее самолёты, тем больше нужна CRM, чтобы экипаж эффективно управлял новыми системами.
          - Больше внимания — **управлению стрессом и усталостью**, так как требования к экипажам растут.

          Итог лекции: от улучшения коммуникации и командной работы до эффективного принятия решений — CRM обеспечивает безопасность и эффективность полётов.
        src: j08
    questions:
      - type: sequence
        cat: theory
        q: Расположите шаги внедрения CRM по порядку.
        seq: ['Оценка потребностей', 'Разработка программы обучения', 'Реализация программы с регулярной оценкой', 'Постоянное повышение квалификации']
        hint: Сначала понять, что нужно.
        explain: 'Оценка потребностей → разработка программы → реализация → непрерывное повышение квалификации.'
        src: j07
      - type: multiple
