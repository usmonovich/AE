        q: Какие проблемы внедрения CRM названы в лекции?
        opts: ['Сопротивление переменам', 'Необходимость постоянного обучения и оценки', 'Трудность измерения эффективности', 'Слишком низкая цена тренажёров']
        ans: [a, b, c]
        hint: Три проблемы.
        explain: 'Сопротивление переменам, постоянное обучение и трудность количественной оценки навыков CRM.'
        src: j07
      - type: single
        cat: theory
        q: Почему эффективность CRM трудно измерить?
        opts: ['Навыки CRM трудно выразить количественно, в отличие от технических', 'CRM никто не применяет', 'Её запрещено оценивать', 'Она не влияет на безопасность']
        ans: a
        hint: Как измерить качество общения?
        explain: 'Навыки, полученные на обучении CRM, часто трудно измерить количественно.'
        src: j07
      - type: single
