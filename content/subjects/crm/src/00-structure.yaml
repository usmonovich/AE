# 🧠 Aviation Psychology and Crew Resource Management (CRM)
# Структура курса, файлы-источники, словарь обозначений, замечания к источнику.
# Источник — 9 лекций-презентаций преподавателя (темы 1–9 из 14 по программе дисциплины, слайд a02).
# Страница = слайд: a — лекция 1, b — лекция 2, … h — лекция 8, i — лекция 9 (a05 — лекция 1, слайд 5).
# Пустые слайды (лекция 1, слайд 3; лекция 3, слайд 1) в список страниц не включены.
# Теория изложена своими словами по слайдам; формулировки определений сохранены по смыслу.
# ID разделов, подразделов, тем и записей начинаются с «crm-».

course:
  id: crm
  title: "Aviation Psychology and Crew Resource Management (CRM)"
  owner: Husniddin
  language: ru

sourceFiles:
  - { id: crm-lec1, title: 'Лекция 1. Предмет, цели и задачи авиационной психологии (с программой дисциплины)', fileName: 'Лекция 1.pptx', kind: pptx, pdfPages: 9, sha256: e45c30f2743b8c119b6f41ddb620b2461d3ff40d695a05899b9c42c9eb125e93, pagePrefix: a, pageLabel: 'т1·', note: 'Слайды 1–2 — титул и перечень 14 тем программы; слайд 3 пустой.', notes: ['Презентация преподавателя (9 слайдов): титул, программа дисциплины (14 тем, 50 часов), тема 1.', 'Текст извлечён из слайдов; иллюстрации — фотографии без учебного содержания.'] }
  - { id: crm-lec2, title: 'Лекция 2. Специфика и условия лётной деятельности', fileName: 'Лекция 2.pptx', kind: pptx, pdfPages: 11, sha256: 453508ef337986a1f094c48ccb1ac4b410f389b3a3bde0078e5805e5a83ae773, pagePrefix: b, pageLabel: 'т2·', notes: ['11 слайдов: анализаторы, зрение, слух и вестибулярный аппарат, перегрузки, образ полёта, вредные и опасные факторы труда.', 'Схемы со слайдов 3, 4, 8, 11 (угол обзора, зоны восприятия, образ полёта, санитарно-гигиенические условия) переданы текстом и анимациями.'] }
  - { id: crm-lec3, title: 'Лекция 3. Авиадиспетчер в системе управления воздушным движением', fileName: 'Лекция 3.pptx', kind: pptx, pdfPages: 7, sha256: eae9e637d2329bd96ecf3d3eec8f0ae27f516fc9db875119d067cf14b139fbce, pagePrefix: c, pageLabel: 'т3·', note: 'Слайд 1 пустой.', notes: ['7 слайдов (слайд 1 пустой): этапы деятельности диспетчера, модели УВД, загруженность и пропускная способность, профессиональные качества.'] }
  - { id: crm-lec4, title: 'Лекция 4. Лётные иллюзии', fileName: 'Лекция 4.pptx', kind: pptx, pdfPages: 5, sha256: fce3c074fb518ba24188cec53f83617bd2e591cf7426d693719f53c60b74c083, pagePrefix: d, pageLabel: 'т4·', notes: ['5 слайдов: понятие, классификации, виды иллюзий, факторы снижения риска.'] }
  - { id: crm-lec5, title: 'Лекция 5. Роль памяти и мышления в деятельности пилотов и авиадиспетчеров', fileName: 'Лекция 5.pptx', kind: pptx, pdfPages: 6, sha256: 9475435ee0c2d9fa68dfe7351e49de19c94eb6dc96bb5311cde4efefa44521f7, pagePrefix: e, pageLabel: 'т5·', notes: ['6 слайдов: память, интеллект, мышление, вероятностное прогнозирование, тренинг умственной деятельности; схемы «Виды мышления» и «Вероятностное прогнозирование» переданы текстом.'] }
  - { id: crm-lec6, title: 'Лекция 6. Утомление и переутомление лётного и диспетчерского состава', fileName: 'Лекция 6.pptx', kind: pptx, pdfPages: 5, sha256: 799cd483388b2cb1a0e210efe5fbd964dab27251b7a1600b078394d75244c1b7, pagePrefix: f, pageLabel: 'т6·', notes: ['5 слайдов: утомление и переутомление, таблица степеней переутомления, факторы у диспетчеров, профилактика; картинки слайда 5 (признаки умственного переутомления, виды утомления) переданы текстом.'] }
  - { id: crm-lec7, title: 'Лекция 7. Типы темперамента и характера', fileName: 'Лекция 7.pptx', kind: pptx, pdfPages: 6, sha256: 3adfc74a34b288345bdd90fcebe4a5bae4e6dc27e3ee66a7dc83fa95d61f39d1, pagePrefix: g, pageLabel: 'т7·', notes: ['6 слайдов: темперамент, типы по Павлову, влияние темперамента на работу, характер. Таблицы-картинки слайдов 2–4 переданы текстом; слайд 6 — только картинки (см. замечание crm-e05).'] }
  - { id: crm-lec8, title: 'Лекция 8. Эмоциональная напряжённость в полёте и при УВД', fileName: 'Лекция 8.pptx', kind: pptx, pdfPages: 5, sha256: 39e69b742461d93d33c9c2449f95302e136ce786a137faa6f7ed161e940dce42, pagePrefix: h, pageLabel: 'т8·', notes: ['5 слайдов: эмоции и потребности, причины и виды нарушений при эмоциональной напряжённости, стресс и меры профилактики.'] }
  - { id: crm-lec9, title: 'Лекция 9. Невротические расстройства авиаспециалистов', fileName: 'Тема 9.pptx', kind: pptx, pdfPages: 7, sha256: 080980903d8af2566a47b3db82f096f20323f3a239a8e099508fabeb7321e2f8, pagePrefix: i, pageLabel: 'т9·', notes: ['7 слайдов: неврозы лётного и диспетчерского состава, механизмы и условия возникновения, психотерапия, невроз характера и роль семьи. Схемы-картинки (три группы неблагоприятных состояний, круг невроза навязчивых состояний, кто подвержен расстройствам, причины и механизм неврозов) прочитаны и переданы текстом. Имя файла пришло в чат искажённым.'] }

