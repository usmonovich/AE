symbols:
  n_over: { tex: 'n', meaning: 'перегрузка — безразмерная величина', unit: '—', src: b06 }
  F_acc: { tex: 'F', meaning: 'сила, вызвавшая ускорение или торможение тела', unit: 'Н', src: b06 }
  G_w: { tex: 'G', meaning: 'вес тела (сила тяжести)', unit: 'Н', src: b06 }
  H_eye: { tex: 'H', meaning: 'высота глаз пилота над землёй (ВПП)', unit: 'м', src: b03 }
  L_vis: { tex: 'L', meaning: 'расстояние до ближайшей точки земли, видимой из кабины', unit: 'м', src: b03 }
  alpha_v: { tex: '\alpha', meaning: 'угол обзора из кабины вниз (угол между горизонтом и линией от глаз пилота, касательной к носовой части)', unit: '°', src: b03 }
  theta_p: { tex: '\theta', meaning: 'угол тангажа (поднятия носа самолёта)', unit: '°', src: b03 }

errata:
  - id: crm-e01
    page: b04
    severity: error
    target: динамическая острота зрения
    original: 'Острота зрения находится в зависимости от V движения объекта: чем больше V, тем выше острота зрения.'
    issue: 'Наоборот: с ростом скорости (угловой скорости) движения объекта динамическая острота зрения снижается — быстро движущиеся объекты различаются хуже. Это видно и на том же слайде: при большой скорости появляется «зона слияния», где отдельные предметы не различаются.'
    suggestion: 'Чем больше скорость движения объекта относительно глаза, тем ниже острота зрения.'
    todo: 'Подтвердить исправление (в виде для студентов уже показан исправленный текст).'
  - id: crm-e02
    page: b06
    severity: typo
    target: рецепторы вестибулярного аппарата
    original: '«оолитовые рецепторы»; чувствительные области ампул «называемые кистами, или гребешками»'
    issue: 'Опечатки в терминах: рецепторы мешочков преддверия — отолитовые (от «отолиты»), чувствительные области ампул — кристы (лат. crista — гребешок).'
    suggestion: 'отолитовые рецепторы; чувствительные области ампул — кристы, или гребешки'
  - id: crm-e03
    page: a08
    severity: typo
    target: виды эксперимента
    original: 'Лабораторный, Естественный и Обучающийся эксперименты.'
    issue: 'В психологии этот вид называют обучающим (формирующим) экспериментом: в нём изучаемое качество формируется в ходе обучения. «Обучающийся» — опечатка.'
    suggestion: 'лабораторный, естественный и обучающий (формирующий) эксперименты'
  - id: crm-e04
    page: e06
    severity: unclear
    target: тренинг умственной деятельности
    original: 'Обязательные периодические экстремальные усилия в умственной работе вплоть до глубокого утомления.'
    issue: 'Расходится с темой 6: там переутомление — пограничное с патологией состояние, а утомление — защитная реакция, которую нельзя игнорировать. Непонятно, где граница между «глубоким утомлением» как тренировкой и переутомлением.'
    suggestion: 'Периодические предельные умственные нагрузки допустимы только с полноценным последующим отдыхом — до обратимого утомления, но не до переутомления.'
    todo: 'Уточнить у преподавателя, что имеется в виду; пока в приложении оставлено как на слайде.'
  - id: crm-e05
    page: g06
    severity: unclear
    target: слайд «Типы характеров (личности)»
    original: 'Картинки: дерево «темперамент — характер — личность», «Типы личности по Холланду», «Типы личности человека» (16 типов), карточки «Капитан, Штурман, Боцман, Матрос».'
    issue: 'На слайде нет пояснений, только картинки из интернета. 16 типов (Искатель, Посредник, …) — это типология MBTI/соционики, в лекции не объяснена; морские роли «капитан — матрос» к авиации прямо не относятся.'
    suggestion: 'В приложение включены дерево «темперамент → характер → личность» и шесть типов по Холланду (их описания есть на картинке). 16 типов и морские роли добавить после пояснения преподавателя.'
    todo: 'Нужно ли включать 16 типов личности и роли «капитан — матрос»?'
  - id: crm-e06
    page: g04
    severity: note
    target: таблица «Тип темперамента — особенности работы»
    original: 'В таблице: флегматики «тяжело сходятся с другими детьми», рекомендации «включать в подвижные игры», «давать кратковременные поручения».'
    issue: 'Таблица взята из материалов для работы с детьми, рекомендации педагогические, а не для авиаспециалистов.'
    suggestion: 'В приложение включены особенности проявления темперамента и возможные отрицательные черты; рекомендации для детей не включены.'
  - id: crm-e07
    page: i05
    severity: unclear
    target: методы лечения неврозов
    original: '«Раз неврозы — это информационные расстройства, то и избавиться от них можно исключительно с помощью информационного воздействия — различных видов психотерапии».'
    issue: 'Слово «исключительно» слишком категорично. Например, при обсессивно-компульсивном расстройстве эффективны и когнитивно-поведенческая терапия, и лекарства (ингибиторы обратного захвата серотонина), их часто сочетают (Gillihan и соавт., 2012).'
    suggestion: '«…основной метод лечения — психотерапия; по назначению врача её дополняют лекарствами».'
  - id: crm-e08
    page: i02
    severity: typo
    target: опечатки лекции 9
    original: '«без речевое (невербальное) воздействие» (т9·2); «вы- ход на пенсию», «психи- ческой травматизацией», «одним самых опасных» (т9·3); «туго подвижность», «уяснения значимости происшедшего (;» (т9·4); «внутри личностный конфликт» (т9·5).'
    issue: 'Слитное и раздельное написание, остатки переносов, пропущенный предлог «из» и лишние символы «(;».'
    suggestion: '«неречевое», «выход», «психической», «одним из самых опасных», «тугоподвижность», убрать «(;», «внутриличностный».'
  - id: crm-e09
    page: i03
    severity: unclear
    target: схема «Неблагоприятные для лётной деятельности психические состояния»
    original: '1-я группа — «состояния, возникающие вследствие врождённых психических заболеваний»: шизофрения, психопатия, паранойя, истерия, эпилепсия.'
    issue: 'Перечисленные заболевания в большинстве не врождённые; эпилепсия относится к неврологическим заболеваниям. Термины «психопатия» и «истерия» в МКБ-10 заменены (расстройства личности, диссоциативные расстройства).'
    suggestion: 'Назвать группу «состояния вследствие психических и неврологических заболеваний», обновить термины.'
