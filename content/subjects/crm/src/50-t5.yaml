# Тема 5. Роль памяти и мышления в деятельности пилотов и авиадиспетчеров (лекция 5, слайды e01–e06).
subsection: crm-t5

topics:
  - id: crm-memory
    title: Память и интеллект
    pages: [e01, e02, e03]
    theory:
      - kind: text
        title: Учебные вопросы темы 5
        body: 'Основные понятия и определения; этапы мышления и принятие решений; пути повышения продуктивности умственной деятельности. Время: 2 часа лекции и 2 часа практики.'
        src: e01
      - kind: definition
        title: Память
        body: |
          Память и мышление — психические процессы, имеющие определяющее значение в работе диспетчеров и пилотов.

          **Память** — сохранение информации о сигнале после того, как его действие прекратилось (**следовое** отражение опыта). В основе памяти лежат **ассоциации** — с точки зрения физиологии это временные нервные связи, то есть условные рефлексы. Память можно описать и как процесс формирования сети ассоциаций, которую человек «плетёт» всю жизнь.
        src: [e02, e03]
      - kind: list
        title: Процессы памяти
        body: |
          1. **Запоминание** (запечатление) — предпосылка сохранения. Непроизвольное — без цели и усилий; произвольное — с сознательной целью.
          2. **Сохранение** — активная переработка, систематизация, обобщение материала и овладение им. Зависит от глубины понимания, объёма применения знаний и установок личности.
          3. **Узнавание** — восстановление воспринятого ранее при **повторной встрече** с объектом.
          4. **Воспроизведение** — восстановление воспринятого ранее **в отсутствие** объекта: непроизвольное (запускается ассоциациями) или произвольное (целенаправленное).
        src: e02
      - kind: list
        title: Виды памяти
        body: |
          По тому, что запоминается:
          - **двигательная** — движения;
          - **эмоциональная** — эмоции и чувства;
          - **образная** — представления;
          - **словесно-логическая** — мысли в словесной форме.

          По времени хранения — **кратковременная** и **долговременная**.
        src: e03
      - kind: definition
        title: Интеллект
        body: 'Интеллект (лат. intellectus — ум) — условнорефлекторное образование из огромного числа условных рефлексов, выполняющее функцию алгоритмов переработки информации. Явления мира связаны причинно-следственными связями; задача человека — распознать и усвоить их, чтобы решать задачи. **Величина интеллекта задаётся числом усвоенных причинно-следственных связей.**'
        src: e03
    questions:
      - type: single
        cat: theory
        q: Что такое память?
        opts: ['Сохранение информации о сигнале после того, как его действие прекратилось', 'Отражение отдельных свойств предмета органами чувств', 'Процесс решения задачи', 'Реакция на ускорение']
        ans: a
        hint: Память — «следовое» отражение опыта.
        explain: Память — сохранение информации о сигнале после прекращения его действия.
        src: e02
      - type: single
        cat: theory
        q: Что лежит в основе памяти с физиологической точки зрения?
        opts: ['Ассоциации — временные нервные связи (условные рефлексы)', 'Безусловные рефлексы', 'Работа вестибулярного аппарата', 'Гормоны стресса']
        ans: a
        hint: Ассоциации — это условные рефлексы.
        explain: В основе памяти лежат ассоциации — временные нервные связи, то есть условные рефлексы.
        src: e02
      - type: sequence
        cat: theory
        q: Расположите процессы памяти в порядке, как они названы в лекции.
        seq: ['Запоминание', 'Сохранение', 'Узнавание', 'Воспроизведение']
        hint: Сначала нужно запомнить, в конце — воспроизвести.
        explain: Память складывается из запоминания, сохранения, узнавания и воспроизведения.
        src: e02
      - type: matching
        cat: theory
        q: Сопоставьте процесс памяти и его описание.
        pairs:
          - ['Узнавание', 'Восстановление воспринятого при повторной встрече с объектом']
          - ['Воспроизведение', 'Восстановление воспринятого в отсутствие объекта']
          - ['Непроизвольное запоминание', 'Запоминание без цели и усилий']
          - ['Произвольное запоминание', 'Запоминание с сознательной целью']
        hint: Узнавание — объект перед глазами, воспроизведение — его нет.
        explain: Узнавание — при встрече с объектом, воспроизведение — без него; произвольное запоминание предполагает цель.
        src: e02
      - type: matching
        cat: theory
        q: Сопоставьте вид памяти и что она хранит.
        pairs:
          - ['Двигательная', 'Движения']
          - ['Эмоциональная', 'Эмоции и чувства']
          - ['Образная', 'Представления']
          - ['Словесно-логическая', 'Мысли в словесной форме']
        hint: Название вида памяти подсказывает содержание.
        explain: Виды памяти выделяют по тому, что запоминается.
        src: e03
      - type: single
        cat: theory
        q: Чем, по лекции, задаётся величина интеллекта?
        opts: ['Числом усвоенных причинно-следственных связей', 'Объёмом кратковременной памяти', 'Скоростью реакции', 'Возрастом']
        ans: a
        hint: Интеллект — алгоритмы переработки информации на основе связей между явлениями.
        explain: Величина интеллекта задаётся числом усвоенных причинно-следственных связей.
        src: e03
      - type: multiple
        cat: theory
        q: От чего зависит процесс сохранения в памяти?
        opts: ['От глубины понимания', 'От объёма применения приобретённых знаний', 'От установок личности', 'От цвета учебника']
        ans: [a, b, c]
        hint: Один вариант не связан с переработкой материала.
        explain: Сохранение зависит от глубины понимания, объёма применения знаний и установок личности.
        src: e02

  - id: crm-thinking
    title: Мышление и принятие решений
    pages: [e04, e05]
    theory:
      - kind: definition
        title: Мышление
        body: |
          **Мышление** — психический процесс, связанный с деятельностью всего мозга: отражение предметов и явлений в их **существенных признаках**, познание действительности через раскрытие связей и отношений между ними.

          Восприятие отражает единичный предмет в его внешних чертах, а мышление — **общее в единичном, существенное в случайном**.
        src: e04
      - kind: list
        title: Этапы мыслительного процесса
        body: |
          Мышление возникает при двух условиях: умении отделить новое, необычное от известного и стремлении понять это новое.
          1. **Осознание и формулировка задачи.**
          2. **Решение задачи** — разложение явления на части (**анализ**) и установление новых связей и отношений (**синтез**).

          Анализ — дробление целого на части, выделение и абстрагирование признаков. Синтез — соединение частей и признаков, обобщение, группировка, создание целого.
        src: e04
      - kind: list
        title: Виды мышления
        body: |
          По схеме на слайде:
          - по степени развёрнутости — **дискурсивное** и **интуитивное**;
          - по новизне и оригинальности — **репродуктивное**, **продуктивное**, **критическое**;
          - по условиям познавательной деятельности — **реалистическое**, **аутистическое**, **эмоциональное**;
          - по характеру протекания — **интуитивное** и **аналитическое**;
          - по функциям — **абстрактное** и **конкретное**;
          - по характеру задач — **теоретическое** (понятийное, образное) и **практическое** (предметно-действенное, наглядно-образное, словесно-логическое).
        src: e04
      - kind: definition
        title: Суждение и умозаключение
        body: 'Основные формы мыслительного процесса — **суждение** и **умозаключение**. Умозаключение от частного к общему — **индуктивное**, от общего к частному — **дедуктивное**.'
        src: e05
      - kind: definition
        title: Вероятностное прогнозирование
        body: |
          **Вероятностное прогнозирование** (И. М. Фейгенберг, 1986) — способность сопоставлять информацию о текущей ситуации с прошлым опытом и строить предположения о предстоящих событиях, приписывая каждому определённую степень достоверности; это моделирование вероятностно организованного мира живущим в нём организмом.

          На прогноз влияют свойства нервной системы, интеллект, интуиция, прошлый опыт, характер ситуации, действия партнёра и рефлексия; результат — антиципация (предвосхищение) и собственные действия.
        src: e05
      - kind: list
        title: Когда прогноз авиаспециалиста эффективнее
        body: |
          - есть избыточность информации при непосредственном УВД;
          - диспетчер хорошо знаком с траекторией цели и её особенностями;
          - диспетчер подготовлен к управлению в данной зоне.
        src: e05
    questions:
      - type: single
        cat: theory
        q: Чем мышление отличается от восприятия?
        opts: ['Мышление отражает общее в единичном и существенное в случайном', 'Мышление отражает только внешние черты предмета', 'Мышление — это только запоминание', 'Мышление не связано с мозгом']
        ans: a
        hint: Восприятие отражает единичный предмет во внешних чертах.
        explain: Восприятие — отражение единичного в его внешних чертах, мышление — общего в единичном и существенного в случайном.
        src: e04
      - type: single
        cat: theory
        q: Какой этап мыслительной деятельности первый?
        opts: ['Осознание и формулировка задачи', 'Решение задачи', 'Проверка ответа', 'Синтез']
        ans: a
        hint: Нельзя решить задачу, которую не осознал.
        explain: Первый этап — осознание и формулировка задачи, второй — её решение.
        src: e04
      - type: matching
        cat: theory
        q: Сопоставьте мыслительную операцию и её содержание.
        pairs:
          - ['Анализ', 'Дробление целого на части, выделение признаков']
          - ['Синтез', 'Соединение частей, обобщение, создание целого']
        hint: Анализ — «разложение», синтез — «соединение».
        explain: Анализ разлагает явление на части, синтез устанавливает новые связи и создаёт целое.
        src: e04
      - type: matching
        cat: theory
        q: Сопоставьте вид умозаключения и направление рассуждения.
        pairs:
          - ['Индуктивное', 'От частного к общему']
          - ['Дедуктивное', 'От общего к частному']
        hint: Дедукция Шерлока Холмса — от общих законов к конкретному выводу.
        explain: Индукция — от частного к общему, дедукция — от общего к частному.
        src: e05
      - type: single
        cat: theory
        q: Что такое вероятностное прогнозирование?
        opts: ['Сопоставление текущей информации с прошлым опытом и построение предположений о будущих событиях с оценкой их достоверности', 'Расчёт вероятности отказа двигателя по справочнику', 'Прогноз погоды метеослужбой', 'Случайный выбор решения']
        ans: a
        hint: Термин ввёл И. М. Фейгенберг.
        explain: Это способность сопоставлять наличную ситуацию с прошлым опытом и строить предположения о предстоящих событиях, приписывая им степень достоверности.
        src: e05
      - type: multiple
        cat: theory
        q: При каких условиях эффективность прогноза диспетчера значительно повышается?
        opts: ['Есть избыточность информации', 'Диспетчер знаком с траекторией цели', 'Диспетчер подготовлен к работе в данной зоне', 'Диспетчер работает без отдыха']
        ans: [a, b, c]
        hint: Утомление не повышает качество прогноза.
        explain: Избыточность информации, знание траектории цели и подготовленность к зоне повышают эффективность прогноза.
        src: e05
      - type: matching
        cat: theory
        q: Сопоставьте основание классификации мышления и его виды.
        pairs:
          - ['По степени развёрнутости', 'Дискурсивное и интуитивное']
          - ['По функциям', 'Абстрактное и конкретное']
          - ['По новизне и оригинальности', 'Репродуктивное, продуктивное, критическое']
        hint: «Дискурсивное» — развёрнутое, по шагам.
        explain: Виды мышления по схеме на слайде.
        src: e04

  - id: crm-mental-productivity
    title: Пути повышения продуктивности умственной деятельности
    pages: [e06]
    theory:
      - kind: list
        id: crm-mental-productivity-ways
        title: Пути повышения продуктивности
        body: |
          1. Рациональное и полноценное питание — прежде всего достаточное количество животного белка.
          2. Рациональный режим труда, отдыха и сна; переключение на занятия другого профиля.
          3. Умеренная физическая работа.
          4. Обязательная интенсивная умственная работа, чередуемая с менее интенсивной.
          5. Обязательные периодические экстремальные усилия в умственной работе вплоть до глубокого утомления.

          Перерыв в таком тренинге не должен длиться больше 7–10 дней; прекращать регулярный тренинг нельзя всю жизнь — это ведёт к резкому снижению умственной работоспособности.
        errata: [crm-e04]
        src: e06
      - kind: list
        title: Виды умственного тренинга
        body: |
          - тренировка памяти — запоминание текстов, цифр, пересказ прочитанного;
          - **изложение мыслей письмом** — лучший способ развития и поддержания интеллектуального уровня;
          - решение разных задач;
          - творческая деятельность.
        src: e06
      - kind: list
        title: Поэтапное формирование умственных действий
        body: |
          Система поэтапного формирования умственных действий и понятий предполагает четыре условия:
          1. Формирование достаточной мотивации.
          2. Обеспечение правильного выполнения нового действия.
          3. Воспитание желаемых свойств действия.
          4. Превращение действия в умственное.
        src: e06
    questions:
      - type: multiple
        cat: theory
        q: Что относится к путям повышения продуктивности умственной деятельности?
        opts: ['Рациональное питание с достаточным количеством животного белка', 'Рациональный режим труда, отдыха и сна', 'Умеренная физическая работа', 'Полный отказ от умственной нагрузки']
        ans: [a, b, c]
        hint: Умственная работа, наоборот, нужна — с чередованием интенсивности.
        explain: Питание, режим труда и сна и умеренная физическая работа — пути повышения продуктивности; отказ от нагрузки снижает работоспособность.
        src: e06
      - type: numeric
        cat: theory
        q: 'Сколько дней максимум, по лекции, может длиться перерыв в режиме умственного тренинга?'
        num: { value: 10, unit: 'дн.', tol: 0, check: '10' }
        hint: На слайде указан диапазон 7–10 дней — нужна верхняя граница.
        explain: Выход из режима тренинга не должен продолжаться более 7–10 дней.
        src: e06
      - type: single
        cat: theory
        q: Какой вид тренинга назван лучшим способом развития и поддержания интеллектуального уровня?
        opts: ['Изложение мыслей письмом', 'Решение кроссвордов', 'Просмотр видео', 'Запоминание телефонных номеров']
        ans: a
        hint: Речь о письменной форме.
        explain: Изложение мыслей письмом — лучший способ развития и поддержания интеллектуального уровня.
        src: e06
      - type: sequence
        cat: theory
        q: Расположите условия поэтапного формирования умственных действий по порядку.
        seq: ['Формирование мотивации', 'Обеспечение правильного выполнения нового действия', 'Воспитание желаемых свойств действия', 'Превращение действия в умственное']
        hint: Начинается всё с мотивации, заканчивается переходом «во внутренний план».
        explain: Мотивация → правильное выполнение → желаемые свойства → умственное действие.
        src: e06
