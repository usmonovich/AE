        explain: Отбор, обоснование норм рабочего времени и анализ ошибок — задачи авиационной психологии; расчёт прочности — задача конструкторов.
        src: [a06, a07]
      - type: single
        cat: theory
        q: Куда включают результаты анализа ошибок диспетчеров и пилотов?
        opts: ['В отчёты комиссий по расследованию авиационных происшествий', 'В технический паспорт воздушного судна', 'В расписание рейсов', 'В метеосводки']
        ans: a
        hint: Речь о расследовании авиапроисшествий.
        explain: Материалы анализа ошибок включаются в отчёты комиссий по расследованию авиапроисшествий и другие издания.
        src: a07
      - type: single
        cat: theory
        q: Психологическую совместимость кого изучает и создаёт авиационная психология?
        opts: ['Членов экипажей и диспетчеров в диспетчерских сменах', 'Пассажиров в салоне', 'Сотрудников аэропортовых магазинов', 'Конструкторов самолёта']
        ans: a
        hint: Речь о тех, кто вместе работает над безопасностью полёта.
        explain: Задача — определение и создание психологической совместимости членов экипажей и диспетчеров в сменах.
        src: a07
      - type: text
        cat: theory
        q: Назовите любые три задачи авиационной психологии, связанные с работоспособностью и здоровьем авиаспециалистов.
        ref: 'Изучение работоспособности, утомления и помехоустойчивости; психологическое обоснование норм рабочего времени; выявление, профилактика и лечение психогенных расстройств.'
        criteria: ['работоспособность / утомление', 'нормы рабочего времени', 'психогенные расстройства']
        hint: Вспомните задачи, где есть слова «утомление», «рабочее время», «расстройства».
        explain: 'К этой группе относятся: изучение работоспособности, утомления и помехоустойчивости; обоснование норм рабочего времени; профилактика и лечение психогенных расстройств.'
        src: a06
      - type: single
        cat: theory
        q: Что изучает авиационная психология в части техники?
        opts: ['Эргономические недостатки воздушных судов и диспетчерских пунктов', 'Аэродинамику профиля крыла', 'Расход топлива двигателем', 'Прочность шасси']
        ans: a
        hint: Эргономика — приспособление техники к человеку.
        explain: Одна из задач — изучение эргономических недостатков воздушных судов и диспетчерских пунктов.
        src: a07

  - id: crm-aviapsy-methods
    title: Методы авиационной психологии
    pages: [a08, a09]
    theory:
      - kind: list
        title: Основные методы
        body: 'Наблюдение, эксперимент, тестирование, беседа, метод обобщения независимых характеристик.'
        src: a08
      - kind: definition
        title: Наблюдение
        body: |
          **Наблюдение** — изучение поведения человека в разных условиях **без вмешательства** в его деятельность.

          - **Включённое**: наблюдатель — активный член группы, в которой находится наблюдаемый. **Невключённое**: наблюдатель отстранён и не вступает в непосредственный контакт.
          - **Открытое**: наблюдаемый знает о наблюдении. **Скрытое**: не знает. Скрытое наблюдение позволяет видеть человека в естественных условиях и даёт больше информации.
        src: a08
      - kind: definition
        id: crm-aviapsy-methods-exp
        title: Эксперимент
        body: 'Эксперимент (лат. experimentum — проба, опыт) — научно поставленный опыт: явление изучается в точно учитываемых условиях по определённой программе, за ходом явления можно следить и воссоздать его при повторении условий. Разновидности: лабораторный, естественный и обучающийся эксперименты.'
        errata: [crm-e03]
        src: a08
      - kind: definition
        title: Тестирование
        body: 'Тестирование (лат. test — проба, испытание) — использование проб (тестовых заданий), чтобы выявить психические свойства и степень их проявления у разных людей или у одного человека в разные периоды.'
        src: a09
      - kind: definition
        title: Беседа
        body: 'Беседа — диалогический метод (**активное наблюдение**), чтобы выяснить ограниченный круг вопросов, трудно доступных при обычном (пассивном) наблюдении. Беседу проводят в доброжелательной, непринуждённой обстановке, устранив всё, что вызывает напряжённость, настороженность и недоверие. Методы воздействия в беседе — **убеждение и внушение**.'
        src: a09
      - kind: definition
        title: Метод обобщения независимых характеристик
        body: 'Полная характеристика личности составляется, если соединить данные о психике, полученные в **разных условиях труда и быта**. Обобщение включает анализ, сопоставление, выделение главного и синтез собранного материала.'
        src: a09
    questions:
      - type: multiple
        cat: theory
        q: Какие методы использует авиационная психология?
        opts: ['Наблюдение', 'Эксперимент', 'Тестирование', 'Беседа', 'Рентгенография']
        ans: [a, b, c, d]
        hint: 'Методов пять, один из них — «обобщение независимых характеристик»; рентгенография — медицинский метод.'
        explain: 'Методы: наблюдение, эксперимент, тестирование, беседа, метод обобщения независимых характеристик.'
        src: a08
      - type: single
        cat: theory
        q: Какое наблюдение даёт возможность видеть человека в естественных условиях и несёт больший объём информации?
        opts: ['Скрытое', 'Открытое', 'Лабораторное', 'Тестовое']
        ans: a
        hint: Человек не знает, что за ним наблюдают.
        explain: Скрытое наблюдение позволяет наблюдать человека в естественных условиях и даёт больше информации.
        src: a08
      - type: matching
        cat: theory
        q: Сопоставьте вид наблюдения и его описание.
        pairs:
          - ['Включённое', 'Наблюдатель — активный член группы наблюдаемого']
          - ['Невключённое', 'Наблюдатель отстранён, не вступает в контакт']
          - ['Открытое', 'Наблюдаемый знает о наблюдении']
          - ['Скрытое', 'Наблюдаемый не знает о наблюдении']
        hint: Два деления — по взаимодействию и по осведомлённости наблюдаемого.
        explain: 'По характеру взаимодействия — включённое и невключённое; по осведомлённости — открытое и скрытое.'
        src: a08
      - type: single
        cat: theory
        q: Какой метод называют «активным наблюдением»?
        opts: ['Беседу', 'Эксперимент', 'Тестирование', 'Скрытое наблюдение']
        ans: a
        hint: Это диалогический метод.
        explain: Беседа — диалогический метод (активное наблюдение).
        src: a09
      - type: multiple
        cat: theory
        q: Какие методы воздействия применяются в беседе?
        opts: ['Убеждение', 'Внушение', 'Наказание', 'Тестирование']
        ans: [a, b]
        hint: На слайде два метода воздействия.
        explain: Методы воздействия — убеждение и внушение.
        src: a09
      - type: single
        cat: theory
        q: На чём основан метод обобщения независимых характеристик?
        opts: ['На соединении данных о психике, полученных в разных условиях труда и быта', 'На одном тесте, проведённом в лаборатории', 'Только на самооценке человека', 'На медицинских анализах']
        ans: a
        hint: «Независимые» — значит полученные в разных условиях.
        explain: Для полной характеристики личности соединяют данные о психике, полученные в разных условиях труда и быта, и анализируют их.
        src: a09
      - type: single
        cat: theory
        q: Чем эксперимент отличается от наблюдения?
        opts: ['Явление изучается в точно учитываемых условиях по программе и может быть воспроизведено', 'Исследователь не вмешивается в деятельность человека', 'Проводится только в форме диалога', 'Используются только тестовые задания']
        ans: a
        hint: Наблюдение — без вмешательства; эксперимент — научно поставленный опыт.
        explain: Эксперимент — научно поставленный опыт в точно учитываемых условиях по определённой программе с возможностью воспроизведения.
        src: a08
