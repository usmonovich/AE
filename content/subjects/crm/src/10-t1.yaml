# Тема 1. Предмет, цели и задачи авиационной психологии (лекция 1, слайды a01–a09).
subsection: crm-t1

topics:
  - id: crm-aviapsy-basics
    title: Предмет и цель авиационной психологии
    pages: [a01, a02, a04, a05]
    theory:
      - kind: text
        title: Программа дисциплины
        body: |
          Дисциплина «Авиационная психология и управление ресурсами экипажа» рассчитана на 14 тем и итоговый экзамен: всего 50 часов — 24 часа лекций и 24 часа практики.

          - Темы 1–4 — предмет авиационной психологии, условия лётной деятельности, работа авиадиспетчера, лётные иллюзии.
          - Темы 5–9 — память и мышление, утомление, темперамент и характер, эмоциональная напряжённость, невротические расстройства.
          - Темы 10–14 — управление ресурсами экипажа (CRM): взаимодействие в экипаже, наставничество инструкторов, взаимодействие экипажа и диспетчеров, психотерапевтические правила общения.
        src: [a01, a02]
      - kind: text
        title: Учебные вопросы темы 1
        body: 'Основные понятия и определения; задачи авиационной психологии; основные методы авиационной психологии. Основная литература курса — учебник Д. А. Евстигнеева «Авиационная психология» и руководство ИКАО по человеческому фактору Doc 9683.'
        src: a04
      - kind: definition
        title: Авиационная психология
        body: 'Авиационная психология (лат. aves — птицы, гр. psyche — душа + logos — учение) — наука о законах психической деятельности авиационных специалистов в профессиональных условиях. **Предмет** авиационной психологии — психика авиаспециалиста.'
        src: a05
      - kind: rule
        title: Цель авиационной психологии
        body: 'Авиационная психология — преимущественно **прикладная** наука. Её основная цель — **снизить долю авиационной аварийности, связанной с человеческим фактором**. По сути это наука о психофизиологических опасных факторах полёта и о противодействии им.'
        src: a05
      - kind: definition
        title: Психика
        body: 'Психика — совокупность безусловных и условных рефлексов. Условные рефлексы формируются в течение жизни и обеспечивают наилучшее приспособление организма к среде.'
        src: a05
      - kind: note
        title: Как понять психику конкретного человека
        body: 'Основное наполнение психики — условные рефлексы, приобретённые в течение жизни. Поэтому психику конкретного человека можно понять, восстановив по порядку историю формирования его условных рефлексов.'
        src: a05
    questions:
      - type: single
        cat: theory
        q: Что является предметом авиационной психологии?
        opts: ['Психика авиаспециалиста', 'Конструкция воздушного судна', 'Правила использования воздушного пространства', 'Физиология полёта птиц']
        ans: a
        hint: Подумайте, что изучает любая психология — только здесь у конкретного специалиста.
        explain: Предмет авиационной психологии — психика авиаспециалиста.
        src: a05
      - type: single
        cat: theory
        q: Какова основная цель авиационной психологии как прикладной науки?
        opts: ['Снизить долю авиационной аварийности, связанной с человеческим фактором', 'Повысить скорость и дальность полёта', 'Сократить расходы авиакомпаний', 'Разработать новые авиационные приборы']
        ans: a
        hint: Авиационная психология изучает опасные психофизиологические факторы полёта.
        explain: Основная цель — снижение доли аварийности, связанной с человеческим фактором.
        src: a05
      - type: single
        cat: theory
        q: Из чего, согласно лекции, состоит психика?
        opts: ['Из безусловных и условных рефлексов', 'Только из врождённых инстинктов', 'Только из знаний, полученных при обучении', 'Из ощущений и эмоций']
        ans: a
        hint: Одни рефлексы даны от рождения, другие формируются при жизни.
        explain: Психика — совокупность безусловных и условных рефлексов; условные формируются прижизненно.
        src: a05
      - type: single
        cat: theory
        q: Как, по лекции, можно понять содержание психики конкретного человека?
        opts: ['Восстановив по порядку историю формирования его условных рефлексов', 'Измерив его рост и вес', 'Только по результатам одного теста', 'По его типу воздушного судна']
        ans: a
        hint: Основное наполнение психики — условные рефлексы, приобретённые за жизнь.
        explain: Понимание психики возможно через восстановление в хронологическом порядке истории формирования условных рефлексов.
        src: a05
      - type: matching
        cat: theory
        q: Сопоставьте часть слова «авиационная психология» и её значение.
        pairs:
          - ['aves (лат.)', 'птицы']
          - ['psyche (гр.)', 'душа']
          - ['logos (гр.)', 'учение']
        hint: Психология — «учение о душе».
        explain: 'Aves — птицы, psyche — душа, logos — учение.'
        src: a05
      - type: numeric
        cat: theory
        q: Сколько тем входит в программу дисциплины (без итогового экзамена)?
        num: { value: 14, unit: '', tol: 0, check: '14' }
        hint: Посмотрите перечень тем на втором слайде лекции 1.
        explain: В программе 14 тем; 15-я неделя — итоговый экзамен.
        src: a02

  - id: crm-aviapsy-tasks
    title: Задачи авиационной психологии
    pages: [a06, a07]
    theory:
      - kind: list
        title: 'Задачи: отбор, пригодность и психические процессы'
        body: |
          - определение профессиональной пригодности авиаспециалистов;
          - выявление специальных способностей лётного и диспетчерского персонала;
          - профессиональный отбор кандидатов на обучение авиационным специальностям;
          - изучение профессиональной деятельности, чтобы описать опасные явления при управлении самолётом или воздушным движением;
          - психологическая экспертиза лётного и диспетчерского персонала;
          - изучение особенностей психических процессов авиаспециалистов;
          - изучение работоспособности, утомления и помехоустойчивости;
          - психологическое обоснование норм рабочего времени;
          - выявление, профилактика и лечение психогенных расстройств.
        src: a06
      - kind: list
        title: 'Задачи: ошибки, коллектив, обучение и эргономика'
        body: |
          - анализ ошибок диспетчеров и пилотов — с включением результатов в отчёты комиссий по расследованию авиационных происшествий;
          - определение и создание психологической совместимости членов экипажа и диспетчеров в сменах;
          - адаптация лётного и диспетчерского состава к операторскому труду;
          - разработка методов урегулирования конфликтов в авиационных коллективах (экипаж, диспетчерская смена);
          - выявление психологических закономерностей взаимодействия пилота-инструктора с обучаемым — для методики лётного обучения;
          - изучение эргономических недостатков воздушных судов и диспетчерских пунктов.
        src: a07
    questions:
      - type: multiple
        cat: theory
        q: Какие из перечисленных вопросов относятся к задачам авиационной психологии?
        opts: ['Профессиональный отбор кандидатов на обучение', 'Психологическое обоснование норм рабочего времени', 'Расчёт прочности крыла', 'Анализ ошибок пилотов и диспетчеров']
        ans: [a, b, d]
