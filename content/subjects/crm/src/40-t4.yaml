# Тема 4. Лётные иллюзии (лекция 4, слайды d01–d05).
subsection: crm-t4

topics:
  - id: crm-illusions-basics
    title: Лётные иллюзии и их классификации
    pages: [d01, d02, d03]
    theory:
      - kind: text
        title: Учебные вопросы темы 4
        body: 'Основные понятия и определения; виды иллюзий и их характеристика; факторы, снижающие риск возникновения лётных иллюзий. Время: 2 часа лекции.'
        src: d01
      - kind: definition
        title: Лётные иллюзии
        body: |
          **Лётные иллюзии** (лат. illusio — ошибка) — ложные образы действительности, возникающие у членов экипажа в полёте.

          Это **не патология**: иллюзии возникают у совершенно здоровых пилотов, потому что анализаторы эволюционировали на земле, а в воздухе работают в непривычной среде — на пределе или за пределом своей разрешающей способности.
        src: d02
      - kind: rule
        title: Почему знать иллюзии — условие безопасности
        body: |
          - Всё, что ухудшает состояние анализаторов, повышает вероятность иллюзий: за изменением порога чувствительности следует изменение восприятия.
          - Иллюзии бывают практически у всех пилотов, но проявляются у каждого по-разному; одна и та же по механизму иллюзия может выглядеть по-разному, поэтому их трудно классифицировать.
          - Знание механизмов иллюзий и авиационных событий, вызванных ими, — непременное условие безопасности полётов.
        src: d02
      - kind: list
        title: Основания классификации иллюзий
        body: |
          - **этап полёта** — руление, разбег, взлёт, набор высоты, маршрут, снижение, полёт по кругу, заход на посадку, выравнивание, посадка, пробег;
          - **параметры полёта** — крен, тангаж, скорость, высота, вертикальная скорость, скольжение, курс, дальность, разворот;
          - время суток и время года;
          - **режим полёта** — визуальный или приборный;
          - профессия — пилот, штурман, бортинженер;
          - **модальность** (ведущий анализатор) — зрительные, зрительно-вестибулярные, вестибулярные;
          - тип — индивидуальные или групповые;
          - уровень переработки информации — ошибки суждений при восприятии или ошибки представлений;
          - метеоусловия — простые или сложные.
        src: d03
      - kind: list
        title: Одиннадцать групп иллюзий
        body: 'Иллюзии крена, тангажа, высоты, скорости полёта, вертикальной скорости, скольжения, курса, дальности, разворота самолёта, иллюзии при использовании посадочных фар и иллюзии восприятия объектов пространства.'
        src: d03
    questions:
      - type: single
        cat: theory
        q: Что такое лётные иллюзии?
        opts: ['Ложные образы действительности, возникающие у членов экипажа в полёте', 'Психические заболевания пилотов', 'Неисправности авиационных приборов', 'Оптические эффекты остекления кабины']
        ans: a
        hint: 'Illusio по-латыни — «ошибка».'
        explain: Лётные иллюзии — ложные образы действительности, возникающие у членов экипажа в полёте.
        src: d02
      - type: single
        cat: theory
        q: Являются ли лётные иллюзии признаком болезни?
        opts: ['Нет, они возникают и у совершенно здоровых пилотов из-за необычных условий полёта', 'Да, это признак невроза', 'Да, это признак нарушения зрения', 'Только у пилотов старше 50 лет']
        ans: a
        hint: Анализаторы эволюционировали на земле.
        explain: 'Иллюзии не патологичны: они возникают у здоровых пилотов, потому что в воздухе анализаторы работают в непривычной среде.'
        src: d02
      - type: single
        cat: theory
        q: Что повышает вероятность возникновения лётных иллюзий?
        opts: ['Всё, что ухудшает состояние анализаторных систем', 'Хорошая погода', 'Опыт пилота', 'Доверие к приборам']
        ans: a
        hint: За изменением порога чувствительности идёт изменение восприятия.
        explain: Всё, что ухудшает состояние анализаторов, увеличивает вероятность лётных иллюзий.
        src: d02
      - type: matching
        cat: theory
        q: Сопоставьте основание классификации и пример.
        pairs:
          - ['Этап полёта', 'Выравнивание, посадка, пробег']
          - ['Параметр полёта', 'Крен, тангаж, скорость']
          - ['Модальность', 'Зрительные, вестибулярные']
          - ['Режим полёта', 'Визуальный или приборный']
        hint: Модальность — какой анализатор «ведущий».
        explain: Классификация идёт сразу по нескольким основаниям.
        src: d03
      - type: numeric
        cat: theory
        q: На сколько групп сгруппированы рассматриваемые лётные иллюзии?
        num: { value: 11, unit: '', tol: 0, check: '11' }
        hint: Вспомните список от иллюзий крена до иллюзий восприятия объектов пространства.
        explain: Иллюзии сгруппированы в 11 групп.
        src: d03
      - type: multiple
        cat: theory
        q: Какие группы входят в одиннадцать групп лётных иллюзий?
        opts: ['Иллюзии крена', 'Иллюзии высоты', 'Иллюзии при использовании посадочных фар', 'Иллюзии расписания']
        ans: [a, b, c]
        hint: Все группы связаны с пространственным положением и восприятием в полёте.
        explain: Крен, высота и посадочные фары — среди 11 групп; «иллюзий расписания» нет.
        src: d03

  - id: crm-illusions-types
    title: Зрительные, зрительно-вестибулярные и вестибулярные иллюзии
    pages: [d04]
    theory:
      - kind: definition
        title: Зрительные иллюзии
        body: |
          Наиболее распространено деление иллюзий на **зрительные, зрительно-вестибулярные и вестибулярные**.

          **Зрительные иллюзии** резко усложняют управление самолётом и часто приводят к авиационным событиям. Их основная причина — ошибки переработки информации от зрительного анализатора. Примеры: переоценка высоты препятствий в створе ВПП, нарушение восприятия высоты полёта, иллюзия поворачивания горизонта, «фальшивый горизонт», «звёздное окружение» («звёзды кругом»), «полуденный мираж».
        src: d04
      - kind: definition
        title: Зрительно-вестибулярные иллюзии
        body: |
          Возникают при **равном участии** зрительного и вестибулярного анализаторов, связанных множеством безусловнорефлекторных связей: раздражение вестибулярного аппарата закономерно вызывает зрительные иллюзии, сужение объёма внимания и ошибки в определении положения предметов. Последствия:
          - стресс;
          - внимание уходит на подавление иллюзии и отвлекается от пилотирования;
          - неадекватные управляющие действия (противодействие крену, его парирование).
        src: d04
      - kind: list
        title: Вестибулярные иллюзии
        body: 'Иллюзии крена, кабрирования (пикирования), противовращения и изменённого восприятия скорости полёта.'
        src: d04
    questions:
      - type: single
        cat: theory
        q: Какова основная причина зрительных иллюзий?
        opts: ['Ошибки переработки информации от зрительного анализатора', 'Неисправность приборов', 'Перегрузки', 'Недостаток кислорода']
        ans: a
        hint: Причина — в обработке зрительной информации мозгом.
        explain: Основная причина зрительных иллюзий — ошибки в процессе переработки информации от зрительного анализатора.
        src: d04
      - type: multiple
        cat: theory
        q: Какие из иллюзий относятся к зрительным?
        opts: ['«Фальшивый горизонт»', '«Звёзды кругом»', '«Полуденный мираж»', 'Иллюзия противовращения']
        ans: [a, b, c]
        hint: Противовращение связано с вестибулярным аппаратом.
        explain: '«Фальшивый горизонт», «звёзды кругом» и «полуденный мираж» — зрительные; противовращение — вестибулярная иллюзия.'
        src: d04
      - type: single
        cat: theory
        q: Какие анализаторы участвуют в зрительно-вестибулярных иллюзиях?
        opts: ['Зрительный и вестибулярный — в равной мере', 'Только слуховой', 'Только вестибулярный', 'Обонятельный и вкусовой']
        ans: a
        hint: Название говорит само за себя.
        explain: Зрительно-вестибулярные иллюзии возникают при равном участии зрительного и вестибулярного анализаторов.
        src: d04
      - type: multiple
        cat: theory
        q: В чём проявляется отрицательное влияние зрительно-вестибулярной иллюзии?
        opts: ['Возникает стресс', 'Внимание отвлекается от пилотирования на подавление иллюзии', 'Пилот выполняет неадекватные управляющие действия', 'Улучшается глазомер']
        ans: [a, b, c]
        hint: Один вариант — положительный эффект, которого нет.
        explain: Стресс, отвлечение внимания и неадекватные действия (противодействие крену) — последствия иллюзии.
        src: d04
      - type: matching
        cat: theory
        q: Сопоставьте иллюзию и её вид.
        pairs:
          - ['«Фальшивый горизонт»', 'Зрительная']
          - ['Иллюзия противовращения', 'Вестибулярная']
          - ['Зрительные ошибки и сужение внимания при раздражении вестибулярного аппарата', 'Зрительно-вестибулярная']
        hint: Вестибулярные иллюзии связаны с ускорениями, а не с картинкой за окном.
        explain: '«Фальшивый горизонт» — зрительная; противовращение — вестибулярная; если в иллюзии в равной мере участвуют оба анализатора — зрительно-вестибулярная.'
        src: d04

  - id: crm-illusions-prevention
    title: Как снизить риск лётных иллюзий
    pages: [d05]
    theory:
      - kind: list
        title: Факторы, снижающие риск иллюзий
        body: |
          1. Анализ причин авиационных событий, связанных с искажённым восприятием действительности.
          2. Соматическое здоровье — не только по стандартным медосмотрам, но и по функциональной диагностике, выявляющей стёртые формы болезней и предболезненные состояния.
          3. Эмоциональная устойчивость, отсутствие неврозов, утомления и переутомления. Неврозы трудно диагностировать; они опасны и тем, что вызывают неадекватное восприятие приборов и слов членов экипажа.
          4. Отсутствие серьёзных вегетативных реакций при раздражении вестибулярного аппарата.
          5. Тренировка вестибулярного аппарата — физподготовкой и специальными занятиями; полезны виды спорта с резкими и частыми поворотами головы и тела.
          6. Лётное мастерство, регулярные тренировки на тренажёрах и в реальных сложных метеоусловиях, рациональное распределение обязанностей в экипаже.
          7. **Доверие к показаниям авиационных приборов.**
        src: d05
    questions:
      - type: multiple
        cat: theory
        q: Какие факторы снижают риск возникновения лётных иллюзий?
        opts: ['Доверие к показаниям авиационных приборов', 'Тренировка вестибулярного аппарата', 'Эмоциональная устойчивость', 'Полёты без отдыха']
        ans: [a, b, c]
        hint: Утомление, наоборот, повышает риск.
        explain: Доверие к приборам, тренировка вестибулярного аппарата и эмоциональная устойчивость снижают риск; утомление его повышает.
        src: d05
      - type: single
        cat: theory
        q: Какие виды спорта рекомендуются пилотам для тренировки вестибулярного аппарата?
        opts: ['С резкими и частыми поворотами головы и тела', 'Только бег на длинные дистанции', 'Шахматы', 'Стрельба из лука']
        ans: a
        hint: Вестибулярный аппарат реагирует на ускорения и повороты.
        explain: Пилотам рекомендуются виды спорта с резкими и частыми поворотами головы и тела.
        src: d05
      - type: single
        cat: theory
        q: Почему неврозы особенно опасны для безопасности полётов?
        opts: ['Способствуют иллюзиям и неадекватному восприятию приборов и слов членов экипажа', 'Из-за них пилот медленнее ходит', 'Они всегда легко диагностируются', 'Они повышают остроту зрения']
        ans: a
        hint: Неврозы часто трудно диагностируются.
        explain: Неврозы могут способствовать иллюзиям и неадекватному восприятию показаний приборов и высказываний членов экипажа.
        src: d05
      - type: single
        cat: theory
        q: Что даёт функциональная диагностика в дополнение к стандартному медосмотру?
        opts: ['Информацию о стёртых формах болезней и предболезненных состояниях', 'Оценку навыков пилотирования', 'Результаты экзамена по английскому языку', 'Данные о погоде']
        ans: a
        hint: Речь о соматическом здоровье.
        explain: Функциональная диагностика выявляет стёртые формы болезней и предболезненные состояния.
        src: d05
