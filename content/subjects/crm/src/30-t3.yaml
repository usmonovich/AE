# Тема 3. Авиадиспетчер в системе УВД (лекция 3, слайды c02–c07; слайд c01 пустой).
subsection: crm-t3

topics:
  - id: crm-atc-stages
    title: Этапы деятельности авиадиспетчера
    pages: [c02, c03]
    theory:
      - kind: text
        title: Учебные вопросы темы 3
        body: 'Основные этапы деятельности авиадиспетчера; модели управления воздушным движением; качества, необходимые диспетчеру для успешного УВД. Время: 2 часа лекции и 2 часа практики.'
        src: c02
      - kind: list
        title: Этапы деятельности диспетчера УВД
        body: |
          1. Постоянное слежение за воздушной обстановкой — восприятие и анализ поступающей информации.
          2. Формирование целостной модели воздушного пространства с находящимися в нём воздушными судами.
          3. Планирование своих действий по этой модели.
          4. Выполнение запланированных действий.
          5. Оценка и контроль результатов; анализ и обобщение информации.
        src: c03
      - kind: list
        title: От чего зависит успешность этапов
        body: |
          - от **задания** — заранее сформулированных целей деятельности;
          - от **информации** — её полноты, точности, своевременности и надёжности;
          - от состояния и предельных возможностей **автоматизированных систем** управления;
          - от **методов работы** — последовательности операций, ведущих к результату;
          - от **условий** деятельности;
          - от **организации УВД** — контроля выполнения обязанностей, распределения полномочий;
          - от самого **авиадиспетчера** — его физических, психологических и физиологических характеристик.
        src: c03
    questions:
      - type: sequence
        cat: theory
        q: Расположите этапы деятельности диспетчера УВД по порядку.
        seq: ['Слежение за воздушной обстановкой, восприятие и анализ информации', 'Формирование модели воздушного пространства', 'Планирование действий', 'Выполнение запланированных действий', 'Оценка и контроль результатов']
        hint: Сначала диспетчер воспринимает, потом понимает, планирует, действует и проверяет.
        explain: 'Слежение → модель → планирование → выполнение → оценка и контроль.'
        src: c03
      - type: multiple
        cat: theory
        q: Какие свойства информации, которой располагает диспетчер, влияют на успешность его работы?
        opts: ['Полнота', 'Точность', 'Своевременность', 'Надёжность', 'Красочность']
        ans: [a, b, c, d]
        hint: Лишнее свойство относится к оформлению, а не к содержанию.
        explain: Важны полнота, точность, своевременность и надёжность информации.
        src: c03
      - type: single
        cat: theory
        q: Что в лекции названо «заданием» диспетчера?
        opts: ['Заранее сформулированные цели деятельности', 'Список воздушных судов в зоне', 'Расписание смен', 'Инструкция по эксплуатации радиолокатора']
        ans: a
        hint: Задание определяет, к чему стремится диспетчер.
        explain: Задание — заранее сформулированные цели деятельности.
        src: c03
      - type: single
        cat: theory
        q: На каком этапе диспетчер строит целостную картину воздушного пространства с воздушными судами?
        opts: ['На втором — формирование модели воздушного пространства', 'На первом — слежение', 'На четвёртом — выполнение действий', 'На пятом — контроль']
        ans: a
        hint: Сначала нужно получить информацию, затем из неё складывается картина.
        explain: После слежения формируется целостная модель воздушного пространства.
        src: c03

  - id: crm-atc-models
    title: Модели УВД, загруженность и пропускная способность
    pages: [c04, c05, c06]
    theory:
      - kind: definition
        title: Информационная модель
        body: 'Информационная модель — организованное по определённым правилам отображение реальной обстановки на средствах индикации. Хорошо спроектированная информационная модель позволяет **прогнозировать** обстановку, что особенно важно при быстро меняющихся информационных потоках.'
        src: c04
      - kind: definition
        title: Концептуальная модель
        body: |
          **Концептуальная модель** — представление в сознании диспетчера о воздушной обстановке в целом, о факторах, ведущих к опасным ситуациям, и о способах перейти от конфликтной ситуации к бесконфликтной. Это набор образов реальной и прогнозируемой обстановки и знаний о возможных и необходимых управляющих действиях.
          - **Постоянная** концептуальная модель создаётся при обучении и практике: обобщённое знание о возможных и допустимых состояниях обстановки, задачах УВД, способах их решения, возможных нарушениях технологии и их последствиях.
          - **Оперативная** концептуальная модель — это модель принятия решения. Её механизмы — сличение ситуации с ранее сформулированными гипотезами и прогнозирование.
        src: c04
      - kind: text
        title: Напряжённость работы диспетчера
        body: 'Работа диспетчеров и пилотов эмоционально насыщенна и богата психотравмирующими раздражителями. Поэтому у авиаспециалистов часто возникают невротические состояния с нарушениями вегетативных функций — **психосоматические заболевания**: чаще всего гипертония, язвенная болезнь желудка и двенадцатиперстной кишки, головные боли.'
        src: c05
      - kind: list
        title: Загруженность диспетчера и её факторы
        body: |
          **Загруженность** — занятость диспетчера выполнением технологических операций по УВД; от неё зависит величина нервно-психического напряжения. Факторы:
          - интенсивность воздушного движения;
          - размер и структура контролируемого воздушного пространства;
          - оснащённость пункта и степень автоматизации;
          - правила полётов в зоне и ограничения на поток;
          - эргономика рабочего места;
          - соматическое и нервно-психическое здоровье;
          - возраст и индивидуальные особенности личности;
          - психологический климат в коллективе;
          - стиль руководства сменой и организация работы на предприятии.
        src: c05
      - kind: definition
        title: Пропускная способность
        body: 'Предельно допустимая загруженность определяет **пропускную способность** диспетчера — **максимальное количество воздушных судов, которое он может обслужить в единицу времени** при надёжном и безопасном УВД, заданной структуре воздушного пространства, характеристиках движения, технологии работы и имеющихся средствах навигации и связи.'
        src: c06
      - kind: list
        title: Группы информации о воздушном движении
        body: |
          1. О ходе полёта отдельных самолётов и их состоянии на данный момент.
          2. О воздушном движении в целом — распределении самолётов по горизонтали и вертикали и тенденции его изменения.
          3. О метеорологической обстановке.
          4. О технической оснащённости и состоянии аэропортов (радиолокационные средства посадки, огни, состояние ВПП, характеристики типов самолётов, запас топлива, устойчивость радиосвязи).
        src: c06
    questions:
      - type: single
        cat: theory
        q: Что такое информационная модель в УВД?
        opts: ['Организованное по правилам отображение реальной обстановки на средствах индикации', 'Представление о воздушной обстановке в сознании диспетчера', 'Модель принятия решения', 'План полёта воздушного судна']
        ans: a
        hint: Информационная модель — то, что выводится на экраны.
        explain: Информационная модель — отображение обстановки на средствах индикации по определённым правилам.
        src: c04
      - type: matching
        cat: theory
        q: Сопоставьте модель и её описание.
        pairs:
          - ['Информационная модель', 'Отображение обстановки на средствах индикации']
          - ['Постоянная концептуальная модель', 'Обобщённое знание, созданное обучением и практикой']
          - ['Оперативная концептуальная модель', 'Модель принятия решения в конкретной ситуации']
        hint: Постоянная — «навсегда», оперативная — «здесь и сейчас».
        explain: Информационная модель — на экране; постоянная концептуальная — в опыте; оперативная — модель решения.
        src: c04
      - type: multiple
        cat: theory
        q: Какие механизмы регулируют поиск решения в оперативной концептуальной модели?
        opts: ['Сличение ситуации с ранее сформулированными гипотезами', 'Прогнозирование', 'Случайный выбор', 'Ожидание указаний руководителя']
        ans: [a, b]
        hint: На слайде названо два механизма.
        explain: Основные механизмы — сличение ситуации с гипотезами и прогнозирование деятельности.
        src: c04
      - type: single
        cat: theory
        q: Что называют пропускной способностью диспетчера?
        opts: ['Максимальное количество воздушных судов, которое он может обслужить в единицу времени', 'Количество смен в месяц', 'Скорость передачи радиосообщений', 'Число ВПП в аэропорту']
        ans: a
        hint: Пропускную способность определяет предельно допустимая загруженность.
        explain: Пропускная способность — максимальное количество воздушных судов, обслуживаемых диспетчером в единицу времени при безопасном УВД.
        src: c06
      - type: multiple
        cat: theory
        q: Какие факторы непосредственно влияют на загруженность авиадиспетчера?
        opts: ['Интенсивность воздушного движения', 'Степень автоматизации', 'Психологический климат в коллективе', 'Цвет формы диспетчера']
        ans: [a, b, c]
        hint: Один вариант не влияет на работу.
        explain: Интенсивность движения, автоматизация и климат в коллективе входят в список факторов загруженности.
        src: c05
      - type: multiple
        cat: theory
        q: Какие психосоматические заболевания названы самыми распространёнными у авиаспециалистов?
        opts: ['Гипертония', 'Язвенная болезнь желудка и двенадцатиперстной кишки', 'Головные боли', 'Близорукость']
        ans: [a, b, c]
        hint: Близорукость не относится к психосоматическим заболеваниям.
        explain: Наиболее распространены гипертония, язвенная болезнь и головные боли.
        src: c05
      - type: single
        cat: theory
        q: К какой группе относится информация о состоянии ВПП и сигнальных огней?
        opts: ['О технической оснащённости и состоянии аэропортов', 'О метеорологической обстановке', 'О воздушном движении в целом', 'О ходе полёта отдельного самолёта']
        ans: a
        hint: Огни и ВПП — оборудование аэропорта.
        explain: Это группа информации о технической оснащённости и состоянии аэропортов.
        src: c06

  - id: crm-atc-qualities
    title: Профессиональные качества авиадиспетчера
    pages: [c07]
    theory:
      - kind: list
        title: По каким качествам оценивают успешность диспетчера
        body: |
          - умение выделить главное в потоке информации и оценить воздушную обстановку;
          - своевременность команд и соблюдение последовательности операций;
          - самостоятельность, быстрота и правильность принятия решений;
          - надёжность работы при усложнении обстановки;
          - быстрота переключения внимания;
          - быстрота ознакомления с обстановкой при приёме смены;
          - своевременное и точное выполнение указаний руководителя;
          - умение предвидеть изменение обстановки;
          - умение при необходимости перейти к резервным средствам УВД;
          - активность в уточнении информации на инструктаже;
          - умение спокойно вести переговоры по громкоговорящей связи (ГГС).
        src: c07
      - kind: list
        title: Дополнительные признаки
        body: 'Для заключения о профессиональной успешности также определяют: допускает ли диспетчер нарушения технологии работы; вносит ли предложения по совершенствованию службы; опаздывает ли на работу; были ли по его вине предпосылки к авиасобытиям.'
        src: c07
    questions:
      - type: multiple
        cat: theory
        q: Какие качества используют для оценки профессиональной успешности авиадиспетчера?
        opts: ['Умение выделить основное в потоке информации', 'Быстрота переключения внимания', 'Умение предвидеть изменение воздушной обстановки', 'Знание иностранных блюд']
        ans: [a, b, c]
        hint: Один вариант не связан с УВД.
        explain: Выделение главного, переключение внимания и предвидение обстановки — качества успешного диспетчера.
        src: c07
      - type: single
        cat: theory
        q: Как, по лекции, диспетчер должен вести переговоры по громкоговорящей связи?
        opts: ['В спокойной манере', 'Как можно громче', 'Только короткими командами без пояснений', 'Через руководителя смены']
        ans: a
        hint: Эмоциональное напряжение передаётся собеседнику.
        explain: Одно из качеств — умение вести переговоры по ГГС в спокойной манере.
        src: c07
      - type: text
        cat: theory
        q: Какие дополнительные признаки, кроме профессиональных качеств, учитывают при заключении о профессиональной успешности диспетчера?
        ref: 'Допускает ли нарушения технологии работы; вносит ли предложения по совершенствованию службы; опаздывает ли на работу; были ли предпосылки к авиасобытиям по его вине.'
        criteria: ['нарушения технологии', 'предложения по совершенствованию', 'опоздания', 'предпосылки к авиасобытиям']
        hint: Четыре признака — о дисциплине, инициативе и безопасности.
        explain: Учитывают нарушения технологии, предложения по улучшению работы, опоздания и предпосылки к авиасобытиям по его вине.
        src: c07
      - type: single
        cat: theory
        q: Что должен уметь диспетчер при отказе основных средств УВД?
        opts: ['Перейти к резервным средствам УВД', 'Прекратить управление до ремонта', 'Передать всю зону соседнему пункту без согласования', 'Ждать указаний экипажей']
        ans: a
        hint: Это одно из качеств в списке.
        explain: Одно из качеств — умение в случае необходимости перейти к резервным средствам УВД.
        src: c07
