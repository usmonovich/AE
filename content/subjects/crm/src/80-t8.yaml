# Тема 8. Эмоциональная напряжённость в полёте и при УВД (лекция 8, слайды h01–h05).
subsection: crm-t8

topics:
  - id: crm-emotions
    title: Эмоции и эмоциональная напряжённость
    pages: [h01, h02, h03, h04]
    theory:
      - kind: text
        title: Учебные вопросы темы 8
        body: 'Общая характеристика эмоциональной напряжённости; психофизиологические изменения при эмоциональной напряжённости. Время: 2 часа лекции и 2 часа практики.'
        src: h01
      - kind: definition
        title: Эмоция и потребность
        body: |
          **Эмоция** (лат. emovere — возбуждать) — отражение мозгом актуальной потребности и вероятности её удовлетворения, которую мозг оценивает на основе врождённого и приобретённого опыта.
          - **Положительные** эмоции возникают, когда вероятность удовлетворить важную потребность растёт или потребность удовлетворена.
          - **Отрицательные** — когда вероятность снижается или потребность блокирована.

          **Потребность** — избирательная зависимость организма от факторов внешней среды, существенных для самосохранения и саморазвития.
        src: h02
      - kind: rule
        title: Зачем нужны эмоции
        body: 'Эмоции сигнализируют о росте или снижении вероятности удовлетворить важную потребность и активируют нервную деятельность — подталкивают изменить поведение, чтобы приблизиться к удовлетворению потребности. Это уменьшает или устраняет отрицательные эмоции. **Переживание отрицательных эмоций — эмоциональная напряжённость**; на уровне организма она проявляется как стресс.'
        src: h02
      - kind: text
        title: Эмоции, настроение и характер
        body: 'По схеме на слайде: эмоции (радость, восторг, гнев, ярость, грусть, тревога, страх, экстаз) длятся минуты — часы; из них складывается **настроение** (часы — сутки), а настроение и **характер** (годы — жизнь) влияют друг на друга.'
        src: h03
      - kind: list
        title: Как уменьшить эмоциональную напряжённость в авиаколлективе
        body: |
          Нужно увеличивать вероятность удовлетворения потребности — уменьшать неопределённость ситуации:
          1. Качественная и всесторонняя профессиональная подготовка.
          2. Соблюдение технологии работы: нештатные ситуации возникают и при полном соблюдении документов, но несопоставимо реже.
          3. Доброжелательная рабочая атмосфера в кабине (смене) — для слаженной работы в особых ситуациях.
          4. Профилактика соматических и психосоматических заболеваний и конфликтов — они снижают порог отрицательных эмоций.
          5. **Правило «50 × 50»**: чтобы избежать сильных отрицательных эмоций при нештатной ситуации, вероятности штатного и нештатного развития событий заранее считают примерно равными — 50 % на 50 %.
        src: h03
      - kind: list
        title: Причины эмоциональной напряжённости
        body: |
          - сниженный порог возникновения эмоций — из-за свойств нервной системы, характера или утомления, переутомления, неврозов (в том числе вызванных резкими высказываниями инструкторов);
          - несоответствие знаний, умений и навыков требованиям работы;
          - дефицит информации или её избыток;
          - неуверенность в надёжности техники;
          - несработанность и несовместимость в экипаже (смене);
          - внезапная потеря работоспособности члена экипажа (острая сердечная недостаточность, эпилептический припадок, приступ мочекаменной болезни);
          - сознательные нарушения технологии работы — из-за необходимости их скрывать и действовать без установленного порядка.
        src: h04
      - kind: definition
        title: Виды нарушений при эмоциональной напряжённости
        body: |
          - **эмоционально-моторные** (лат. motor — двигатель) — ухудшаются точность и координация движений;
          - **эмоционально-сенсорные** (лат. sensus — ощущение) — приборы и локатор считываются несвоевременно и с ошибками; нарушаются распределение и переключение внимания, уменьшается его объём;
          - **эмоционально-интеллектуальные** (лат. intellectus — ум) — частично или полностью теряется критичность к своим действиям и действиям коллег, замедляется мышление, трудно извлечь информацию из памяти.
        src: h04
    questions:
      - type: single
        cat: theory
        q: Когда, по лекции, возникают отрицательные эмоции?
        opts: ['При снижении вероятности удовлетворения потребности или её блокировании', 'При удовлетворении потребности', 'Только при болезни', 'Только у меланхоликов']
        ans: a
        hint: Эмоция отражает потребность и вероятность её удовлетворения.
        explain: Отрицательные эмоции возникают при снижении вероятности удовлетворения потребности или при её блокировании.
        src: h02
      - type: single
        cat: theory
        q: Что такое эмоциональная напряжённость?
        opts: ['Переживание отрицательных эмоций, проявляющееся в организме как стресс', 'Сильная радость', 'Нормальное рабочее состояние', 'Скорость реакции на сигнал']
        ans: a
        hint: На уровне организма она проявляется в виде стресса.
        explain: Переживание отрицательных эмоций — эмоциональная напряжённость; в организме она проявляется как стресс.
        src: h02
      - type: single
        cat: theory
        q: В чём суть правила «50 × 50»?
        opts: ['Заранее считать вероятности штатного и нештатного развития событий примерно равными', 'Делить полётное время поровну между пилотами', 'Отдыхать 50 минут после 50 минут работы', 'Проверять половину приборов']
        ans: a
        hint: Правило помогает избежать сильных отрицательных эмоций при нештатной ситуации.
        explain: Вероятности наступления штатной и нештатной ситуаций прогнозируются как примерно равные — 50 % против 50 %.
        src: h03
      - type: multiple
        cat: theory
        q: Что помогает уменьшить эмоциональную напряжённость в экипаже?
        opts: ['Качественная профессиональная подготовка', 'Соблюдение технологии работы', 'Доброжелательная атмосфера в кабине', 'Скрытие нарушений технологии']
        ans: [a, b, c]
        hint: Сознательные нарушения технологии — наоборот, причина напряжённости.
        explain: Подготовка, соблюдение технологии и доброжелательная атмосфера уменьшают неопределённость и напряжённость.
        src: h03
      - type: matching
        cat: theory
        q: Сопоставьте вид нарушения при эмоциональной напряжённости и его проявление.
        pairs:
          - ['Эмоционально-моторные', 'Ухудшение точности и координации движений']
          - ['Эмоционально-сенсорные', 'Ошибки и запаздывание считывания приборов, сужение внимания']
          - ['Эмоционально-интеллектуальные', 'Потеря критичности, замедление мышления']
        hint: 'motor — двигатель, sensus — ощущение, intellectus — ум.'
        explain: Нарушения бывают эмоционально-моторные, эмоционально-сенсорные и эмоционально-интеллектуальные.
        src: h04
      - type: multiple
        cat: theory
        q: Что из перечисленного — причины эмоциональной напряжённости?
        opts: ['Дефицит информации или её избыток', 'Неуверенность в надёжности техники', 'Несработанность в экипаже', 'Слаженная работа экипажа']
        ans: [a, b, c]
        hint: Слаженность, наоборот, снижает напряжённость.
        explain: Дефицит/избыток информации, неуверенность в технике и несработанность экипажа — причины напряжённости.
        src: h04
      - type: sequence
        cat: theory
        q: 'Расположите по длительности — от самого короткого к самому долгому.'
        seq: ['Эмоция (минуты — часы)', 'Настроение (часы — сутки)', 'Характер (годы — жизнь)']
        hint: Из эмоций складывается настроение.
        explain: 'По схеме: эмоции — минуты-часы, настроение — часы-сутки, характер — годы-жизнь.'
        src: h03
      - type: text
        cat: theory
        q: Что такое потребность?
        ref: 'Избирательная зависимость организма от факторов внешней среды, существенных для самосохранения и саморазвития.'
        criteria: ['зависимость от факторов внешней среды', 'самосохранение и саморазвитие']
        hint: В определении есть слова «избирательная зависимость».
        explain: Потребность — избирательная зависимость организма от факторов внешней среды, существенных для самосохранения и саморазвития.
        src: h02

  - id: crm-stress
    title: Стресс и противодействие эмоциональной напряжённости
    pages: [h05]
    theory:
      - kind: definition
        title: Стресс
        body: '**Стресс** (англ. stress — напряжение) — состояние организма при интенсивных или длительных воздействиях любой природы, характеризующееся напряжением **неспецифических** адаптационных механизмов.'
        src: h05
      - kind: rule
        title: Что важно понимать об эмоциональной напряжённости
        body: |
          - она возникает только при уменьшении вероятности удовлетворения важной потребности — нужно понять, **какая потребность блокирована**, и увеличить вероятность её удовлетворения;
          - она сильно **искажает восприятие** информации;
          - она **быстро передаётся** другому человеку — есть опасность, что неадекватным станет ещё один член экипажа;
          - она сопровождается бурными **вегетативными реакциями**: учащение дыхания и пульса, повышение давления, потоотделение, расширение зрачков, частые позывы на мочеиспускание.
        src: h05
      - kind: list
        title: Меры против эмоциональной напряжённости
        body: |
          - гасить напряжённость у коллег, **демонстрируя уравновешенность и рассудительность**: ситуация под контролем, нужны действия, а не переживания;
          - выявлять факторы напряжённости у каждого члена экипажа (смены) и устранять их;
          - формировать комфортный психологический климат — это снимает уже имеющееся напряжение и предотвращает новое.
        src: h05
    questions:
      - type: single
        cat: theory
        q: Что такое стресс?
        opts: ['Состояние напряжения неспецифических адаптационных механизмов при интенсивных или длительных воздействиях', 'Любая положительная эмоция', 'Болезнь сердца', 'Только физическая усталость']
        ans: a
        hint: Природа воздействия не важна — важна реакция организма.
        explain: Стресс — состояние организма при интенсивных или длительных воздействиях с напряжением неспецифических адаптационных механизмов.
        src: h05
      - type: multiple
        cat: theory
        q: Какие вегетативные реакции сопровождают эмоциональную напряжённость?
        opts: ['Учащение дыхания и пульса', 'Повышение артериального давления', 'Расширение зрачков', 'Замедление пульса и сонливость']
        ans: [a, b, c]
        hint: Организм мобилизуется.
        explain: Учащаются дыхание и пульс, повышается давление, усиливается потоотделение, расширяются зрачки.
        src: h05
      - type: single
        cat: theory
        q: Почему эмоциональная напряжённость одного члена экипажа опасна для всего экипажа?
        opts: ['Она быстро передаётся другому человеку', 'Она снижает расход топлива', 'Она влияет только на пассажиров', 'Она не передаётся']
        ans: a
        hint: Есть опасность, что неадекватным станет ещё один человек.
        explain: Эмоциональная напряжённость быстро передаётся другому человеку.
        src: h05
      - type: single
        cat: theory
        q: Как погасить эмоциональную напряжённость у коллег по лекции?
        opts: ['Демонстрировать уравновешенность и рассудительность', 'Повысить голос', 'Сообщить о худшем исходе', 'Взять на себя все обязанности молча']
        ans: a
        hint: Нужно показать, что ситуация подконтрольна.
        explain: Нужно демонстрировать уравновешенность и рассудительность, транслируя, что ситуация под контролем и нужны действия.
        src: h05
      - type: single
        cat: theory
        q: С чего начинать работу по предотвращению эмоциональной напряжённости?
        opts: ['Понять, какая потребность блокирована, и увеличить вероятность её удовлетворения', 'Принять успокоительное', 'Прекратить полёт', 'Сменить экипаж']
        ans: a
        hint: Напряжённость возникает только при уменьшении вероятности удовлетворения потребности.
        explain: Нужно знать, какая потребность блокирована, и что сделать, чтобы увеличить вероятность её удовлетворения.
        src: h05
