# Тема 6. Утомление и переутомление лётного и диспетчерского состава (лекция 6, слайды f01–f05).
subsection: crm-t6

topics:
  - id: crm-fatigue-crew
    title: Утомление и переутомление лётного состава
    pages: [f01, f02, f03]
    theory:
      - kind: text
        title: Учебные вопросы темы 6
        body: 'Утомление и переутомление лётного состава; утомление и переутомление диспетчерского состава. Время: 2 часа лекции и 2 часа практики.'
        src: f01
      - kind: definition
        title: Утомление
        body: |
          **Утомление** — временная разбалансировка функциональных систем организма (особенно нейронов коры большого мозга), снижающая резервные возможности и работоспособность. Это закономерное **обратимое** снижение работоспособности: оно сигнализирует об исчерпании ресурсов и побуждает прекратить деятельность и отдохнуть.

          Утомление — **охранительная, защитная реакция** организма. Оно может стать настолько сильным, что пилот начнёт игнорировать нормы безопасности — главным станет прекратить деятельность.
        src: f02
      - kind: list
        title: Признаки утомления в речи и внимании
        body: 'В состоянии утомления уменьшается количество радиообменов, растёт число ошибок при восприятии и передаче сообщений, обедняется словарный запас, снижаются чёткость артикуляции и темп речи, появляются пропуски информации, трудно сосредоточиться на задаче.'
        src: f02
      - kind: definition
        title: Переутомление
        body: '**Переутомление** — пограничное с патологией состояние: работоспособность снижается с качественными изменениями физиологических, биохимических и психических показателей, и **обычный отдых не восстанавливает силы**. Это несоответствие тяжести работы продолжительности отдыха. Отличительный признак — усталость и разбитость сохраняются после отдыха.'
        src: f02
      - kind: text
        title: Степени переутомления
        body: |
          | Признак | Начальная | Лёгкая | Выраженная | Тяжёлая |
          |---|---|---|---|---|
          | Снижение работоспособности | лёгкое | заметное | выраженное | значительное |
          | Когда проявляется | при повышенной нагрузке | при обычной нагрузке | почти с начала обычной работы | без нагрузки |
          | Настроение | периодическое снижение интереса к работе | периодически нестабильное | раздражительность | подавленность, сильная раздражительность |
          | Сон | трудно засыпает или просыпается | с большим трудом засыпает или просыпается | поверхностный, с тревожными сновидениями, потливость при пробуждении | бессонница |
          | Профилактика | нормализовать режим труда и отдыха | регулярные отпуск и отдых | внеочередной отпуск, упорядочить отдых | лечение |
        src: f03
    examples:
      - title: Определяем степень переутомления по признакам
        given: 'Пилот замечает, что устаёт уже при обычной нагрузке, настроение периодически нестабильное, засыпает с большим трудом.'
        steps:
          - 'Проявление при обычной нагрузке — столбец «лёгкая».'
          - 'Периодически нестабильное настроение и засыпание с большим трудом — тоже «лёгкая».'
          - 'Рекомендуемая профилактика для лёгкой степени — регулярное проведение отпуска и отдыха.'
        answer: 'лёгкая степень переутомления; нужен регулярный отпуск и отдых'
        src: f03
    questions:
      - type: single
        cat: theory
        q: Чем, по сути, является утомление?
        opts: ['Охранительной, защитной реакцией организма', 'Болезнью нервной системы', 'Признаком низкой квалификации', 'Необратимым снижением работоспособности']
        ans: a
        hint: Утомление сигнализирует об исчерпании ресурсов.
        explain: Утомление — одна из охранительных, защитных реакций организма; снижение работоспособности при нём обратимо.
        src: f02
      - type: single
        cat: theory
        q: Главное отличие переутомления от утомления?
        opts: ['Усталость и разбитость сохраняются после обычного отдыха', 'Переутомление проходит после короткого перерыва', 'Переутомление бывает только у диспетчеров', 'При переутомлении работоспособность повышается']
        ans: a
        hint: Переутомление — несоответствие тяжести работы продолжительности отдыха.
        explain: Отличительная особенность переутомления — сохранение признаков усталости после отдыха.
        src: f02
      - type: multiple
        cat: theory
        q: Как утомление проявляется в радиообмене и речи?
        opts: ['Уменьшается количество радиообменов', 'Обедняется словарный запас', 'Снижается чёткость артикуляции и темп речи', 'Речь становится быстрее и громче']
        ans: [a, b, c]
        hint: Речь становится беднее и медленнее.
        explain: Уменьшаются радиообмены, обедняется словарный запас, снижаются чёткость и темп речи.
        src: f02
      - type: sequence
        cat: theory
        q: Расположите степени переутомления от слабой к сильной.
        seq: ['Начальная', 'Лёгкая', 'Выраженная', 'Тяжёлая']
        hint: Тяжёлая степень проявляется даже без нагрузки.
        explain: 'Начальная → лёгкая → выраженная → тяжёлая.'
        src: f03
      - type: matching
        cat: theory
        q: Сопоставьте степень переутомления и рекомендуемую профилактику.
        pairs:
          - ['Начальная', 'Нормализация режима труда и отдыха']
          - ['Лёгкая', 'Регулярное проведение отпуска и отдыха']
          - ['Выраженная', 'Внеочередной отпуск, упорядочение отдыха']
          - ['Тяжёлая', 'Лечение']
        hint: Чем тяжелее степень, тем серьёзнее мера.
        explain: По таблице на слайде меры усиливаются от нормализации режима до лечения.
        src: f03
      - type: single
        cat: theory
        q: При какой степени переутомления оно проявляется даже при отсутствии нагрузки?
        opts: ['Тяжёлой', 'Начальной', 'Лёгкой', 'Выраженной']
        ans: a
        hint: Это самая сильная степень.
        explain: При тяжёлой степени переутомление проявляется при отсутствии нагрузки.
        src: f03

  - id: crm-fatigue-atc
    title: Утомление авиадиспетчеров и профилактика
    pages: [f04, f05]
    theory:
      - kind: list
        title: Факторы психоэмоционального напряжения и утомления диспетчеров
        body: |
          - высокая интенсивность и неравномерность информационных потоков — напряжение **перцептивных** (лат. perceptio — восприятие) процессов;
          - обилие потенциально конфликтных и критических ситуаций, постоянная готовность к их возникновению;
          - необходимость в жёстком режиме времени перекодировать большие потоки информации;
          - восприятие информации не только напрямую, но и через радиотехнические средства;
          - непрерывная быстрая переработка информации об обстановке и перевод её в речевые команды экипажам;
          - дефицит времени на принятие и реализацию решения;
          - интенсивное обращение к долговременной памяти и перегрузка оперативной памяти;
          - высокая нагрузка на внимание.
        src: f04
      - kind: text
        title: Интенсивность движения и гормоны стресса
        body: |
          Исследование гормональных показателей у диспетчеров в первую (8:00–14:00), вторую (14:00–20:00) и ночную (20:00–8:00) смены показало:
          - при интенсивности **до 10 самолётов в час** значимых изменений за смену нет;
          - при **20 самолётах в час** выделение адреналина и норадреналина возрастает **вдвое**;
          - при **30 самолётах в час** изменения приобретают выраженный генерализованный характер.
        src: f05
      - kind: list
        title: Профилактика утомления — устранить причину
        body: |
          Профилактика основана на определении конкретного фактора, вызывающего утомление:
          - сверхнормативная нагрузка; неправильно спланированные рейсы (у диспетчеров — нарушения сменности);
          - трансширотные и трансмеридианные перелёты, ночные полёты;
          - эмоциональная напряжённость, неблагоприятная служебная или бытовая обстановка;
          - неправильное использование времени отдыха (и в рабочий, и в отпускной период);
          - низкая профессиональная подготовка — и потому большая «физиологическая стоимость» работы;
          - бесконтрольное употребление лекарств; алкоголь за несколько дней до смены;
          - неполноценное питание (мало витаминов и белков); нарушения сна.
        src: f05
      - kind: list
        title: Признаки умственного переутомления и виды утомления
        body: |
          По картинкам на слайде:
          - **признаки умственного переутомления** — проблемы с засыпанием, покраснение глаз, бледность кожи, мешки под глазами, нестабильное артериальное давление, усталость, которая не проходит после отдыха и сна, головная боль без причины;
          - **физическое утомление** объективно проявляется снижением работоспособности и нарушением координации; **умственное** — снижением продуктивности интеллектуального труда, ослаблением внимания и скорости мышления;
          - **профилактика переутомления** — режим дня без недосыпания и недоедания, меньшая нагрузка, правильное чередование занятий и отдыха; отдыхать следует от того занятия, которое вызвало утомление.
        src: f05
    questions:
      - type: multiple
        cat: theory
        q: Какие факторы вызывают психоэмоциональное напряжение и утомление у авиадиспетчеров?
        opts: ['Высокая интенсивность и неравномерность информационных потоков', 'Дефицит времени на принятие решения', 'Перегрузка оперативной памяти', 'Однообразное питание пассажиров']
        ans: [a, b, c]
        hint: Один вариант не касается работы диспетчера.
        explain: Интенсивность потоков, дефицит времени и перегрузка оперативной памяти — факторы напряжения диспетчеров.
        src: f04
      - type: numeric
        cat: theory
        q: 'При какой интенсивности воздушного движения (самолётов в час) выделение адреналина и норадреналина у диспетчеров возрастало вдвое?'
        num: { value: 20, unit: 'самолётов/ч', tol: 0, check: '20' }
        hint: 'До 10 — изменений нет, при 30 — генерализованные изменения.'
        explain: При 20 самолётах в час выделение адреналина и норадреналина увеличивалось в два раза.
        src: f05
      - type: matching
        cat: theory
        q: Сопоставьте интенсивность воздушного движения и изменения гормональных показателей у диспетчеров.
        pairs:
          - ['До 10 самолётов в час', 'Значимых изменений нет']
          - ['20 самолётов в час', 'Адреналин и норадреналин — вдвое больше']
          - ['30 самолётов в час', 'Выраженные генерализованные изменения']
        hint: Чем интенсивнее движение, тем сильнее реакция.
        explain: Данные исследования гормональных процессов у диспетчеров на слайде 5.
        src: f05
      - type: single
        cat: theory
        q: На чём основана профилактика утомления?
        opts: ['На определении конкретного фактора, вызывающего утомление', 'На приёме тонизирующих средств', 'На увеличении нагрузки для тренировки', 'На сокращении сна']
        ans: a
        hint: Сначала нужно найти причину.
        explain: Профилактика утомления основана на определении конкретного фактора, который его вызывает.
        src: f05
      - type: multiple
        cat: theory
        q: Какие признаки указывают на умственное переутомление?
        opts: ['Проблемы с засыпанием', 'Усталость, не проходящая после отдыха и сна', 'Головная боль без причины', 'Повышенная работоспособность']
        ans: [a, b, c]
        hint: Один вариант противоположен переутомлению.
        explain: Нарушения сна, неуходящая после отдыха усталость и головные боли — признаки умственного переутомления.
        src: f05
      - type: single
        cat: theory
        q: Что значит «большая физиологическая стоимость деятельности» при низкой профессиональной подготовке?
        opts: ['Слабо подготовленный специалист тратит больше сил на ту же работу и быстрее утомляется', 'Работа стоит дороже для авиакомпании', 'Нужно больше медосмотров', 'Это плата за обучение']
        ans: a
        hint: Речь о затратах организма.
        explain: Низкая подготовка обусловливает большую физиологическую стоимость деятельности — и, как следствие, утомление.
        src: f05
