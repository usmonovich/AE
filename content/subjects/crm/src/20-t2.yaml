  - id: crm-flight-image
    title: Образ полёта
    pages: [b08]
    theory:
      - kind: definition
        title: Образ полёта
        fig: crm-flight-image
        body: |
          На основе ощущений, памяти и умственных действий у членов экипажа формируется **образ полёта** — главный регулятор деятельности на борту.

          **Образ полёта** — зрительное представление о движении самолёта и связанная с ним система показаний приборов и характерной неинструментальной информации. Это базовый компонент психического отражения, сформированный при обучении и в профессиональной практике. Он включает цели и задачи пилота, знания об объекте управления и систему двигательных программ.
        src: b08
      - kind: list
        title: Три компонента образа полёта
        body: |
          В конкретных действиях на первый план выходит один из трёх компонентов:
          - **образ пространственного положения** — регулирует пространственную ориентировку; должен постоянно поддерживаться и меняться вместе с эволюциями самолёта;
          - **чувство самолёта** — опирается на сенсорный и моторный образ (неинструментальные сигналы);
          - **приборный образ** — отражение рассогласования между заданным и текущим режимами полёта, построенное по расхождению заданных и фактических значений параметров.

          По схеме на слайде: система информации даёт **инструментальные** и **неинструментальные** сигналы; из них складываются компоненты образа, а весь образ полёта работает как концептуальная модель с образом-целью во главе.
        src: b08
    questions:
      - type: single
        cat: theory
        q: Что является главным регулятором деятельности экипажа на борту?
        opts: ['Образ полёта', 'Бортовой журнал', 'Командир воздушного судна', 'Автопилот']
        ans: a
        hint: Он формируется на основе ощущений, памяти и умственных действий.
        explain: Образ полёта — главный регулятор деятельности на борту.
        src: b08
      - type: multiple
        cat: theory
        q: Какие три компонента выделяют в образе полёта?
        opts: ['Образ пространственного положения', 'Чувство самолёта', 'Приборный образ', 'Образ пассажира']
        ans: [a, b, c]
        hint: Один из вариантов к пилотированию не относится.
        explain: Компоненты — образ пространственного положения, чувство самолёта, приборный образ.
        src: b08
      - type: single
        cat: theory
        q: Что такое приборный образ?
        opts: ['Отражение рассогласования между заданным и текущим режимами полёта', 'Фотография приборной доски', 'Ощущение ускорений', 'Карта маршрута']
        ans: a
        hint: Он строится по расхождению заданного и фактического значения параметра.
        explain: Приборный образ — отражение рассогласований между заданным и текущим режимами полёта.
        src: b08
      - type: matching
        cat: theory
        q: Сопоставьте компонент образа полёта и его роль.
        pairs:
          - ['Образ пространственного положения', 'Регулирует пространственную ориентировку пилота']
          - ['Приборный образ', 'Показывает расхождение заданного и фактического режима']
          - ['Чувство самолёта', 'Опирается на сенсорный и моторный образ']
        hint: Приборный образ связан с приборами, образ положения — с ориентировкой.
        explain: Каждый компонент выходит на первый план в своих действиях.
        src: b08
      - type: text
        cat: theory
        q: Дайте определение образа полёта.
        ref: 'Образ полёта — зрительное представление о движении самолёта и связанная с ним система показаний приборов и характерной неинструментальной информации; главный регулятор деятельности на борту.'
        criteria: ['зрительное представление о движении самолёта', 'показания приборов', 'неинструментальная информация']
        hint: В определении три части — представление, приборы и информация вне приборов.
        explain: Образ полёта объединяет представление о движении, показания приборов и неинструментальную информацию.
        src: b08

  - id: crm-work-factors
    title: Вредные, опасные и психофизиологические факторы труда экипажа
    pages: [b09, b10, b11]
    theory:
      - kind: list
        title: Вредные факторы труда членов экипажа
        body: |
          Вредные факторы ухудшают здоровье, работоспособность и безопасность полётов:
          - высокий уровень авиационного шума и повышенная вибрация;
          - колебания атмосферного давления при взлёте, посадке, наборе высоты и снижении;
          - пониженное парциальное давление кислорода в кабине и, как следствие, **гипоксия**;
          - температурный дискомфорт, неудовлетворительный состав вдыхаемого воздуха;
          - повышенное радиационное облучение и электромагнитные излучения, СВЧ-излучение наземного и бортового оборудования;
          - болтанка и знакопеременные перегрузки.

          На схеме санитарно-гигиенических условий труда: температура, влажность, подвижность и чистота воздуха, освещение, производственный шум, вибрация, производственные излучения.
        src: [b09, b11]
      - kind: list
        title: Опасные факторы
        body: |
          Опасные факторы связаны с работой человека в несвойственной ему среде — это аварийные и катастрофические ситуации из-за:
          - ошибок членов экипажа и работников других служб;
          - отказов авиатехники;
          - воздушного пиратства;
          - пожара;
          - разгерметизации кабины;
          - разрушения конструкции;
          - удара молнии (грозовых разрядов);
          - отравления ядохимикатами при авиахимических работах.

          Ощущение постоянной опасности вызывает эмоциональную напряжённость, утомление и переутомление.
        src: b10
      - kind: text
        title: Психофизиологические особенности труда
        body: |
          - **Сдвиги часовых поясов и климатических зон.** Экипажи дальнемагистральных самолётов выполняют беспосадочные перелёты более 13 ч при общем рабочем времени более 16 ч; на средне- и ближнемагистральных — рейсы короче, но посадок больше, рабочее время до 14 ч в сутки (полётное — до 10 ч).
          - Трансмеридианные и трансширотные перелёты, ночные полёты, ранние вылеты и поздние прилёты нарушают биологические ритмы — возникает **десинхроноз** (десинхронизация).
          - Работоспособность снижают эмоциональная напряжённость, непроизводительные потери времени (организационные, метеорологические, технические причины), дезориентация, лётные иллюзии, **монотония** (гр. monos — один + tonos — напряжение) и **гипокинезия** (гр. hypo — под + kinesis — движение).

          Эти факторы истощают психофизиологические резервы и повышают риск нарушений психосоматического здоровья.
        src: b11
    questions:
      - type: multiple
        cat: theory
        q: Какие из факторов относятся к вредным факторам труда членов экипажа?
        opts: ['Авиационный шум', 'Пониженное парциальное давление кислорода (гипоксия)', 'Болтанка', 'Воздушное пиратство']
        ans: [a, b, c]
        hint: Один вариант — опасный фактор, связанный с аварийной ситуацией.
        explain: Шум, гипоксия и болтанка — вредные факторы; воздушное пиратство — опасный фактор.
        src: [b09, b10]
      - type: single
        cat: theory
        q: К какой группе факторов относится разгерметизация кабины?
        opts: ['Опасные факторы', 'Вредные факторы', 'Психофизиологические особенности', 'Санитарно-гигиенические нормы']
        ans: a
        hint: Опасные факторы ведут к аварийным и катастрофическим ситуациям.
        explain: Разгерметизация — опасный фактор, ведущий к аварийной ситуации.
        src: b10
      - type: single
        cat: theory
        q: Как называется нарушение биологических ритмов при трансмеридианных перелётах и ночных полётах?
        opts: ['Десинхроноз (десинхронизация)', 'Гипокинезия', 'Монотония', 'Гипоксия']
        ans: a
        hint: Ритмы «рассинхронизируются».
        explain: Нарушения биологических ритмов проявляются в явлении десинхронизации.
        src: b11
      - type: matching
        cat: theory
        q: Сопоставьте термин и его значение.
        pairs:
          - ['Монотония', 'Однообразие, «одно напряжение»']
          - ['Гипокинезия', 'Недостаток движения']
          - ['Гипоксия', 'Кислородное голодание из-за пониженного давления кислорода']
        hint: 'Греческие корни: monos — один, hypo — под, kinesis — движение.'
        explain: 'Монотония — однообразие; гипокинезия — недостаток движения; гипоксия — следствие пониженного парциального давления кислорода.'
        src: [b09, b11]
      - type: numeric
        cat: theory
        q: 'Каким может быть общее рабочее время экипажа на средне- и ближнемагистральных самолётах (до скольких часов в сутки)?'
        num: { value: 14, unit: 'ч', tol: 0, check: '14' }
        hint: Полётное время при этом может достигать 10 ч.
        explain: На средне- и ближнемагистральных самолётах общее рабочее время — до 14 ч в сутки.
        src: b11
      - type: single
        cat: theory
        q: К чему приводит ощущение постоянной опасности у членов экипажа?
        opts: ['К эмоциональной напряжённости, утомлению и переутомлению', 'К повышению работоспособности', 'К улучшению глазомера', 'Ни к чему, экипаж привыкает']
        ans: a
        hint: Это последний абзац слайда об опасных факторах.
        explain: Ощущение постоянной опасности отражается в эмоциональной напряжённости, утомлении и переутомлении.
        src: b10
