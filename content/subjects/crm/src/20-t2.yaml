# Тема 2. Специфика и условия лётной деятельности (лекция 2, слайды b01–b11).
subsection: crm-t2

topics:
  - id: crm-analyzers
    title: Анализаторы и зрение пилота
    pages: [b01, b02, b03, b04]
    theory:
      - kind: text
        title: Учебные вопросы темы 2
        body: 'Роль анализаторных систем при пилотировании; структура образа полёта; санитарно-гигиеническая характеристика труда членов экипажа. Время: 2 часа лекции и 2 часа практики.'
        src: b01
      - kind: text
        title: Что делает пилот в полёте
        body: |
          Пилот воспринимает **инструментальную** (приборную) и **неинструментальную** информацию (то, что видно вне кабины, угловые и линейные ускорения, усилия на органах управления). На этой основе, а также на основе знаний, памяти и мышления формируется **образ полёта**, по которому пилот выполняет действия, чтобы изменить или сохранить режим полёта.

          Деятельность пилота **совмещённая** (управление судном, пилотажная и навигационная ориентировка, наблюдение вне кабины) и проходит в условиях высокой неопределённости; пилот несёт ответственность за пассажиров, экипаж, груз, самолёт и себя.
        src: b02
      - kind: definition
        title: Анализатор
        body: |
          **Анализаторы** (гр. analysis — разбор, разложение) — комплекс анатомических структур, которые воспринимают энергию внешнего раздражения, превращают её в нервный импульс и передают в соответствующие отделы мозга. Каждый анализатор состоит из трёх частей:
          1. **периферической части** — воспринимает раздражение и перерабатывает его в нервный импульс;
          2. **проводящего пути** — по нему импульс идёт к нервному центру;
          3. **коркового конца** — в соответствующем участке коры большого мозга.
        src: b02
      - kind: definition
        title: Ощущение
        body: 'Ощущение — отражение отдельных свойств предметов при их непосредственном воздействии на органы чувств.'
        src: b02
      - kind: definition
        title: Динамический глубинный глазомер
        fig: crm-view-angle
        body: |
          Пилоту нужно не только безупречное зрение, но и умение точно определять расстояние до объектов вне кабины, прежде всего до ВПП, — **динамический глубинный глазомер**. Расстояние пилот оценивает по угловым размерам предметов, по их появлению и исчезновению из поля зрения, по скорости перемещения наземных ориентиров.

          Глазомер **не врождённый**: он тренируется и основан на образовании условных связей. Курсант сначала учится определять высоту в полётах с инструктором, затем — самостоятельно.
        src: b03
      - kind: text
        title: Тип самолёта и угол обзора вниз
        body: |
          Тип воздушного судна сильно влияет на оценку высоты. Например, на Ан-124 глаза пилота расположены очень высоко, и ночью, в тумане, дожде или снегопаде правильно определить расстояние до земли на посадке очень трудно, а чаще невозможно.

          Часть пространства под самолётом закрыта носовой частью фюзеляжа. Линия от глаз пилота, касательная к носу самолёта, образует с горизонтом **угол обзора из кабины вниз**. По рисунку на слайде: при угле обзора 15° и высоте 50 м ближайшая видимая точка ВПП находится примерно в 185 м впереди; если поднять нос на 5° (тангаж), угол уменьшается до 10°, и это расстояние вырастает до 285 м.
        src: b03
      - kind: definition
        title: Зоны восприятия земли на посадке
        fig: crm-landing-zones
        body: |
          По Г. Г. Голубеву (1953), поверхность аэродрома, которую пилот видит на посадке, делится на три зоны:
          - **зона ясной видимости** — предметы различаются отчётливо;
          - **зона мелькания** — предметы проносятся быстро и видны нечётко;
          - **зона слияния** — пространство над местностью, где из-за большой скорости отдельные предметы не воспринимаются и видна сплошная полоса.
        src: b04
      - kind: law
        title: Закон контраста
        body: 'Чем слабее освещён предмет и чем дальше он от наблюдателя, тем больший контраст нужен, чтобы безошибочно его различить.'
        src: b04
      - kind: law
        id: crm-analyzers-dyn-acuity
        title: Динамическая острота зрения
        body: 'Восприятие движущихся объектов особенно важно на взлёте, посадке и на малых высотах. Острота зрения зависит от скорости движения объекта: чем больше скорость, тем выше острота зрения.'
        errata: [crm-e01]
        src: b04
      - kind: definition
        title: Адаптация глаза
        body: |
          Зрительный анализатор приспосабливается к разной освещённости — это **адаптация**. Два вида:
          - **темновая** — приспособление к видению в темноте;
          - **световая** — приспособление к видению при яркой освещённости.
        src: b04
    formulas:
      - title: Расстояние до ближайшей видимой точки земли
        tex: 'L = \frac{H}{\operatorname{tg}(\alpha - \theta)}'
        sym: [L_vis, H_eye, alpha_v, theta_p]
        cond: 'Геометрия рисунка на слайде: линия обзора от глаз пилота касается носовой части; при поднятии носа на угол тангажа $\theta$ угол обзора вниз уменьшается на $\theta$. При $\theta = 0$: $L = H / \operatorname{tg}\alpha$.'
        src: b03
    examples:
      - title: Насколько дальше «прячется» ВПП при поднятом носе
        given: '$H = 50$ м, угол обзора вниз $\alpha = 15°$; затем нос поднят на $\theta = 5°$ (рисунок на слайде).'
        steps:
          - 'Без тангажа: $L = \frac{50}{\operatorname{tg}15°} = \frac{50}{0{,}268} \approx 187$ м (на рисунке округлено до 185 м).'
          - 'С тангажем 5°: угол обзора $15° - 5° = 10°$, $L = \frac{50}{\operatorname{tg}10°} = \frac{50}{0{,}176} \approx 284$ м (на рисунке — 285 м).'
          - 'Ближайшая видимая точка отодвинулась примерно на 100 м: на посадке с поднятым носом пилот хуже видит землю прямо перед самолётом.'
        answer: 'около 185 м и 285 м'
        src: b03
    questions:
      - type: single
        cat: theory
        q: Что такое анализатор?
        opts: ['Комплекс анатомических структур, которые воспринимают раздражение, превращают его в нервный импульс и передают в мозг', 'Прибор в кабине, показывающий параметры полёта', 'Отдельное свойство предмета, отражённое органом чувств', 'Условный рефлекс, сформированный при обучении']
        ans: a
