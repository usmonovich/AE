        ans: a
        hint: Перегрузка — отношение двух сил.
        explain: Перегрузка — безразмерная величина, показывающая, во сколько раз сила, вызвавшая ускорение или торможение тела, больше его веса.
        src: b06
      - type: numeric
        cat: problem
        q: 'На пилота весом 800 Н при манёвре действует сила 2 400 Н, вызывающая ускорение. Какова перегрузка?'
        num: { value: 3, unit: '', check: '2400/800' }
        hint: Перегрузка — отношение силы к весу.
        explain: '$n = F/G = 2400/800 = 3$.'
        f: [1]
        sol: { given: ['F = 2400 Н', 'G = 800 Н'], find: 'n', formula: 'n = \frac{F}{G}', calc: 'n = \frac{2400}{800} = 3', answer: '3' }
        src: b06
      - type: single
        cat: theory
        q: Куда направлена перегрузка, действующая на пилота на взлёте?
        opts: ['Против движения', 'По движению', 'Вертикально вверх', 'Перегрузки на взлёте нет']
        ans: a
        hint: Перегрузка вызвана инерцией и направлена против силы, вызвавшей ускорение.
        explain: На взлёте перегрузка направлена против движения, на посадке — по движению.
        src: b06
      - type: single
