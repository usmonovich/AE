  - id: crm-neurosis-mechanisms
    title: Механизмы возникновения неврозов и методы лечения
    pages: [i02, i04, i05, i06, i07]
    theory:
      - kind: list
        title: Черты личности, предрасполагающие к неврозам
        body: |
          - **повышенная чувствительность (сензитивность)** — лат. sensitivus — чувствительный;
          - **мнительность**;
          - **тугоподвижность нервных процессов (инертность)** — лат. inertis — бездеятельный, неподвижный;
          - **демонстративность** — лат. demonstratio — показывание;
          - **эгоцентризм** — лат. ego — я + centrum — средоточие.

          Каждая особенность способствует строго определённой **форме невроза**: неврастении, истерии или неврозу навязчивых состояний.
        src: i04
        errata: [crm-e08]
      - kind: definition
        title: Невроз навязчивых состояний
        body: 'По слайду: **невроз навязчивых состояний** — общее название неврозов, которые проявляются **навязчивыми** страхами, представлениями, воспоминаниями, сомнениями и т. д. Схема на слайде показывает замкнутый круг: нежелательные мысли (обсессии) → нарастание напряжения и тревоги → ритуал (поведение избегания) → временное освобождение от тревоги и страха → чувство вины, стыда, бессилия, ожидание новых мыслей → снова обсессии.'
        src: i02
      - kind: list
        title: Как протекает невроз
        body: |
          - В состоянии невроза человек **более чувствителен к новым психотравмам**: прежде решаемые проблемы кажутся непреодолимыми, а прежде безразличные раздражители вызывают тяжёлые, иногда аффективные переживания.
          - Невроз может возникнуть **не сразу, а через некоторое время** после травмы — по мере психической переработки события и осознания его значимости; дополнительные раздражители усиливают патогенное действие первых.
          - **Коварство неврозов** — они сопровождаются отклонениями в работе внутренних органов: **психосоматическими расстройствами** («неврозами органов»).
        src: i04
      - kind: list
        title: Кто подвержен нервным расстройствам
        body: 'По схеме на слайде: люди с тревожным типом личности; злоупотребляющие алкоголем, курящие; люди с заниженной самооценкой; трудоголики; страдающие тяжёлыми патологиями; люди с «комплексом отличника»; имеющие проблемы с друзьями, в семье; люди, чьи родители страдали нервными расстройствами; люди, готовящиеся к серьёзным переменам в жизни.'
        src: i04
      - kind: rule
        title: Условия образования невроза
        body: |
          1. **Психотравма** с аффектом и амнезией в момент её действия (поэтому образовавшиеся симптомы не удаётся устранить). Одна из самых тяжёлых психотравм — **внутриличностный конфликт**: неразрешённое противоречие между важными потребностями.
          2. **Астенизация нервной системы** — снижает порог чувствительности к психотравмам и повышает травматичность информации.
          3. **Определённые черты личности** — не дают переработать психотравмирующую ситуацию (для каждой формы невроза свои).
          4. **Новые психотравмы** — усиливают симптомы и ещё больше запутывают поиск первопричины.
        src: i05
      - kind: list
        title: Причины и механизм возникновения неврозов
        body: 'По схеме на слайде — замкнутый круг: внешние факторы → головной мозг → нарушение высшей нервной деятельности → нарушение нервной и эндокринной регуляции органов → нервно-психическое перенапряжение → нарушение жизненно важных отношений → снова внешние факторы.'
        src: i07
      - kind: definition
        title: Психотерапия
        body: |
          По лекции неврозы — **информационные расстройства**, поэтому их лечат **информационным воздействием** — разными видами психотерапии.

          **Психотерапия** (греч. psyche — душа + therapeia — лечение) — информационное воздействие на человека с целью устранить отрицательные эмоции и избавить от психогенных расстройств, вызванных психотравмирующей информацией о блокировании значимых потребностей.
        src: i05
        errata: [crm-e07]
      - kind: note
        title: 'Уточнение: лечение не только психотерапией'
        body: 'В лекции сказано, что от неврозов можно избавиться «исключительно» психотерапией. Современные данные (например, обзор Gillihan и соавт., 2012) показывают, что, например, при обсессивно-компульсивном расстройстве эффективны и когнитивно-поведенческая терапия (экспозиция с предотвращением ритуала), и лекарства (ингибиторы обратного захвата серотонина); их часто сочетают. Лечение назначает только врач. **Это уточнение не из лекции.**'
        src: i05
        web: [*exrp]
    questions:
      - type: multiple
        cat: theory
        q: Какие особенности личности предрасполагают к неврозам?
        opts: ['Повышенная чувствительность (сензитивность)', 'Мнительность', 'Демонстративность и эгоцентризм', 'Высокая стрессоустойчивость']
        ans: [a, b, c]
        hint: Стрессоустойчивость, наоборот, защищает.
        explain: 'Предрасполагают сензитивность, мнительность, инертность нервных процессов, демонстративность, эгоцентризм.'
        src: i04
      - type: single
        cat: theory
        q: Как называют отклонения в работе внутренних органов, сопровождающие неврозы?
        opts: ['Психосоматические расстройства («неврозы органов»)', 'Баротравмы', 'Лётные иллюзии', 'Перегрузки']
        ans: a
        hint: «Психо» + «сома» (тело).
        explain: 'Коварство неврозов в том, что они сопровождаются психосоматическими расстройствами — «неврозами органов».'
        src: i04
      - type: single
        cat: theory
        q: Всегда ли невроз возникает сразу после психической травмы?
        opts: ['Нет — может появиться через некоторое время, по мере переработки события', 'Да, всегда в первые минуты', 'Только через 10 лет', 'Невроз не связан с травмой']
        ans: a
        hint: Человек постепенно осознаёт значимость произошедшего.
        explain: 'Невроз может возникнуть позже — под влиянием психической переработки события; новые раздражители усиливают его.'
