      - type: sequence
        cat: theory
        q: Расположите этапы замкнутого круга невроза навязчивых состояний (по схеме слайда).
        seq: ['Нежелательные мысли (обсессии)', 'Нарастание напряжения и тревоги', 'Ритуал (поведение избегания)', 'Временное освобождение от тревоги', 'Чувство вины, стыда, ожидание новых мыслей']
