topics:
  - id: crm-neurosis
    title: Неврозы лётного и диспетчерского состава
    pages: [i01, i02, i03]
    theory:
      - kind: text
        title: Учебные вопросы темы 9
        body: '1) Неврозы лётного и диспетчерского состава; 2) механизмы возникновения неврозов, формы и методы лечения; 3) схемы образования неврозов характера человека. Время: 2 часа лекции и 2 часа практики. Литература: Д. А. Евстигнеев «Авиационная психология» (2022); ICAO Doc 9683 «Руководство по обучению в области человеческого фактора»; О. В. Ариничева «Возможности и ограничения человека в лётной деятельности» (2016); С. М. Зеньковская (2016).'
        src: i01
      - kind: definition
        title: Невроз
        body: |
          **Невроз** (греч. neuron — нерв, жила) — **обратимое** нарушение нервной деятельности, вызванное **психической травмой** (она отражает блокирование важных для человека потребностей); по своей природе — патогенное условно-рефлекторное образование.

          Поэтому неврозы относят к **психогенным** заболеваниям (греч. psyche — душа + genos — род, рождающий; психогении) — болезням, вызванным **сигнальным (информационным)** значением раздражителя.
        src: i02
      - kind: note
        title: 'Уточнение: как неврозы называют в современных классификациях'
        body: 'В МКБ-10 эти состояния собраны в блок F40–F48 «Невротические, связанные со стрессом и соматоформные расстройства» (например, обсессивно-компульсивное расстройство — F42). В МКБ-11 отдельного «невротического» раздела уже нет: например, ОКР входит в группу «Обсессивно-компульсивные и родственные расстройства» (6B20). **Этого нет в лекции.**'
        src: i02
        web: [*ocduk]
      - kind: list
        title: Психическая травма — вербальная и невербальная
        body: |
          Психической травмой может быть **речевое (вербальное)** и **неречевое (невербальное)** воздействие. В авиации невербальные травмы так же распространены, как вербальные. Примеры:
          - отказ авиационного оборудования;
          - попадание воздушного судна в зону с особыми условиями полёта;
          - потеря радиосвязи;
          - выход из строя основного и резервного электропитания на диспетчерском пункте;
          - вид самолёта, совершающего аварийную посадку или потерпевшего катастрофу.
        src: i02
        errata: [crm-e08]
      - kind: list
        title: Неблагоприятные для лётной деятельности психические состояния
        body: |
          По схеме на слайде — три группы:
          1. **Вследствие психических заболеваний** (в схеме — «врождённых»): текущие проявления шизофрении, психопатии, паранойи, истерии, эпилепсии.
          2. **Вследствие плохих жизненных условий:** депрессивное, тревожное, стрессовое состояние; алкогольное или наркотическое опьянение.
          3. **Вследствие рабочей нагрузки или рабочей среды:** утомление, монотония (дрёма), психическая напряжённость, гипоксия (кислородное голодание), ступор (оцепенение).
        src: i03
        errata: [crm-e09]
      - kind: rule
        title: Почему неврозы опасны в авиации
        body: |
          - Работа пилота и авиадиспетчера **изобилует психотравмирующими раздражителями** и способствует невротическим состояниям — помимо тех, что характерны для населения в целом. Поэтому авиаспециалистам установлены особые условия труда и отдыха: строгое нормирование рабочего времени, более ранний выход на пенсию.
          - Главная опасность: поражения органов **не связываются человеком с психической травмой** — воспринимаются как возникшие сами по себе. Так закрывается единственная возможность их предотвращения и профилактики.
          - Неврозы — один из самых опасных психофизиологических факторов: они **являются причиной серьёзных авиационных событий** и сами **порождаются ими**.
        src: i03
