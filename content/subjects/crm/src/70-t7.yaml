        src: g02

  - id: crm-character
    title: Характер и типы личности
    pages: [g05, g06]
    theory:
      - kind: definition
        title: Характер
        body: '**Характер** (гр. charakter — черта, особенность) — условнорефлекторное образование: совокупность устойчивых, взаимосвязанных и отчётливо проявляющихся особенностей, которые выражаются в **отношении человека к себе, к другим и к деятельности** и определяют своеобразие его поведения.'
        src: g05
      - kind: definition
        title: Черты характера
        body: |
          **Черты характера** — сложные индивидуальные особенности, показательные для человека; по ним можно с известной вероятностью прогнозировать его поведение в определённых ситуациях.
          - По связи с психическими процессами черты делят на **познавательные, эмоциональные и волевые**.
          - По направленности — на отражающие отношение человека **к себе, к другим людям и к деятельности**.
        src: g05
      - kind: text
        title: Темперамент → характер → личность
        body: |
          На картинке-дереве: темперамент — корни, характер — ствол, личность — крона.

          На слайде также приведены типы личности **по Холланду** — по предпочтениям в работе:
          - **реалистичный** — работа с инструментами, техникой, животными, на открытом воздухе;
          - **интеллектуальный** — исследование и анализ явлений;
          - **социальный** — работа с людьми: учить, помогать, лечить;
          - **артистический** — творчество, создание предметов искусства;
          - **предприимчивый (инициативный)** — руководство проектами, влияние на людей;
          - **консервативный (офисный)** — систематизация и обработка данных, работа по чётким правилам.
        src: g06
    questions:
      - type: single
        cat: theory
        q: В чём выражаются особенности характера?
        opts: ['В отношении человека к себе, к другим и к деятельности', 'Только в скорости реакции', 'В росте и телосложении', 'В остроте зрения']
        ans: a
        hint: Характер определяет своеобразие поведения через отношения.
        explain: Характер выражается в отношении человека к себе, другим и деятельности.
        src: g05
      - type: single
        cat: theory
        q: Каким образованием является характер по лекции?
        opts: ['Условнорефлекторным', 'Безусловнорефлекторным', 'Только врождённым', 'Гормональным']
        ans: a
        hint: Темперамент — безусловнорефлекторный каркас, характер формируется на нём при жизни.
        explain: Характер — условнорефлекторное образование.
        src: g05
      - type: multiple
        cat: theory
        q: На какие группы делят черты характера по связи с психическими процессами?
        opts: ['Познавательные', 'Эмоциональные', 'Волевые', 'Наследственные']
        ans: [a, b, c]
        hint: Три группы соответствуют трём видам психических процессов.
        explain: Черты характера делят на познавательные, эмоциональные и волевые.
        src: g05
      - type: single
        cat: theory
        q: Зачем знать черты характера человека?
        opts: ['Они позволяют с известной вероятностью прогнозировать его поведение в определённых ситуациях', 'Они точно определяют его профессию', 'Они нужны только для медосмотра', 'Они не влияют на поведение']
        ans: a
        hint: Черты характера показательны для человека.
        explain: Черты характера позволяют с известной вероятностью прогнозировать поведение человека в определённых ситуациях.
        src: g05
      - type: matching
        cat: theory
        q: Сопоставьте тип личности по Холланду и предпочтение в работе.
        pairs:
          - ['Реалистичный', 'Работа с инструментами и техникой']
          - ['Социальный', 'Работа с людьми: учить, помогать, лечить']
          - ['Интеллектуальный', 'Исследование и анализ явлений']
          - ['Предприимчивый', 'Руководство и влияние на людей']
        hint: Название типа подсказывает предпочтение.
        explain: Описания типов — по картинке «Типы личности по Холланду» на слайде 6.
        src: g06
