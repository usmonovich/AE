        pairs:
          - ['Меланхолик', 'Излишняя впечатлительность, эмоциональное напряжение']
          - ['Флегматик', 'Инертность, растерянность при быстрой смене обстановки']
          - ['Холерик', 'Самоуверенность, переоценка своих возможностей']
