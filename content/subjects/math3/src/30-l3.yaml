        opts: ['$\dfrac{f^{(n)}(a)}{n!}$', '$f^{(n)}(a)$', '$\dfrac{f(a)}{n!}$', '$\dfrac{f^{(n)}(0)}{n}$']
        ans: a
        hint: 'Look at the factorial.'
        explain: '$f(x) = \sum\frac{f^{(n)}(a)}{n!}(x-a)^n$.'
        src: c79
      - type: numeric
        cat: problem
        q: 'Find the coefficient of $x^3$ in the Maclaurin series of $\sin x$.'
        num: { value: -0.1666667, unit: '', check: '-1/6' }
        hint: '$\sin x = x - \frac{x^3}{3!} + \dots$'
        explain: '$-\frac{1}{3!} = -\frac16 \approx -0.1667$.'
        sol: { method: 'Maclaurin formula.', steps: ['$f^{(3)}(x) = -\cos x$, $f^{(3)}(0) = -1$.', '$c_3 = \frac{-1}{3!} = -\frac16$.'], answer: '−1/6' }
        src: c82
      - type: numeric
        cat: problem
        q: 'Approximate $e^{0.1}$ by the first three terms of its Maclaurin series ($1 + x + \frac{x^2}{2}$).'
        num: { value: 1.105, unit: '', tolAbs: 0.0005, check: '1+0.1+0.01/2' }
        hint: 'Substitute $x = 0.1$.'
        explain: '$1 + 0.1 + 0.005 = 1.105$ (exact value $e^{0.1} \approx 1.10517$).'
        sol: { method: 'Partial sum of the Maclaurin series.', steps: ['$x = 0.1$, $x^2/2 = 0.005$.', '$1 + 0.1 + 0.005 = 1.105$.'], answer: '1.105' }
