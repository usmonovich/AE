      - type: single
        cat: theory
        q: 'The Maclaurin series is the Taylor series centered at'
        opts: ['$a = 0$', '$a = 1$', '$a = -1$', 'any point $a$']
        ans: a
        hint: 'Definition on slide 80.'
        explain: 'Maclaurin series = Taylor series with $a = 0$.'
