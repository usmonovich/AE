        q: 'Which expansion is valid for every $x \in \mathbb{R}$?'
        opts: ['$\cos x = \sum (-1)^n\frac{x^{2n}}{(2n)!}$', '$\frac{1}{1-x} = \sum x^n$', '$\ln(1+x) = \sum(-1)^{n}\frac{x^{n+1}}{n+1}$', 'None of them']
        ans: a
        hint: 'The geometric series requires $|x| < 1$.'
        explain: '$e^x$, $\sin x$, $\cos x$ expand on all of $\mathbb{R}$; $\frac{1}{1-x}$ and $\ln(1+x)$ need $|x| < 1$ (for $\ln(1+x)$ also $x = 1$).'
