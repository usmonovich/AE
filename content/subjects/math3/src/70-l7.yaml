      - type: single
        cat: problem
        q: 'Solve $\frac{dy}{dx} = \frac{x^2 + y^2}{xy}$.'
        opts: ['$\left(\frac yx\right)^2 = 2\ln|x| + C$', '$\frac yx = \ln|x| + C$', '$y^2 = x^2 + C$', '$y = Cx$']
        ans: a
        hint: '$x\frac{dv}{dx} = \frac1v$.'
        explain: '$v\,dv = \frac{dx}{x}$ ⇒ $v^2 = 2\ln|x| + C$, $v = y/x$.'
        src: g42

  - id: m3-linear-first
    title: First-order linear equations (method y = uv)
    pages: [g50, g51, g52, g53, g54, g55]
    theory:
      - kind: definition
        title: First-order linear ODE
        body: 'An equation $a_1(x)\frac{dy}{dx} + a_0(x)y = g(x)$, $a_1(x) \ne 0$, is **linear**. Dividing by $a_1$ gives the standard form $\frac{dy}{dx} + P(x)y = Q(x)$ with $P = \frac{a_0}{a_1}$, $Q = \frac{g}{a_1}$.'
        src: g50
      - kind: law
        title: Method y = uv
        body: |
          Put $y = u(x)v(x)$, $y' = u'v + uv'$: $u'v + u\left(v' + P(x)v\right) = Q(x)$.
          Choose $v$ with $v' + P(x)v = 0$: $\frac{dv}{v} = -P\,dx$, $v = e^{-\int P\,dx}$.
          Then $u'v = Q$, $u' = Qe^{\int P\,dx}$, $u = \int Qe^{\int P\,dx}dx + C$, and
          $y = e^{-\int P(x)dx}\left[\int Q(x)e^{\int P(x)dx}dx + C\right]$.
        src: [g51, g52, g53]
    examples:
      - title: '$y'' + 2y = e^x$'
        given: '$P = 2$, $Q = e^x$; $y = uv$.'
        steps:
          - '$u''v + u(v'' + 2v) = e^x$; choose $v'' + 2v = 0$ ⇒ $v = e^{-2x}$.'
          - '$u''e^{-2x} = e^x$ ⇒ $u'' = e^{3x}$ ⇒ $u = \frac13e^{3x} + C$.'
          - '$y = uv = \left(\frac13e^{3x} + C\right)e^{-2x}$.'
        answer: '$y = \frac13e^x + Ce^{-2x}$'
        src: [g54, g55]
    questions:
      - type: single
        cat: theory
        q: 'Sample exam question (linear/Bernoulli) 1: which is a first-order linear differential equation?'
        opts: ['$y'' + y^2 = x$', '$y'' + xy = \sin x$', '$yy'' + y = x$', '$y'' + \sin y = x$']
        ans: b
        hint: '$y$ and $y''$ only to the first power, not multiplied together, no functions of $y$.'
        explain: '$y'' + xy = \sin x$ has the form $y'' + P(x)y = Q(x)$. The others contain $y^2$, $yy''$, $\sin y$.'
        fromSource: true
        src: g61
      - type: single
        cat: theory
        q: 'Sample exam question 3: for $y'' + P(x)y = Q(x)$ with $y = uv$, which equation should $v$ satisfy?'
        opts: ['$v'' + Q(x)v = 0$', '$v'' + P(x)v = 0$', '$v'' = P(x)$', '$v'' = Q(x)$']
        ans: b
        hint: 'The bracket multiplying $u$ must vanish.'
        explain: 'Then $u''v = Q$.'
        fromSource: true
        src: g63
      - type: single
        cat: theory
        q: 'Sample exam question 5: which equation is NOT linear?'
        opts: ['$y'' + x^2y = e^x$', '$xy'' + 2y = x^3$', '$y'' + y^2 = x$', '$y'' - \frac2x y = x^2$']
        ans: c
        hint: 'Look for a nonlinear term in $y$.'
        explain: '$y^2$ makes C nonlinear.'
        fromSource: true
        src: g65
      - type: single
        cat: theory
        q: 'Sample exam question 8: which equation can be solved both as a separable and as a linear equation?'
        opts: ['$y'' = xy$', '$y'' + y = x$', '$y'' + xy = x^2$', '$y'' + y^2 = 0$']
        ans: a
        hint: 'Separable: $g(x)h(y)$; linear: $y'' + P(x)y = Q(x)$.'
        explain: '$y'' = xy$ is separable ($g = x$, $h = y$) and linear ($y'' - xy = 0$). D is separable but nonlinear; B and C are linear but not separable.'
        fromSource: true
        src: g68
      - type: numeric
        cat: problem
        q: 'Solve $y'' + 2y = e^x$, $y(0) = 1$, and find $y(1)$.'
        num: { value: 0.9963, unit: '', tolAbs: 0.001, check: 'Math.E/3+(2/3)*Math.exp(-2)' }
        hint: '$y = \frac{e^x}{3} + Ce^{-2x}$, $C = 1 - \frac13$.'
        explain: '$C = \frac23$; $y(1) = \frac e3 + \frac23e^{-2} \approx 0.906 + 0.090 = 0.996$.'
        sol: { method: 'General solution + initial condition.', steps: ['$y = \frac{e^x}{3} + Ce^{-2x}$.', '$y(0) = \frac13 + C = 1$ ⇒ $C = \frac23$.', '$y(1) = e/3 + \frac23e^{-2} \approx 0.996$.'], answer: '≈ 0.996' }
        src: g55
      - type: single
        cat: formula
        q: 'Bring $x\,y'' + 2y = x^3$ ($x \ne 0$) to standard form $y'' + P(x)y = Q(x)$.'
        opts: ['$P = \frac2x$, $Q = x^2$', '$P = 2x$, $Q = x^3$', '$P = 2$, $Q = x^2$', '$P = \frac2x$, $Q = x^3$']
        ans: a
        hint: 'Divide by $a_1(x) = x$.'
        explain: '$y'' + \frac2x y = x^2$.'
        src: g50

  - id: m3-bernoulli
    title: Bernoulli equations
    pages: [g57, g58, g59, g60, g61, g62, g63, g64, g65, g66, g67, g68]
    theory:
      - kind: definition
        title: Bernoulli equation
        body: '$y'' + p(x)y = q(x)y^n$, $n \ne 0, 1$. It is **nonlinear** because of $y^n$. Use $v = y^{1-n}$; then $v'' = (1-n)y^{-n}y''$ and the equation becomes **linear** in $v$.'
        src: g57
      - kind: law
        title: Bernoulli transformation
        body: |
          Divide $y' + p(x)y = q(x)y^n$ by $y^n$: $y^{-n}y' + p(x)y^{1-n} = q(x)$.
          With $v = y^{1-n}$: $y^{-n}y' = \frac{v'}{1-n}$, so $\frac{v'}{1-n} + p(x)v = q(x)$.
          Multiply by $1 - n$: $v' + (1-n)p(x)v = (1-n)q(x)$ — a first-order linear equation.
        src: g58
    formulas:
      - title: Bernoulli → linear
        tex: 'y'' + p y = q y^n,\ \ v = y^{1-n}\ \Rightarrow\ v'' + (1-n)p(x)v = (1-n)q(x)'
        src: g58
    examples:
      - title: '$y'' + y = xy^2$'
