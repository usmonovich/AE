# Lecture 8. Higher-order linear ODEs with constant coefficients (slides h01–h66).
# The review quiz (h52–h63) has an answer key on slides h64–h65; all 20 answers were checked.
subsection: m3-l8

topics:
  - id: m3-char-eq
    title: Homogeneous equations — characteristic roots
    pages: [h01, h02, h03, h08, h11, h12, h13, h16, h19, h20, h21, h22, h23, h24, h25, h26, h27, h28, h52, h53, h54, h55, h56, h57, h64]
    theory:
      - kind: text
        title: Motivation
        body: |
          Spring–mass–damper system: $mx'' + cx' + kx = 0$ ($m$ — mass, $c$ — damping coefficient, $k$ — spring stiffness). RLC circuit: $Lq'' + Rq' + \frac1Cq = 0$ ($q(t)$ — electric charge).

          **A common idea:** the type of motion is determined by the **roots of a polynomial**, not by repeated integration.
        src: h03
      - kind: definition
        title: Homogeneous linear ODE with constant coefficients
        body: '$a_ny^{(n)} + a_{n-1}y^{(n-1)} + \dots + a_1y'' + a_0y = 0$, $a_n \ne 0$. The unknown is $y = y(x)$ (or $y(t)$), the coefficients $a_0, \dots, a_n$ are fixed real numbers; the general real solution contains $n$ independent constants. Example: $y'''''' - 4y'''' + y'' + 6y = 0$ (order 3).'
        src: h08
      - kind: law
        title: Characteristic equation
        body: 'Try $y = e^{rx}$: $y'' = re^{rx}$, $y'''' = r^2e^{rx}$, …, $y^{(n)} = r^ne^{rx}$. Substitution gives $e^{rx}(a_nr^n + \dots + a_1r + a_0) = 0$; since $e^{rx} \ne 0$, the **characteristic equation** is $P(r) = a_nr^n + a_{n-1}r^{n-1} + \dots + a_1r + a_0 = 0$.'
        src: h11
      - kind: rule
        title: A systematic solution procedure
        body: |
          1. Write the differential equation in homogeneous form.
          2. Form the characteristic polynomial $P(r)$.
          3. Find all roots, including multiplicities.
          4. Construct the corresponding independent solutions.
          5. Add them to obtain the general solution.
          6. If initial conditions are given, determine the constants.

          **Important:** all roots must be counted with multiplicity. An order-$n$ equation requires $n$ independent solution functions.
        src: h12
      - kind: law
        title: Case 1 — distinct real roots
        body: 'If $P(r) = 0$ has $n$ distinct real roots $r_1, \dots, r_n$: $y = C_1e^{r_1x} + C_2e^{r_2x} + \dots + C_ne^{r_nx}$. Example: $y'''' - 5y'' + 6y = 0$, $r^2 - 5r + 6 = (r-2)(r-3)$, $y = C_1e^{2x} + C_2e^{3x}$.'
        src: h13
      - kind: law
        title: Case 2 — repeated real roots
        body: |
          A real root $r$ of multiplicity $m$ gives $m$ independent solutions $e^{rx}, xe^{rx}, \dots, x^{m-1}e^{rx}$; contribution $(C_1 + C_2x + \dots + C_mx^{m-1})e^{rx}$.

          Example: $y'' - 4y' + 4y = 0$, $(r-2)^2 = 0$, $y = (C_1 + C_2x)e^{2x}$.

          **Common mistake:** $C_1e^x + C_2e^x + C_3e^x$ is only **one** independent function, not three.
        src: [h19, h20]
      - kind: law
        title: Case 3 — complex conjugate roots
        fig: m3-damped-resonance
        body: |
          Real coefficients ⇒ complex roots occur in conjugate pairs $r = \alpha \pm i\beta$, $\beta > 0$. By Euler's formula we get the real pair $e^{\alpha x}\cos\beta x$, $e^{\alpha x}\sin\beta x$:
          $y = e^{\alpha x}(C_1\cos\beta x + C_2\sin\beta x)$.
          $\alpha$ controls exponential growth or decay; $\beta$ controls the oscillation frequency.

          If $\alpha \pm i\beta$ has multiplicity $m$, use the $2m$ functions $x^ke^{\alpha x}\cos\beta x$, $x^ke^{\alpha x}\sin\beta x$, $k = 0, \dots, m-1$. Example: $(D^2 + 4)^2y = 0$ ($D = d/dx$): $y = (C_1 + C_2x)\cos2x + (C_3 + C_4x)\sin2x$.
        src: [h21, h24]
      - kind: text
        title: Quick classification table
        body: |
          | Root type | Example | Solution contribution |
          |---|---|---|
          | Distinct real | $r = 1, -2$ | $C_1e^x + C_2e^{-2x}$ |
          | Repeated real | $r = 3$ (twice) | $(C_1 + C_2x)e^{3x}$ |
          | Complex conjugate | $r = -1 \pm 2i$ | $e^{-x}(C_1\cos2x + C_2\sin2x)$ |
          | Repeated complex | $r = \pm i$ (twice) | $(C_1 + C_2x)\cos x + (C_3 + C_4x)\sin x$ |
        src: h28
      - kind: note
        title: Common mistakes to avoid
        body: |
          - Repeated root: forgetting the factors $x, x^2, \dots$
          - Complex roots: writing only $e^{(\alpha + i\beta)x}$ instead of a real solution basis.
          - Order count: listing fewer independent functions than the order.
          - Initial conditions: differentiating $y$ incorrectly before substituting $x = 0$.
          - Factoring: failing to verify the characteristic polynomial after factorization.
        src: h48
    formulas:
      - title: Characteristic equation
        tex: 'a_n r^n + a_{n-1} r^{n-1} + \dots + a_1 r + a_0 = 0'
        cond: 'For $a_ny^{(n)} + \dots + a_1y'' + a_0y = 0$; obtained by the trial $y = e^{rx}$.'
        src: h11
      - title: Complex roots $\alpha \pm i\beta$
        tex: 'y = e^{\alpha x}\left(C_1\cos\beta x + C_2\sin\beta x\right)'
        src: h21
      - title: Real root of multiplicity m
        tex: '(C_1 + C_2x + \dots + C_mx^{m-1})\,e^{rx}'
        src: h19
      - title: Spring–mass–damper
        tex: 'm x'''' + c x'' + k x = 0'
        vars:
          - { sym: m, name: mass }
          - { sym: c, name: damping coefficient }
          - { sym: k, name: spring stiffness }
        src: h03
    examples:
      - title: 'Three distinct real roots: $y'''''' - 2y'''' - 5y'' + 6y = 0$'
        given: '$P(r) = r^3 - 2r^2 - 5r + 6$.'
        steps:
          - '$P(r) = (r-1)(r-3)(r+2)$; roots $1, 3, -2$.'
          - 'Each term solves the ODE because its exponent is a root of $P$.'
        answer: '$y = C_1e^x + C_2e^{3x} + C_3e^{-2x}$'
        src: h16
      - title: 'Triple root: $y'''''' - 3y'''' + 3y'' - y = 0$'
        given: '$P(r) = r^3 - 3r^2 + 3r - 1 = (r-1)^3$.'
        steps:
          - '$r = 1$ has multiplicity 3: functions $e^x, xe^x, x^2e^x$.'
        answer: '$y = (C_1 + C_2x + C_3x^2)e^x$'
        src: h20
      - title: 'Purely imaginary and damped oscillations'
        given: '$y'''' + 9y = 0$ and $y'''' + 4y'' + 13y = 0$.'
        steps:
          - '$r^2 + 9 = 0$, $r = \pm3i$ ⇒ $y = C_1\cos3x + C_2\sin3x$.'
          - '$r^2 + 4r + 13 = 0$, $r = \frac{-4 \pm \sqrt{16 - 52}}{2} = -2 \pm 3i$ ⇒ $y = e^{-2x}(C_1\cos3x + C_2\sin3x)$.'
        answer: 'undamped: $C_1\cos3x + C_2\sin3x$; damped: $e^{-2x}(C_1\cos3x + C_2\sin3x)$'
        src: [h22, h23]
      - title: 'Mixed roots: $y^{(4)} - 2y'''''' + 2y'''' - 10y'' - 15y = 0$'
        given: '$P(r) = (r-3)(r+1)(r^2+5)$ — check: multiplying the factors reproduces the ODE.'
        steps:
          - 'Operator form $(D-3)(D+1)(D^2+5)y = 0$.'
          - 'Roots $3, -1, \pm i\sqrt5$.'
        answer: '$y = C_1e^{3x} + C_2e^{-x} + C_3\cos\sqrt5x + C_4\sin\sqrt5x$'
        src: h25
      - title: 'IVP: $y'''' - 3y'' + 2y = 0$, $y(0) = 4$, $y''(0) = 5$'
        given: '$r^2 - 3r + 2 = (r-1)(r-2)$, $y = C_1e^x + C_2e^{2x}$, $y'' = C_1e^x + 2C_2e^{2x}$.'
        steps:
          - '$x = 0$: $C_1 + C_2 = 4$, $C_1 + 2C_2 = 5$.'
          - '$C_2 = 1$, $C_1 = 3$.'
        answer: '$y = 3e^x + e^{2x}$'
        src: h26
      - title: 'IVP with complex roots: $y'''' + 4y = 0$, $y(0) = 2$, $y''(0) = -4$'
        given: '$y = C_1\cos2x + C_2\sin2x$, $y'' = -2C_1\sin2x + 2C_2\cos2x$.'
        steps:
          - '$y(0) = C_1 = 2$; $y''(0) = 2C_2 = -4$ ⇒ $C_2 = -2$.'
        answer: '$y = 2\cos2x - 2\sin2x$'
        src: h27
      - title: 'Student check (slides 34–35): general solution forms'
        given: '1) $y'''' - y = 0$; 2) $y'''' + 6y'' + 9y = 0$; 3) $y'''' - 2y'' + 10y = 0$; 4) $y'''''' - y'''' = 0$.'
        steps:
          - '1) $r = \pm1$: $C_1e^x + C_2e^{-x}$.'
          - '2) $r = -3$ (double): $(C_1 + C_2x)e^{-3x}$.'
          - '3) $r = 1 \pm 3i$: $e^x(C_1\cos3x + C_2\sin3x)$.'
          - '4) $r^2(r - 1) = 0$: $C_1 + C_2x + C_3e^x$.'
        answer: 'see the steps'
        src: [h46, h47]
      - title: 'Independent practice (slide 39)'
        given: '1) $y'''' - 7y'' + 12y = 0$; 2) $y'''''' - 6y'''' + 12y'' - 8y = 0$; 3) $y'''' + 2y'' + 5y = 0$; 4) $(D-1)^2(D^2+1)y = 0$; 5) $y'''' - 4y = 0$, $y(0) = 1$, $y''(0) = 0$.'
        steps:
          - '1) $(r-3)(r-4) = 0$: $C_1e^{3x} + C_2e^{4x}$.'
          - '2) $(r-2)^3 = 0$: $(C_1 + C_2x + C_3x^2)e^{2x}$.'
          - '3) $r = -1 \pm 2i$: $e^{-x}(C_1\cos2x + C_2\sin2x)$.'
          - '4) $r = 1$ (double), $r = \pm i$: $(C_1 + C_2x)e^x + C_3\cos x + C_4\sin x$.'
          - '5) $y = C_1e^{2x} + C_2e^{-2x}$; $C_1 + C_2 = 1$, $2C_1 - 2C_2 = 0$ ⇒ $C_1 = C_2 = \frac12$: $y = \frac{e^{2x} + e^{-2x}}{2} = \cosh2x$.'
        answer: 'see the steps'
        src: h51
