errata:
  - id: hpm-e01
    page: a04
    severity: unclear
    target: причины язвенной болезни
    original: 'Л1·4: перечислены только предрасполагающие факторы (курение, стресс, нарушение режима питания, наследственность); рекомендован отказ от бульонов, специй, кофе, цитрусовых.'
    issue: 'Самые частые причины язвенной болезни желудка и двенадцатиперстной кишки — инфекция Helicobacter pylori и приём нестероидных противовоспалительных средств (ибупрофен, напроксен и др.). Связь болезни с питанием, по данным NIDDK, не доказана; специальная диета не рекомендуется.'
    suggestion: 'Добавить основные причины (H. pylori, НПВС) перед предрасполагающими факторами. В приложении это отдельное уточнение с источником (NIDDK).'
  - id: hpm-e02
    page: b01
    severity: typo
    target: нумерация частей лекции 2
    original: '«ЧАСТЬ III» стоит и в начале лекции (Л2·1, перед органом слуха), и перед костно-мышечной системой (Л2·9).'
    issue: 'Одна и та же часть указана дважды; частей I и II в файле нет.'
    suggestion: 'В начале лекции поставить «ЧАСТЬ I» (орган слуха, сердце, нервная система, зрение), а перед костно-мышечной системой — «ЧАСТЬ II».'
  - id: hpm-e03
    page: b02
    severity: error
    target: артерии и вены
    original: '«Артерии — сосуды, по которым кровь выходит из сердца, обогащённая кислородом. Вены — сосуды, по которым кровь приходит в сердце, мало кислорода».'
    issue: 'Артерии и вены различают по направлению тока крови (от сердца / к сердцу), а не по кислороду. В малом круге наоборот: лёгочная артерия несёт бедную кислородом кровь, лёгочные вены — богатую.'
    suggestion: '«Артерии несут кровь от сердца, вены — к сердцу. В большом круге артериальная кровь богата кислородом, в малом круге — наоборот».'
  - id: hpm-e04
    page: b03
    severity: error
    target: неотложная помощь при приступе стенокардии
    original: '«…если нет эффекта, через 3–5 мин повторно 1 таб. нитроглицерина под язык (но не более 5 раз)».'
    issue: 'В распространённых рекомендациях: 1 таблетка под язык, при сохранении боли — ещё по одной каждые 5 минут, но не более 3 таблеток за 15 минут; если боль не проходит — сразу вызвать скорую помощь (Mayo Clinic). Порог давления для отказа от нитроглицерина в разных протоколах разный — часто это систолическое давление ниже 90 мм рт. ст.'
    suggestion: 'Заменить «не более 5 раз» на «не более 3 таблеток» и добавить «если боль не прошла — вызвать скорую помощь». Порог давления уточнить по действующему протоколу.'
  - id: hpm-e05
    page: c01
    severity: unclear
    target: норма гемоглобина
    original: '«В норме в 1 литре крови взрослого человека содержится 120–150 грамм гемоглобина».'
    issue: 'Норма зависит от пола. По критериям ВОЗ анемия у мужчин — ниже 130 г/л, у небеременных женщин — ниже 120 г/л; 120–150 г/л — типичный диапазон для женщин.'
    suggestion: 'Указать нормы отдельно для мужчин и женщин.'
  - id: hpm-e06
    page: c04
    severity: error
    target: нормобарическая гипоксическая гипоксия
    original: '«Нормобарическая гипоксическая гипоксия (при № парц.давлении = 760 мм.рт.ст.)»: заболевания лёгких, пневмония, астма, отравление угарным газом…'
    issue: '760 мм рт. ст. — общее атмосферное давление на уровне моря, а не парциальное давление (парциальное давление кислорода ≈ 159 мм рт. ст.); «№» — опечатка. Отравление угарным газом обычно относят к гемической (кровяной) гипоксии: CO связывается с гемоглобином (FAA, Pilot''s Handbook, гл. 17), а заболевания лёгких — к дыхательной.'
    suggestion: '«…при нормальном атмосферном давлении (760 мм рт. ст.)»; отравление CO перенести в гемическую гипоксию.'
  - id: hpm-e07
    page: d07
    severity: error
    target: высота после подводного плавания
    original: '«…на высотах 7000 фут (2450 тыс. м) или ниже, на которых летает большинство лёгких самолётов».'
    issue: '2450 м — это примерно 8000 футов (7000 футов ≈ 2130 м), и «тыс.» лишнее. В FAA AC 61-107B граница для перерыва после дайвинга — 8000 футов.'
    suggestion: '«…на высотах 8000 футов (2450 м) или ниже».'
  - id: hpm-e08
    page: d08
    severity: error
    target: функция тромбоцитов
    original: '«Тромбоциты — клетки, которые следят за жидким состоянием крови».'
    issue: 'Главная функция тромбоцитов — остановка кровотечения: они склеиваются в месте повреждения сосуда и запускают свёртывание. Жидкое состояние крови поддерживает равновесие свёртывающей и противосвёртывающей систем.'
    suggestion: '«Тромбоциты — кровяные пластинки, участвуют в свёртывании крови и остановке кровотечения».'
  - id: hpm-e09
    page: e01
    severity: error
    target: виды перегрузок по направлению
    original: '«Продольные („грудь — спина“ или „спина — грудь“): возникают при разгоне, торможении или катапультировании».'
    issue: 'Перегрузки по оси «грудь — спина» называют поперечными (±Gx). Продольные — вдоль оси тела «голова — ноги» (±Gz), то есть положительные и отрицательные из того же списка; боковые — по оси «плечо — плечо» (±Gy).'
    suggestion: 'Заменить «Продольные» на «Поперечные» и добавить, что положительные и отрицательные перегрузки — это продольные.'
  - id: hpm-e10
    page: e01
    severity: unclear
    target: определение перегрузки
    original: '«…сила, действующая на лётчика, равна ускорению, т. е. F = a»; «если внешняя сила сообщает телу ускорение 5g, то перегрузка будет равна 5».'
    issue: 'Сила не равна ускорению: F = ma. Перегрузка — отношение силы реакции опоры к весу тела (так и сказано на Л5·2): n = N/(mg). При ускорении a вверх n = 1 + a/g, поэтому дополнительное ускорение 5g даёт перегрузку 6.'
    suggestion: 'Оставить одно определение: «перегрузка n = N/(mg) — во сколько раз сила давления опоры больше веса тела в покое».'
  - id: hpm-e11
    page: e05
    severity: unclear
    target: направление ускорения и переносимость
    original: '«Устойчивость организма к радиальному ускорению, действующему в направлении от головы к ногам, значительно ниже, чем к ускорению, направленному от ног к голове».'
    issue: 'На Л5·1 направление перегрузки обозначено по смещению крови («голова — ноги» = +g). Здесь «от головы к ногам» — направление ускорения, то есть −Gz. Фраза верна только при таком чтении; читатель может понять наоборот. По справочным данным хуже переносятся отрицательные перегрузки (−Gz, кровь приливает к голове).'
    suggestion: '«Отрицательные перегрузки (−Gz, кровь приливает к голове) переносятся значительно хуже положительных (+Gz)».'
  - id: hpm-e12
    page: e08
    severity: unclear
    target: объективные признаки переутомления
    original: '«повышение содержания натрия и понижение кальциевых и калиевых солей; снижение уровня тромбоцитов; лейкоцитоз, эритроцитоз; повышение количества гемоглобина».'
    issue: 'Для этих лабораторных показателей в лекции нет источника; найти подтверждение в справочниках не удалось. В приложение они не включены.'
    suggestion: 'Указать источник или убрать список.'
  - id: hpm-e13
    page: e09
    severity: error
    target: год описания общего адаптационного синдрома
    original: '«…общий адаптационный синдром (ОАС). Последний, по мнению Г. Селье (1960), проходит три стадии…»'
    issue: 'Г. Селье впервые описал синдром в 1936 году (письмо в журнал Nature «A syndrome produced by diverse nocuous agents»). Книга «Стресс жизни» вышла в 1956 году.'
    suggestion: '«Г. Селье (1936)».'
  - id: hpm-e14
    page: f02
    severity: error
    target: содержание озона
    original: '«Если в приземном слое его содержание незначительно (5% по объёму)…»; «Этот газ поглощает около 4% солнечной энергии» (Л6·2), но «Всего озоновый слой поглощает около 13% солнечной энергии» (Л6·4).'
    issue: 'Озона у земли — миллиардные доли объёма, а не 5%. Вероятно, имелась в виду доля всего озона: около 10% находится в тропосфере, около 90% — в стратосфере (NOAA). Две доли поглощаемой солнечной энергии (4% и 13%) противоречат друг другу.'
    suggestion: '«В тропосфере — около 10% всего озона, в стратосфере — около 90%». Долю поглощаемой энергии привести одну, с источником.'
  - id: hpm-e15
    page: f04
    severity: error
    target: единицы дозы
    original: '«Наименьшая единица — 1 микрозиверт/час (мкЗв/час). 1000 микрозивертов — это 1 миллизиверт (мЗв/час)».'
    issue: 'Смешаны доза (мкЗв, мЗв) и мощность дозы (мкЗв/ч). Микрозиверт — не «наименьшая единица», а дольная: 1 мЗв = 1000 мкЗв.'
    suggestion: '«Доза измеряется в зивертах (1 Зв = 1000 мЗв = 1 000 000 мкЗв); мощность дозы — в мкЗв/ч».'
  - id: hpm-e16
    page: f04
    severity: error
    target: годовая доза обычного человека
    original: '«Обычный человек за год получает дозу 0,1 мЗв».'
    issue: 'В среднем по миру от природных источников человек получает около 2,4 мЗв в год (около 2 мЗв от земных и 0,4 мЗв от космических источников, ICRPaedia). Даже по цифре самой лекции (0,1 мкЗв/ч) за год получается 0,1 × 8760 ≈ 0,9 мЗв, а не 0,1.'
    suggestion: '«Обычный человек получает от природного фона в среднем около 2,4 мЗв в год».'
  - id: hpm-e17
    page: f04
    severity: unclear
    target: норматив для лётчиков
    original: '«Для лётчиков норматив — 5 мЗв в год, при работе на АЭС такой норматив составляет уже 20 мЗв в год, для космонавтов — 500 мЗв в год».'
    issue: 'Источник норматива 5 мЗв не указан. По МАГАТЭ, предел для профессионального облучения — 20 мЗв в год (для любых работников, в т. ч. экипажей); средняя доза экипажей — менее 1 мЗв в год, на дальних полярных рейсах — около 6 мЗв.'
    suggestion: 'Указать документ, в котором установлен норматив 5 мЗв, или привести предел 20 мЗв/год и типичные дозы экипажей.'
  - id: hpm-e18
    page: f05
    severity: error
    target: доля воды в организме
    original: '«Поскольку организм человека состоит из воды более чем на 80%…»'
    issue: 'У взрослых вода составляет в среднем около 50–60% массы тела (у мужчин больше, у женщин меньше); 80% и более — только у отдельных тканей.'
    suggestion: '«…организм взрослого человека примерно на 60% состоит из воды…».'
  - id: hpm-e19
    page: g01
    severity: error
    target: ранние признаки биологической смерти
    original: '«Помутнение радужной оболочки — 20 мин, затем высыхание»; «Трупное охлаждение — на 1°С в час. - Читайте подробнее на до температуре окружающей среды 20 гр.»'
    issue: 'Мутнеет и высыхает роговица, а не радужная оболочка — так подписано и на рисунке той же страницы («Помутнение роговицы»). Во втором пункте остался обрывок текста с сайта.'
    suggestion: '«Помутнение и высыхание роговицы»; «Трупное охлаждение — примерно на 1 °C в час до температуры окружающей среды».'
  - id: hpm-e20
    page: g02
    severity: unclear
