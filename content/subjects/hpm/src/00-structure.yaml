# 🩺 Human Performance and Medicine
# Структура курса, файлы-источники, словарь обозначений, замечания к источнику.
# Источник — 7 лекций преподавателя в формате Word (.docx). Для приложения каждый файл переведён в PDF
# (LibreOffice) и разбит на страницы: a — лекция 1, b — лекция 2, … g — лекция 7 (c04 — лекция 3, страница 4).
# Теория изложена своими словами по лекциям. Раздел «Основы» и записи с пометкой «из интернета» — добавлены
# для начинающих и не входят в лекции. Вопросов в лекциях нет: все задания составлены по материалам.
# ID разделов, подразделов, тем и записей начинаются с «hpm-».

