topics:
  - id: hpm-l1-avmed
    title: Авиационная медицина и особенности лётного труда
    pages: [a01, a02]
    theory:
      - kind: definition
        title: Авиационная медицина
        body: '**Авиационная медицина** — отрасль медицины, изучающая влияние условий среды и факторов профессиональной деятельности на здоровье и работоспособность авиационных специалистов. Цели: повысить эффективность их труда, снизить заболеваемость, обеспечить **безопасность полётов** и продлить **лётное долголетие**.'
        src: a01
      - kind: list
        title: Направления деятельности
        body: |
          - **Медицинский отбор** — определение пригодности к лётной службе (пилоты, штурманы, бортрадисты, бортинженеры, бортпроводники).
          - Вопросы работы членов экипажей и самочувствия пассажиров в полёте.
          - Изучение **особых состояний организма**: лётное утомление, переутомление, хроническое утомление, высотная, воздушная и декомпрессионная болезни, баротравмы.
        src: a01
      - kind: definition
        title: Авиационная физиология и ВЛЭК
        body: |
          - **Авиационная физиология** изучает влияние факторов внешней среды и факторов полёта на организм и приспособление организма к этим условиям.
          - **Врачебно-лётная экспертиза (ВЛЭК)** — самостоятельная дисциплина: система мероприятий по медицинскому отбору, наблюдению за здоровьем, лечению и профилактике заболеваний, освидетельствованию и разработке новых методов обследования лётного состава.
          - **Авиационная клиническая медицина** изучает проблемы авиационной медицины у лиц лётного состава с отклонениями в состоянии здоровья.
        src: a01
      - kind: list
        title: Задачи авиационной медицины
        body: |
          1. Исследование влияния факторов полёта на организм человека.
          2. Исследование деятельности человека в аварийных ситуациях.
          3. Медицинские рекомендации для безопасности полётов и эффективности труда.
          4. Исследование психофизиологических возможностей лётчиков.
          5. Требования к здоровью лётного состава и курсантов, организация врачебно-лётной экспертизы.
          6. Исследование причин лётных происшествий.
        src: a01
      - kind: list
        title: Факторы внешней среды в полёте
        body: 'Изменение атмосферного (барометрического) давления; увеличение объёма газов; снижение парциального давления кислорода; рост радиации и падение температуры с высотой; скорость; ускорение; шум; вибрация.'
        src: a01
      - kind: text
        title: Три группы факторов полёта
        body: |
          По таблице лекции «Основные факторы авиационного полёта»:

          **1. Внешняя среда как среда обитания:** низкое барометрическое давление; сниженное парциальное давление кислорода; изменённые температурные условия; изменение влажности; уменьшение геомагнитного поля Земли; изменение ритмов (временных, социальных); изменение электромагнитных излучений (освещённости).

          **2. Динамика полёта:** ускорения; шумы; вибрации; динамическая невесомость.

          **3. Пребывание в кабине малого объёма:** относительная изоляция; гиподинамия и гипокинезия; искусственный микроклимат кабины.
        src: a02
      - kind: list
        title: Особенности лётного труда
        body: |
          1. Высокая психофизиологическая напряжённость из-за опасности и ответственности — постоянные стрессы, быстрое утомление.
          2. Особое функционирование систем организма в полёте.
          3. Специфические условия получения информации.
          4. Высокие требования к оперативной памяти.
          5. Сложная пространственная ориентировка.
          6. Психоэмоциональная нагрузка на этапах полёта; самые сложные и опасные — **взлёт и посадка**.
          7. Действие трёх групп факторов (см. таблицу).
        src: a02
      - kind: list
        title: Почему профессия лётчика опасна
        body: 'Нужно управлять воздушным судном в пространстве **по трём осям**; на лётчика непосредственно действуют многочисленные факторы риска; ошибка грозит гибелью самого лётчика, экипажа и пассажиров.'
        src: a02
    questions:
      - type: single
        cat: theory
        q: Какая дисциплина занимается медицинским отбором, наблюдением за здоровьем и освидетельствованием лётного состава?
        opts: ['Врачебно-лётная экспертиза (ВЛЭК)', 'Авиационная физиология', 'Авиационная психология', 'Метеорология']
        ans: a
        hint: Сокращение из четырёх букв.
        explain: 'ВЛЭК — система мероприятий по отбору, наблюдению, лечению, профилактике и освидетельствованию лётного состава.'
        src: a01
      - type: single
        cat: theory
        q: Что изучает авиационная физиология?
        opts: ['Влияние факторов среды и полёта на организм и приспособление к ним', 'Устройство воздушного судна', 'Правила полётов', 'Только болезни лётчиков']
        ans: a
        hint: Физиология — наука о функциях организма.
        explain: 'Авиационная физиология изучает влияние факторов внешней среды и полёта на организм и его адаптацию к этим условиям.'
        src: a01
      - type: matching
        cat: theory
        q: Сопоставьте фактор полёта и его группу.
        pairs:
          - ['Сниженное парциальное давление кислорода', 'Внешняя среда как среда обитания']
          - ['Вибрации', 'Динамика полёта']
          - ['Гиподинамия и гипокинезия', 'Пребывание в кабине малого объёма']
        hint: Таблица «Основные факторы авиационного полёта».
        explain: 'Давление и кислород — среда; ускорения, шум, вибрация, невесомость — динамика полёта; изоляция, гиподинамия, микроклимат — кабина.'
        src: a02
      - type: multiple
        cat: theory
        q: Какие факторы относятся к динамике полёта?
        opts: ['Ускорения', 'Шумы', 'Динамическая невесомость', 'Относительная изоляция']
        ans: [a, b, c]
        hint: Изоляция связана с кабиной.
        explain: 'К динамике полёта относятся ускорения, шумы, вибрации и динамическая невесомость; изоляция — фактор кабины малого объёма.'
        src: a02
      - type: single
        cat: theory
        q: Какие этапы полёта лекция называет наиболее сложными и опасными?
        opts: ['Взлёт и посадка', 'Крейсерский полёт', 'Руление', 'Предполётный осмотр']
        ans: a
        hint: Начало и конец полёта.
        explain: 'Психоэмоциональная нагрузка наиболее высока на взлёте и посадке.'
        src: a02
      - type: multiple
        cat: theory
        q: Какие особые состояния организма изучает авиационная медицина?
        opts: ['Лётное утомление и переутомление', 'Высотная и декомпрессионная болезни', 'Баротравмы', 'Обледенение крыла']
        ans: [a, b, c]
        hint: Обледенение — проблема самолёта, а не человека.
        explain: 'Особые состояния: утомление, переутомление, хроническое утомление, высотная, воздушная и декомпрессионная болезни, баротравмы.'
        src: a01

  - id: hpm-l1-resp
    title: Дыхательная система, баротравма лёгких, ХОБЛ и астма
    pages: [a03]
    theory:
      - kind: definition
        title: Строение и функции дыхательных путей
        body: |
          - **Верхние дыхательные пути**: нос, рот, глотка.
          - **Нижние дыхательные пути**: гортань, трахея, бронхи и лёгкие.

          Функции дыхательных путей — **очищение, увлажнение и согревание** вдыхаемого воздуха.
        src: a03
      - kind: definition
        title: Баротравма лёгких
        body: |
          **Баротравма лёгких** — жизнеугрожающее состояние. Возникает при резком подъёме (падении внешнего давления), особенно **в фазе вдоха и при задержке дыхания**: расширяющийся воздух растягивает и повреждает лёгочную ткань.

          Признаки: кожа и слизистые синеют; на шее и груди — **подкожная эмфизема** (воздух под кожей); при выходе воздуха в грудную полость — **пневмоторакс** с резким ухудшением состояния и одышкой; нарушения глотания, изменение голоса.

          Пузырьки воздуха в крови могут вызвать **эмболию** сосудов сердца (боль в левой половине груди) и мозга (судороги, потеря сознания, нарушения зрения, парезы и параличи). В лёгком случае — покалывание в конечностях.
        src: a03
      - kind: definition
        title: Хроническая обструктивная болезнь лёгких (ХОБЛ)
        body: |
          **ХОБЛ** — хроническое воспалительное заболевание с поражением мелких бронхов, которое нарушает дыхание.

          Основные причины — вредные факторы окружающей среды и **курение**; другие — загрязнение среды, частые инфекции дыхательных путей, наследственность. Типичный пациент — курящий человек 45–50 лет с одышкой при нагрузке. Симптомы: **кашель, мокрота** (особенно по утрам), **одышка**.
        src: a03
      - kind: definition
        title: Бронхиальная астма
        body: 'Заболевание бронхов; симптомы — **свистящие хрипы**, одышка, заложенность в груди и кашель.'
        src: a03
    questions:
      - type: single
        cat: theory
        q: В какой фазе дыхания особенно опасен резкий подъём с точки зрения баротравмы лёгких?
        opts: ['В фазе вдоха, при задержке дыхания', 'В фазе выдоха', 'Во время сна', 'Фаза дыхания не имеет значения']
        ans: a
        hint: Лёгкие полны воздуха, а выйти ему некуда.
        explain: 'Баротравма лёгких возникает при резком подъёме, особенно в фазе вдоха и при задержке дыхания.'
        src: a03
      - type: multiple
        cat: theory
        q: Какие функции выполняют дыхательные пути?
        opts: ['Очищение вдыхаемого воздуха', 'Увлажнение', 'Согревание', 'Насыщение воздуха азотом']
        ans: [a, b, c]
        hint: Три функции из лекции.
        explain: 'Дыхательные пути очищают, увлажняют и согревают вдыхаемый воздух.'
        src: a03
      - type: matching
        cat: theory
        q: Сопоставьте отдел дыхательных путей и его части.
        pairs:
          - ['Верхние дыхательные пути', 'Нос, рот, глотка']
          - ['Нижние дыхательные пути', 'Гортань, трахея, бронхи, лёгкие']
        hint: Граница проходит между глоткой и гортанью.
        explain: 'Верхние — нос, рот, глотка; нижние — гортань, трахея, бронхи и лёгкие.'
        src: a03
      - type: single
        cat: theory
        q: Что такое подкожная эмфизема при баротравме лёгких?
        opts: ['Воздух под кожей шеи и груди', 'Кровоизлияние в мозг', 'Воспаление бронхов', 'Скопление жидкости в лёгких']
        ans: a
        hint: Эмфизема — «вздутие» воздухом.
        explain: 'При баротравме воздух из повреждённого лёгкого может проникать под кожу шеи и грудной клетки.'
        src: a03
      - type: single
        cat: theory
        q: Какая главная причина ХОБЛ названа в лекции наряду с вредными факторами среды?
        opts: ['Табакокурение', 'Недостаток сна', 'Укачивание', 'Перегрузки']
        ans: a
        hint: Типичный пациент — курящий человек 45–50 лет.
        explain: 'Основные причины ХОБЛ — вредные факторы окружающей среды и табакокурение.'
        src: a03
      - type: multiple
        cat: theory
        q: Какие симптомы характерны для бронхиальной астмы?
        opts: ['Свистящие хрипы', 'Одышка', 'Заложенность в груди и кашель', 'Боль в суставах']
        ans: [a, b, c]
        hint: Всё связано с бронхами.
        explain: 'Симптомы астмы: свистящие хрипы, одышка, заложенность в груди, кашель.'
        src: a03

  - id: hpm-l1-digest
    title: Пищеварительная система, язвенная болезнь и высотный метеоризм
    pages: [a03, a04, a05]
    theory:
      - kind: definition
        title: Пищеварительная система
        body: 'Включает ротовую полость, глотку, пищевод, желудок, тонкую и толстую кишку, а также пищеварительные железы.'
        src: a03
      - kind: definition
        title: Язвенная болезнь желудка
        body: |
          **Язвенная болезнь** — хроническое рецидивирующее заболевание, при котором возникают дефекты слизистой оболочки желудка (или двенадцатиперстной кишки). Без своевременного лечения может привести к инвалидности или гибели.

          **Предрасполагающие факторы** (по лекции): курение; нервно-эмоциональное перенапряжение (стрессы); нарушение режима дня и питания, рафинированные продукты и фастфуд; отягощённая наследственность.
        src: a04
        errata: [hpm-e01]
      - kind: note
        title: 'Уточнение: главные причины язвы'
        body: 'По данным NIDDK (Национальный институт здоровья США), самые частые причины язвенной болезни — **инфекция Helicobacter pylori** и приём **нестероидных противовоспалительных средств** (ибупрофен, напроксен и др.). Перечисленные в лекции факторы повышают риск и ухудшают течение. **Это дополнение не входит в лекцию.**'
        src: a04
        web: [*niddk]
      - kind: list
        title: Клиника язвы двенадцатиперстной кишки
        body: |
          1. Боли через 1,5–2 часа после еды (поздние боли), натощак (голодные) и ночные.
          2. Рвота на высоте боли, приносит облегчение.
          3. Изжога, отрыжка кислым после еды.
          4. Запоры.
          5. Повышение аппетита.
        src: a04
      - kind: list
        title: Профилактика язвенной болезни (по лекции)
        body: |
          - Избегать стрессов, эмоциональных и физических перегрузок; соблюдать режим дня, достаточно спать.
          - Отказаться от курения и алкоголя.
          - Частое (5–6 раз в день) дробное питание.
          - Исключить продукты, раздражающие слизистую и усиливающие выделение соляной кислоты (крепкие бульоны, специи, маринады, газированные напитки, кофе, крепкий чай, цитрусовые); рекомендуются отварное мясо и рыба, яйца, молочные продукты, тушёные овощи, каши, щелочная минеральная вода.
        src: a04
      - kind: definition
        title: Высотный метеоризм
        body: |
          **Высотный метеоризм** — патологическое состояние желудочно-кишечного тракта при пониженном атмосферном давлении. Газ в желудке и кишечнике при подъёме **расширяется** и, не успевая выйти естественным путём, растягивает полые органы брюшной полости.

          Признаки: боли в животе, бледность, обильный пот, обморок; пульс редкий, дыхание поверхностное, давление низкое (до 80/40 мм рт. ст.). **Быстрое снижение с высоты устраняет** болезненные явления.
        src: a04
      - kind: list
        title: Степени тяжести и профилактика метеоризма
        body: |
          - **Первая** — лёгкий дискомфорт в животе
          - **Вторая** — выраженный дискомфорт
          - **Третья** — сильные боли

          **Профилактика:** соблюдение режима питания лётным составом и пассажирами; исключение продуктов, ведущих к газообразованию.
        src: a05
    questions:
      - type: single
        cat: theory
        q: Почему на высоте возникает высотный метеоризм?
        opts: ['Газ в желудке и кишечнике расширяется при падении давления', 'В кишечнике образуется больше кислоты', 'Падает температура тела', 'Растёт парциальное давление кислорода']
        ans: a
        hint: Закон Бойля — Мариотта.
        explain: 'При подъёме давление падает, газ в ЖКТ расширяется и растягивает полые органы.'
        src: a04
      - type: single
        cat: theory
        q: Что быстрее всего устраняет болезненные явления высотного метеоризма?
        opts: ['Быстрое снижение с высоты', 'Набор высоты', 'Приём пищи', 'Задержка дыхания']
        ans: a
        hint: Давление должно вырасти.
        explain: 'При снижении давление растёт и газ сжимается — боль уходит.'
        src: a04
      - type: sequence
        cat: theory
        q: Расположите степени тяжести высотного метеоризма от лёгкой к тяжёлой.
        seq: ['Лёгкий дискомфорт в животе', 'Выраженный дискомфорт', 'Сильные боли']
        hint: Три степени.
        explain: 'Первая — лёгкий дискомфорт, вторая — выраженный, третья — сильные боли.'
        src: a05
      - type: multiple
        cat: theory
        q: Какие признаки характерны для язвы двенадцатиперстной кишки?
        opts: ['Боли через 1,5–2 часа после еды, голодные и ночные боли', 'Рвота на высоте боли, приносящая облегчение', 'Изжога и отрыжка кислым', 'Свистящие хрипы']
        ans: [a, b, c]
        hint: Хрипы — признак болезни бронхов.
        explain: 'Поздние, голодные и ночные боли, рвота с облегчением, изжога — типичные признаки.'
        src: a04
