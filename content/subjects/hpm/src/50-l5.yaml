  - id: hpm-l5-stress
    title: Стресс и адаптация
    pages: [e09, e10]
    theory:
      - kind: definition
        title: Стресс
        body: |
          **Стресс** — реакция, направленная на преодоление трудностей, в том числе на выполнение полётного задания в усложнённых или аварийных ситуациях. Небольшие стрессы неизбежны и безвредны; проблемы создаёт **чрезмерный** стресс.

          Любое событие может стать **стрессором** — это зависит и от ситуации, и от личности: опыта, уверенности в себе, стрессоустойчивости.
        src: e09
      - kind: law
        title: Общий адаптационный синдром (Г. Селье)
        body: 'Любой стрессор вызывает специфическую реакцию и общую неспецифическую — **общий адаптационный синдром**. По Г. Селье, он проходит **три стадии: тревоги, резистентности (сопротивления) и истощения**.'
        src: e09
        errata: [hpm-e13]
      - kind: note
        title: 'Уточнение: когда описан синдром'
        body: 'Г. Селье впервые описал общий адаптационный синдром в **1936 году** — в коротком письме в журнал Nature. В лекции указан 1960 год. **Это уточнение не из лекции.**'
        src: e09
        web: [*selye]
      - kind: list
        title: Стресс у пилотов
        body: |
          С повторением полётов и упрочением навыков эмоциональный стресс угасает. Тренировки доводят действия в аварийной ситуации **до автоматизма** — стресс становится адекватной защитной реакцией.

          Два уровня стресс-реакций:
          1. **умеренное напряжение** функциональных систем — помогает решить проблему и повышает эффективность;
          2. **гипермобилизация** — чрезмерное и длительное напряжение, ведущее к нарушениям здоровья и поведения, вплоть до потери работоспособности.

          Сильнее всего стресс разрушает **восприятие и мышление**: пилот может «потерять» приборы, не заметить сигнализацию о выпуске шасси, неверно понять происходящее.
        src: e09
      - kind: definition
        title: Адаптация
        body: |
          **Адаптация** — способность организма приспосабливаться к постоянно меняющимся условиям. При длительном действии необычных факторов в организме развиваются адаптационные перестройки. Адаптация, например, к кислородному голоданию повышает устойчивость не только к высоте, но и к статокинетическим, физическим и тепловым нагрузкам.

          **Способы повысить общую устойчивость:**
          1. физические: физкультура, закаливание, медицинский и психологический отбор, здоровый образ жизни, психологическая подготовка, лекарства (транквилизаторы, ноотропы, адаптогены) — **только по назначению врача**, неспецифическая тренировка (гипоксия, сауна, электросон);
          2. аутогенная тренировка, психотерапия;
          3. биологически активные вещества.
        src: e10
    questions:
      - type: sequence
        cat: theory
        q: Расположите стадии общего адаптационного синдрома по Г. Селье.
        seq: ['Тревога', 'Резистентность', 'Истощение']
        hint: Сначала — тревога, в конце — истощение.
