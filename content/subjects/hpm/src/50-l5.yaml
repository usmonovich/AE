# Лекция 5. Перегрузка. Утомление. Переутомление. Стресс и адаптация (страницы e01–e10).
subsection: hpm-l5

refs:
  - &selye { title: 'H. Selye. A Syndrome produced by Diverse Nocuous Agents. Nature 138, 32 (1936)', url: 'https://www.nature.com/articles/138032a0', org: Nature, checked: '2026-11-04' }
  - &faag { title: 'Acceleration in Aviation: G-Force (pilot safety brochure)', url: 'https://www.faa.gov/pilots/safety/pilotsafetybrochures/media/acceleration.pdf', org: FAA, checked: '2026-11-04' }

topics:
  - id: hpm-l5-g
    title: Перегрузка — определение, виды, влияние на организм
    pages: [e01, e02]
    theory:
      - kind: text
        title: Организм при перегрузке
        body: 'Тело человека — сложная система тканей разной упругости, вязкости и плотности, с полостями, заполненными воздухом и жидкостью. Поэтому перегрузка вызывает разные деформации: одни ткани сжимаются, другие растягиваются, смещаются, скручиваются. При превышении прочности тканей и креплений органов возникает повреждение. Пассажиры лайнера на взлёте испытывают около **1,5g** — возможны лёгкое потемнение в глазах, головокружение, головная боль.'
        src: e01
      - kind: definition
        title: Перегрузка
        body: |
          **Перегрузка** — отношение **силы реакции опоры к весу тела**. Как отношение двух сил это безразмерная величина, но её принято выражать в «единицах g» ($g \approx 9{,}8$ м/с²). Перегрузка увеличивает привычный вес тела при изменении скорости или направления полёта.

          | Ситуация | Перегрузка |
          |---|---|
          | свободное падение (невесомость) | 0g |
          | покой на поверхности Земли | 1g |
          | пассажиры при взлёте | ≈ 1,5g |
          | предел для длительного действия | 8–10g |
        src: e02
        errata: [hpm-e10]
      - kind: list
        title: Виды перегрузок по направлению
        body: |
          - **Положительные** (+g, «голова — ноги»): выход из пикирования, резкий вираж; **кровь отливает от головы** к ногам.
          - **Отрицательные** (−g, «ноги — голова»): ввод в пикирование; **кровь приливает к голове**.
          - Положительные и отрицательные действуют **вдоль оси тела** (±Gz).
          - Перегрузки по оси **«грудь — спина»** (поперечные, ±Gx) возникают при разгоне, торможении, катапультировании.
        src: e01
        errata: [hpm-e09]
      - kind: list
        title: Как положительная перегрузка действует на организм
        body: |
          Тело «весит» в $n$ раз больше: при 9g пилот массой 70 кг ощущает нагрузку как 630 кг. Сердце не успевает поддерживать давление в сосудах мозга.
          - **Тяжесть**: руки и ноги неподъёмны, лицо деформируется.
          - **Нарушения зрения** (гипоксия сетчатки): «серая пелена» (greyout) — пропадает цвет, сужается поле зрения («туннельное зрение»); «чёрная пелена» (blackout) — зрение пропадает, но **сознание ещё сохраняется**.
          - **G-LOC** (G-force induced Loss Of Consciousness) — потеря сознания от кислородного голодания мозга; у неподготовленного человека — при **4–6g**.
          - После G-LOC: дезориентация, кратковременная потеря памяти, мышечные подёргивания.
        src: e02
      - kind: definition
        title: G-LOC и подготовка пилотов
        body: 'G-LOC вызывают чрезмерные и **устойчивые** перегрузки: кровь отливает от мозга, развивается гипоксия мозга. Чаще всего это угрожает пилотам боевых и пилотажных самолётов и космонавтам; G-LOC приводил к катастрофам. Пилотов тренируют на **центрифугах** (до 9g продолжительное время) и используют **противоперегрузочные костюмы**.'
        src: e02
      - kind: note
        title: 'Пояснение: почему темнеет в глазах (расчёт)'
        body: |
          Столб крови между сердцем и глазами — около 30 см. Его гидростатическое давление $\rho g h \approx 1060 \cdot 9{,}8 \cdot 0{,}3 \approx 3100$ Па ≈ **23 мм рт. ст. на каждую единицу перегрузки**. Если у сердца систолическое давление 120 мм рт. ст., то у глаз остаётся примерно $120 - 23\,n$: при $n = 4$ — около 26 мм рт. ст. Этого уже не хватает сетчатке — наступает «чёрная пелена». По брошюре FAA зрение ухудшается последовательно: туннельное зрение → серая пелена → чёрная пелена; при отрицательной перегрузке — «красная пелена» (red-out), и её организм переносит **ещё хуже**. **Расчёт и брошюра FAA не входят в лекцию.**
        src: e02
        fig: hpm-g-blood
        web: [*faag]
    formulas:
      - title: Перегрузка
        tex: 'n = \frac{N}{m g}'
        sym: [n_g, N_r, m_b, g_0]
        src: e02
      - title: Перегрузка при вертикальном ускорении вверх
        tex: 'n = 1 + \frac{a}{g}'
        sym: [n_g, g_0]
        cond: '$a$ — ускорение тела, направленное вверх (например, при выходе из пикирования)'
        src: e02
      - title: «Вес» тела при перегрузке
        tex: 'P = n\, m g'
        sym: [n_g, m_b, g_0]
        src: e02
    examples:
      - title: Сколько «весит» пилот при 9g
        given: 'Масса пилота $m = 70$ кг, перегрузка $n = 9$.'
        steps:
          - '$P = n\,mg = 9 \cdot 70 \cdot 9{,}8 \approx 6170$ Н.'
          - 'Это вес груза массой $9 \cdot 70 = 630$ кг в покое.'
        answer: 'как 630 кг — как сказано в лекции'
        computed: true
        src: e02
    questions:
      - type: single
        cat: theory
        q: Что такое перегрузка?
        opts: ['Отношение силы реакции опоры к весу тела', 'Скорость самолёта', 'Масса тела пилота', 'Давление в кабине']
        ans: a
        hint: Безразмерная величина, выражаемая в «единицах g».
        explain: 'Перегрузка — отношение силы реакции опоры к весу тела в покое.'
        src: e02
      - type: matching
        cat: theory
        q: Сопоставьте ситуацию и величину перегрузки.
        pairs:
          - ['Свободное падение', '0g']
          - ['Покой на Земле', '1g']
          - ['Взлёт лайнера', '≈ 1,5g']
          - ['Предел длительного действия', '8–10g']
        hint: В невесомости опоры нет.
        explain: 'Невесомость — 0g, покой — 1g, взлёт — около 1,5g, предел длительной перегрузки — 8–10g.'
        src: e02
      - type: single
        cat: theory
        q: Куда смещается кровь при положительной перегрузке (+g, «голова — ноги»)?
        opts: ['От головы к ногам', 'От ног к голове', 'Не смещается', 'В лёгкие']
        ans: a
        hint: Так возникает выход из пикирования с потемнением в глазах.
        explain: 'При +g кровь отливает от головы к нижней части тела.'
        src: e01
      - type: sequence
        cat: theory
        q: Расположите последствия нарастающей положительной перегрузки по порядку.
        seq: ['Тяжесть в теле', 'Серая пелена, туннельное зрение', 'Чёрная пелена при сохранённом сознании', 'Потеря сознания (G-LOC)']
        hint: Сознание теряется последним.
        explain: 'Тяжесть → greyout → blackout → G-LOC.'
        src: e02
      - type: single
        cat: theory
        q: Чем «чёрная пелена» (blackout) отличается от G-LOC?
        opts: ['При blackout зрение пропадает, но сознание сохраняется', 'При blackout теряется сознание', 'Это одно и то же', 'Blackout бывает только при отрицательной перегрузке']
        ans: a
        hint: G-LOC — потеря сознания.
        explain: 'Blackout — полная потеря зрения при сохранённом сознании; G-LOC — потеря сознания.'
        src: e02
      - type: numeric
        cat: problem
        q: 'Пилот массой 80 кг выполняет вираж с перегрузкой 5g. Сколько килограммов он «весит» в вираже?'
        num: { value: 400, unit: 'кг', check: '5*80' }
        hint: 'Вес растёт в $n$ раз.'
        explain: '$5 \cdot 80 = 400$ кг.'
        sol: { method: '«Вес» при перегрузке $P = n\,mg$.', steps: ['$n \cdot m = 5 \cdot 80$', '$= 400\ \text{кг}$'], answer: '400 кг' }
        f: [3]
        src: e02
      - type: numeric
        cat: problem
        q: 'Самолёт выходит из пикирования, ускорение пилота направлено вверх и равно $a = 29{,}4$ м/с². Найдите перегрузку ($g = 9{,}8$ м/с²).'
        num: { value: 4, unit: '', check: '1+29.4/9.8' }
        hint: '$n = 1 + a/g$.'
        explain: '$n = 1 + 29{,}4/9{,}8 = 1 + 3 = 4$.'
        sol: { method: 'Перегрузка при вертикальном ускорении.', steps: ['$a/g = 29{,}4/9{,}8 = 3$', '$n = 1 + 3 = 4$'], answer: '4' }
        f: [2]
        src: e02
      - type: single
        cat: theory
        q: При какой перегрузке у неподготовленного человека, по лекции, наступает G-LOC?
        opts: ['Выше 4–6g', 'При 1,5g', 'При 0g', 'Только выше 20g']
        ans: a
        hint: Тренированные пилоты в костюмах выдерживают до 9g.
        explain: 'Потеря сознания у неподготовленного человека наступает при перегрузках выше 4–6g.'
        src: e02
      - type: single
        cat: theory
        q: Как называются перегрузки, действующие по оси «грудь — спина»?
        opts: ['Поперечные (±Gx)', 'Продольные (±Gz)', 'Боковые (±Gy)', 'Отрицательные']
        ans: a
        hint: Продольные — вдоль оси тела.
        explain: 'Перегрузки «грудь — спина» — поперечные (±Gx); вдоль оси «голова — ноги» — продольные (±Gz).'
        src: e01

  - id: hpm-l5-g-tolerance
    title: Переносимость ускорений и как её повысить
    pages: [e02, e03, e04, e05, e06]
    theory:
      - kind: list
        title: Длительные и кратковременные перегрузки
        body: |
          - **Кратковременные** — до 1 с (десятые доли секунды): турбулентность, аварийная посадка, авария автомобиля. При защите выдерживаются большие величины — прямолинейное ускорение до 20g за 0,1–0,2 с.
          - **Длительные** — более 1 с (секунды и минуты): фигуры высшего пилотажа. Предел — **8–10g**.

          Скорость прямолинейного горизонтального полёта на организм **не действует** — действуют **изменения** скорости и направления.
        src: e03
      - kind: list
        title: От чего зависит действие перегрузки
        body: 'Величина, скорость нарастания и направление; продолжительность; площадь воздействия; защита. Важнейшая защита при кратковременных перегрузках — **привязные системы** (плечевые ремни для экипажа). Виды ускорений в авиации: прямолинейные, радиальные, угловые и Кориолиса.'
        src: e03
      - kind: list
        title: Последствия ускорений
        body: |
          - Больше всего смещаются **кровь** (самые слабые внутренние связи) и подвижные органы брюшной полости — поэтому чаще всего нарушается **кровообращение**.
          - Нарушаются психические функции: координация, восприятие, внимание, память, мышление; растёт число ошибок, медленнее чтение приборов и речевая реакция; возможны сенсорные иллюзии.
          - Ощущения: тяжесть, скованность, иногда боли в груди и животе; затем — расстройства зрения.
          - Повторные воздействия дают кумулятивный эффект: усталость, потливость, нарушения сна.
          - Быстро меняющиеся нагрузки у пилотов истребителей вызывают боли в спине и шее.
        src: e04
      - kind: rule
        title: Переносимость
        body: |
          **Переносимое** ускорение не вызывает заметных расстройств или вызывает быстро проходящие. Раньше всего страдает зрение, поэтому **предельно переносимым** считается ускорение, при котором появляется **серая пелена**.

          - Чем короче действие, тем легче переносится.
          - Лётчик, управляющий самолётом, переносит ускорение лучше пассажира — он готов к нему.
          - Отрицательные перегрузки (кровь к голове) переносятся значительно **хуже** положительных; перпендикулярно оси тела — лучше.
          - Устойчивость **снижают**: кислородное голодание, перегрев, болезнь, переутомление, алкоголь, курение, перерывы в лётной работе, переживания.
        src: e05
        errata: [hpm-e11]
      - kind: rule
        title: Как повысить устойчивость к ускорениям
        body: |
          **Общие меры:** режим труда, отдыха и питания; не летать больным, переутомлённым, после недосыпания и алкоголя; исправное кислородное оборудование и подогнанное высотное снаряжение; нормальная температура в кабине (при перегреве сосуды расширяются и давление падает сильнее); **не летать натощак и сразу после обильной еды** — при соблюдении режима питания устойчивость растёт на 1,5–2g.

          **Физическая подготовка:** тренировка сердечно-сосудистой системы, мышц пресса и ног; лёгкая атлетика, игры, снарядовая гимнастика (вращающиеся качели, батут, турник), лыжи, коньки, плавание; умение перестраивать дыхание с брюшного на грудное.

          **Лётная тренировка** — самый действенный фактор: постепенное увеличение перегрузок; вырабатываются условные рефлексы, и компенсаторные механизмы включаются ещё до начала перегрузки.

          **Технические средства:** противоперегрузочные костюмы, кресла с изменяемым наклоном спинки.
        src: e06
    questions:
      - type: single
        cat: theory
        q: Какое ускорение считается предельно переносимым?
        opts: ['При котором появляется серая пелена перед глазами', 'При котором наступает потеря сознания', 'Любое выше 1g', 'При котором ломаются кости']
        ans: a
        hint: Раньше всего страдает зрение.
        explain: 'Предельно переносимым считается ускорение, при котором у лётчика появляется серая пелена.'
        src: e05
      - type: single
        cat: theory
        q: Какой фактор лекция называет самым действенным для повышения устойчивости к ускорениям?
        opts: ['Систематическая лётная тренировка', 'Приём витаминов', 'Сауна', 'Сон в кабине']
        ans: a
        hint: Вырабатываются условные рефлексы.
        explain: 'Систематическая лётная тренировка с постепенным ростом перегрузок — наиболее действенный фактор.'
        src: e06
      - type: single
        cat: theory
        q: Почему управляющий самолётом лётчик переносит ускорение лучше, чем пассажир?
        opts: ['Он готов к воздействию, приспособительные реакции включаются быстрее', 'У него другое давление крови', 'Он сидит ближе к центру тяжести', 'Пассажир весит больше']
        ans: a
        hint: Важна нервно-психическая готовность.
        explain: 'Пилотирующий лётчик ждёт ускорения — компенсаторные реакции срабатывают быстрее и полнее.'
        src: e05
      - type: multiple
        cat: theory
        q: Что снижает устойчивость организма к ускорениям?
        opts: ['Кислородное голодание', 'Перегревание', 'Алкоголь и усиленное курение', 'Регулярная физическая подготовка']
        ans: [a, b, c]
        hint: Физподготовка, наоборот, повышает устойчивость.
        explain: 'Устойчивость снижают гипоксия, перегрев, болезнь, переутомление, алкоголь, курение, перерывы в полётах, переживания.'
        src: e05
      - type: single
        cat: theory
        q: Какая часть тела больше всего смещается при ускорениях?
        opts: ['Кровь', 'Кости', 'Хрящи', 'Зубы']
        ans: a
        hint: У неё самые слабые внутренние связи.
        explain: 'Наибольшему инерционному смещению подвержена кровь — поэтому чаще всего страдает кровообращение.'
        src: e04
      - type: matching
        cat: theory
        q: Сопоставьте вид перегрузки и её продолжительность.
        pairs:
          - ['Кратковременная', 'До 1 секунды']
          - ['Длительная', 'Более 1 секунды — секунды и минуты']
        hint: Граница — одна секунда.
        explain: 'Ускорение до 1 с условно называют кратковременным, более 1 с — длительным.'
        src: e04
      - type: single
        cat: theory
        q: Почему нельзя летать на пилотаж натощак или сразу после обильной еды?
        opts: ['Ухудшается переносимость ускорений; при режиме питания устойчивость выше на 1,5–2g', 'Это влияет только на зрение', 'Еда защищает от перегрузок', 'Это не влияет']
        ans: a
        hint: Цифра из лекции — 1,5–2g.
        explain: 'При соблюдении режима питания устойчивость к ускорениям повышается на 1,5–2g.'
        src: e06
      - type: single
        cat: theory
        q: Что является важнейшей защитой при кратковременных перегрузках (например, при аварийной посадке)?
        opts: ['Привязные системы с плечевыми ремнями', 'Солнцезащитные очки', 'Кислородная маска', 'Наушники']
        ans: a
        hint: Удерживают тело в кресле.
        explain: 'Важнейший фактор защиты при кратковременных перегрузках — привязные системы.'
        src: e04

  - id: hpm-l5-fatigue
    title: Утомление, переутомление и хроническое утомление
    pages: [e06, e07, e08, e09]
    theory:
      - kind: definition
        title: Утомление
        body: '**Утомление** — нормальное физиологическое состояние, возникающее при умственной и физической работе; проявляется снижением работоспособности и изменением физиологических показателей. У пилотов возникает **смешанное утомление с преобладанием умственного**. Признаки лётного утомления: снижение резервных возможностей, рост вероятности непредвиденной ошибки при знакомом задании.'
        src: e07
      - kind: list
        title: Признаки утомления
        body: |
          | Объективные | Субъективные |
          |---|---|
          | притупление чувства осторожности | общая усталость, снижение мышечного тонуса |
          | снижение производительности | локальная усталость (например, в руках или ногах) |
          | нарушения восприятия, «ускользание» внимания | желание замедлить ритм или прекратить работу |
          | учащение пульса и поверхностное частое дыхание | слабость и лёгкий тремор в конечностях |
          | рост давления, изменение моторики | |
        src: e07
      - kind: definition
        title: Переутомление
        body: |
          **Переутомление** возникает, когда **остаточные явления утомления** предыдущего дня сохраняются — организм после напряжённой работы не получил надлежащего отдыха. Тяжёлую степень диагностируют как истощение нервной системы («невроз истощения»).

          **Субъективные признаки:** дискомфорт, головные боли, напряжённость в конечностях, плохая концентрация, боли в области сердца, тревога, апатия, нарушение аппетита, раздражительность, безразличие, заторможенность, расстройства сна.

          **Объективные признаки:** тахикардия, изменения давления, ступор, изменения на ЭКГ, нарушения ритма, учащённое дыхание.
        src: e07
        errata: [hpm-e12]
      - kind: definition
        title: Хроническое утомление
        body: '**Хроническое утомление** возникает, если причины утомления не устраняются; это пограничное с патологией и неврозами состояние. Человек уже **приступает к работе уставшим**, работоспособность резко снижена с начала дня. Симптомы: постоянная слабость, головные боли, дрожь в руках, слабость мышц, нарушения сна, плаксивость, раздражительность, тревожность, апатия, снижение мотивации, эмоциональное истощение, повышенная восприимчивость к стрессу.'
        src: e08
      - kind: rule
        title: Профилактика и восстановление
        body: |
          **Профилактика утомления:** рациональный режим труда, отдыха и питания; физическая подготовка; повышение профессионального мастерства; кислород в длительных полётах; витаминизация пищи.

          **Восстановление работоспособности:** аутотренинг, дыхательные упражнения, сауна, самомассаж биологически активных точек, релаксационные упражнения.
        src: e09
