# Основы — НЕ из лекций. Две короткие вводные темы для начинающих: без них трудно понять баротравмы,
# высотный метеоризм, гипоксию и декомпрессионную болезнь (лекции 1, 3, 4). У всех записей — источники
# из интернета; вопросы составлены («сгенерировано»). Числа давления посчитаны по модели стандартной атмосферы NASA.
subsection: hpm-s0

refs:
  - &nasa { title: 'Earth Atmosphere Model — Metric Units', url: 'https://www.grc.nasa.gov/www/k-12/airplane/atmosmet.html', org: NASA Glenn Research Center, checked: '2026-11-04' }
  - &faa { title: 'AC 61-107B CHG 1. Aircraft Operations at Altitudes Above 25,000 Feet MSL', url: 'https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_61-107B_CHG_1.pdf', org: FAA, checked: '2026-11-04' }

topics:
  - id: hpm-intro-pressure
    title: Атмосферное давление и высота
    pages: [c01]
    web: [*nasa, *faa]
    theory:
      - kind: text
        title: Зачем эта тема?
        body: 'Почти все «высотные» состояния из лекций — гипоксия, высотный метеоризм, баротравма уха и лёгких, декомпрессионная болезнь — вызваны одним: **с высотой падает давление воздуха**. Эта тема — короткое введение для начинающих. **Её нет в лекциях курса**, она добавлена, чтобы дальше было легче.'
        src: c01
      - kind: definition
        title: Атмосферное давление и единицы
        body: |
          **Атмосферное (барометрическое) давление** — давление, с которым воздух давит на поверхность. На уровне моря в стандартной атмосфере оно равно **1013 гПа = 760 мм рт. ст.**

          | Единица | Как перевести |
          |---|---|
          | гектопаскаль (гПа) | 1 гПа = 100 Па |
          | миллиметр ртутного столба (мм рт. ст.) | 1 мм рт. ст. ≈ 1,333 гПа |
          | фут (ft) — единица высоты в авиации | 1 фут = 0,3048 м; 1000 футов ≈ 305 м |
        src: c01
      - kind: law
        title: Как давление меняется с высотой
        body: |
          Чем выше, тем меньше воздуха над нами — давление падает, сначала быстро, потом медленнее (значения стандартной атмосферы):

          - **0 м** — 1013 гПа (760 мм рт. ст.) — уровень моря.
          - **1500 м** (5000 футов) — 846 гПа (635 мм рт. ст.) — порог появления признаков гипоксии (лекция 3).
          - **2440 м** (8000 футов) — 753 гПа (565 мм рт. ст.) — наибольшая «высота в салоне» лайнера.
          - **3000 м** (10 000 футов) — 702 гПа (527 мм рт. ст.) — граница полётов без кислорода.
          - **5500 м** (18 000 футов) — 506 гПа (380 мм рт. ст.) — давление вдвое меньше, чем у земли.
          - **10 000 м** (33 000 футов) — 265 гПа (199 мм рт. ст.) — крейсерская высота лайнера.

          **Запомните:** на высоте около 5,5 км давление вдвое меньше, чем у земли.
        src: c01
    questions:
      - type: single
        cat: theory
        q: Чему равно стандартное атмосферное давление на уровне моря?
        opts: ['1013 гПа = 760 мм рт. ст.', '760 гПа = 1013 мм рт. ст.', '506 гПа = 380 мм рт. ст.', '100 гПа = 75 мм рт. ст.']
        ans: a
        hint: В миллиметрах ртутного столба — 760.
        explain: 'На уровне моря стандартное давление — 1013 гПа, или 760 мм рт. ст.'
        src: c01
      - type: single
        cat: theory
        q: На какой высоте давление воздуха примерно вдвое меньше, чем у земли?
        opts: ['Около 5,5 км (18 000 футов)', 'Около 1 км', 'Около 2,4 км (8000 футов)', 'Около 30 км']
        ans: a
        hint: Это граница, после которой в лекции 4 говорят о риске декомпрессионной болезни.
        explain: 'По стандартной атмосфере на 5500 м давление ≈ 506 гПа — половина от 1013 гПа.'
        src: c01
      - type: numeric
        cat: formula
        q: 'Переведите высоту 10 000 футов в метры (1 фут = 0,3048 м).'
        num: { value: 3048, unit: 'м', check: '10000*0.3048' }
        hint: Умножьте число футов на 0,3048.
        explain: '10 000 × 0,3048 = 3048 м — примерно 3000 м.'
        sol: { method: 'Перевод футов в метры.', steps: ['$h = 10\,000 \cdot 0{,}3048$', '$h = 3048\ \text{м}$'], answer: '3048 м' }
        src: c01
      - type: numeric
        cat: formula
        q: 'Переведите 760 мм рт. ст. в гектопаскали (1 мм рт. ст. ≈ 1,333 гПа). Ответ округлите до целого.'
        num: { value: 1013, unit: 'гПа', check: '760*1.333', tolAbs: 1 }
        hint: Умножьте на 1,333.
        explain: '760 × 1,333 ≈ 1013 гПа — стандартное давление на уровне моря.'
        sol: { method: 'Перевод единиц давления.', steps: ['$p = 760 \cdot 1{,}333$', '$p \approx 1013\ \text{гПа}$'], answer: '≈ 1013 гПа' }
        src: c01
      - type: sequence
        cat: theory
        q: Расположите высоты по убыванию атмосферного давления (от большего к меньшему).
        seq: ['Уровень моря', '1500 м', '3000 м', '5500 м', '10 000 м']
        hint: Чем выше — тем меньше давление.
        explain: 'Давление падает с высотой: 1013 → 846 → 702 → 506 → 265 гПа.'
        src: c01

  - id: hpm-intro-gaslaws
    title: Газовые законы в авиационной медицине
    pages: [a04, c01, d05]
    web: [*faa]
    theory:
      - kind: text
        title: Три закона — три группы проблем
        body: |
          Поведение газов в организме при подъёме на высоту описывают три закона. **Это добавлено для начинающих и не входит в лекции.**

          - **Бойля — Мариотта** (объём газа и давление) — высотный метеоризм, баротравма уха и лёгких (лекции 1, 2).
          - **Дальтона** (парциальное давление) — гипоксия на высоте (лекция 3).
          - **Генри** (растворение газа в жидкости) — декомпрессионная болезнь (лекция 4).
        src: a04
      - kind: law
        title: Закон Бойля — Мариотта
        body: 'При постоянной температуре **объём газа обратно пропорционален давлению**: $p_1V_1 = p_2V_2$. При подъёме давление падает — газ в желудке, кишечнике, среднем ухе, пазухах и лёгких **расширяется**; при снижении — сжимается. Если газ не может выйти, он растягивает полость: отсюда боли при высотном метеоризме и баротравмы.'
        src: a04
        fig: hpm-boyle
      - kind: law
        title: Закон Дальтона
        body: 'Давление смеси газов равно **сумме парциальных давлений** её газов. Доля кислорода в воздухе почти не меняется с высотой (≈ 21%), поэтому $p_{O_2} \approx 0{,}21\,p$: при падении общего давления падает и парциальное давление кислорода. На уровне моря $p_{O_2} \approx 0{,}21 \cdot 760 \approx 160$ мм рт. ст., на 3000 м — около 110 мм рт. ст.'
        src: c01
      - kind: law
        title: Закон Генри
        body: 'Количество газа, растворённого в жидкости, **пропорционально давлению этого газа** над жидкостью. Когда давление падает быстро, растворённый в крови и тканях азот выходит из раствора и образует пузырьки — как газ в только что открытой бутылке газировки. Это основа декомпрессионной болезни.'
        src: d05
    formulas:
      - title: Закон Бойля — Мариотта
        tex: 'p_1 V_1 = p_2 V_2'
        sym: [p_atm, V_gas]
        cond: 'температура постоянна, газ не выходит из полости'
        src: a04
      - title: Парциальное давление кислорода (закон Дальтона)
        tex: 'p_{O_2} \approx 0{,}21\, p'
        sym: [p_O2, p_atm]
        src: c01
    examples:
      - title: Во сколько раз расширится газ в желудке при подъёме на 5500 м
        given: 'У земли давление $p_1 = 1013$ гПа, на высоте 5500 м $p_2 = 506$ гПа. Объём газа у земли $V_1 = 1$ л.'
        steps:
          - 'По закону Бойля — Мариотта $V_2 = V_1 \cdot \dfrac{p_1}{p_2}$.'
          - '$V_2 = 1 \cdot \dfrac{1013}{506} \approx 2{,}0$ л.'
        answer: 'газ займёт около 2 л — вдвое больше'
        computed: true
        src: a04
      - title: Парциальное давление кислорода на 3000 м
        given: 'Давление на 3000 м $p \approx 527$ мм рт. ст., доля кислорода 21%.'
        steps:
          - '$p_{O_2} \approx 0{,}21 \cdot 527$.'
          - '$p_{O_2} \approx 111$ мм рт. ст. — в 1,4 раза меньше, чем у земли (≈ 160).'
        answer: '≈ 110 мм рт. ст.'
        computed: true
        src: c01
    questions:
      - type: matching
        cat: theory
        q: Сопоставьте газовый закон и явление, которое он объясняет.
        pairs:
          - ['Закон Бойля — Мариотта', 'Высотный метеоризм и баротравма уха']
          - ['Закон Дальтона', 'Гипоксия на высоте']
          - ['Закон Генри', 'Декомпрессионная болезнь']
        hint: Объём — парциальное давление — растворение газа.
        explain: 'Расширение газа в полостях — Бойль; падение парциального давления кислорода — Дальтон; выход растворённого азота — Генри.'
        src: a04
      - type: numeric
        cat: problem
        q: 'В кишечнике у земли (1013 гПа) находится 0,5 л газа. Каким станет его объём в салоне на «высоте» 2440 м (753 гПа)? Ответ — в литрах, с двумя знаками.'
        num: { value: 0.67, unit: 'л', check: '0.5*1013/753', tolAbs: 0.01 }
        hint: '$V_2 = V_1 \cdot p_1 / p_2$.'
        explain: '$V_2 = 0{,}5 \cdot 1013/753 \approx 0{,}67$ л — на треть больше.'
        sol: { method: 'Закон Бойля — Мариотта.', steps: ['$V_2 = V_1 \dfrac{p_1}{p_2}$', '$V_2 = 0{,}5 \cdot \dfrac{1013}{753} \approx 0{,}67\ \text{л}$'], answer: '≈ 0,67 л' }
        f: [1]
        src: a04
      - type: numeric
        cat: problem
        q: 'Давление на высоте 10 000 м — около 199 мм рт. ст. Найдите парциальное давление кислорода (доля 0,21). Ответ округлите до целого.'
        num: { value: 42, unit: 'мм рт. ст.', check: '0.21*199', tolAbs: 0.5 }
        hint: '$p_{O_2} \approx 0{,}21\,p$.'
        explain: '$0{,}21 \cdot 199 \approx 42$ мм рт. ст. — почти вчетверо меньше, чем у земли.'
        sol: { method: 'Закон Дальтона.', steps: ['$p_{O_2} = 0{,}21 \cdot 199$', '$p_{O_2} \approx 42\ \text{мм рт. ст.}$'], answer: '≈ 42 мм рт. ст.' }
        f: [2]
        src: c01
      - type: single
        cat: theory
        q: Что происходит с долей кислорода в воздухе (около 21%) при подъёме до 10 км?
        opts: ['Почти не меняется — падает парциальное давление кислорода', 'Падает до 5%', 'Растёт, потому что воздух холоднее', 'Падает вдвое на каждом километре']
        ans: a
        hint: Об этом сказано и в лекции 3.
        explain: 'Состав воздуха до ~100 км почти постоянен; кислорода «мало» потому, что мало общее давление.'
        src: c01
      - type: single
        cat: theory
        q: Почему газы в замкнутых полостях тела расширяются при наборе высоты?
        opts: ['Потому что падает внешнее давление (закон Бойля — Мариотта)', 'Потому что растёт температура в салоне', 'Потому что растёт доля кислорода', 'Потому что газ растворяется в крови']
        ans: a
        hint: Объём обратно пропорционален давлению.
        explain: 'При постоянной температуре $pV = \text{const}$: давление меньше — объём больше.'
        src: a04
      - type: single
        cat: theory
        q: Какой закон лежит в основе декомпрессионной болезни?
        opts: ['Закон Генри', 'Закон Бойля — Мариотта', 'Закон Ома', 'Закон Дальтона']
        ans: a
        hint: Речь о растворении газа в жидкости.
        explain: 'Растворимость газа пропорциональна давлению (закон Генри): при быстром падении давления азот выходит из раствора пузырьками.'
        src: d05
