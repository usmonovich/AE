# Лекция 4. Декомпрессионная болезнь. Воздушная болезнь (укачивание). Высотная болезнь. Профилактика
# (страницы d01–d08). Текст о причинах укачивания в лекции повторяется дважды (d01–d03) — объединён.
subsection: hpm-l4

