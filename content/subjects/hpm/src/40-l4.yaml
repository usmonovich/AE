topics:
  - id: hpm-l4-vestibular
    title: Вестибулярный аппарат и причины укачивания
    pages: [d01, d02, d03]
    theory:
      - kind: definition
        title: Вестибулярный аппарат
        body: |
          **Вестибулярный аппарат** воспринимает изменения положения головы и тела в пространстве и направление движения. Это часть внутреннего уха; вместе с улиткой он заключён в костный лабиринт височной кости.

          **Преддверие и полукружные каналы** — органы чувства равновесия. Три полукружных канала расположены в **трёх взаимно перпендикулярных плоскостях** и заполнены жидкостью; внутри — чувствительные волоски. При движении головы жидкость смещается, давит на волоски, и по вестибулярному нерву в мозг идёт сигнал об изменении положения тела.

          Вестибулярный анализатор воспринимает силу тяжести, положение тела и характер движения (ускорение, замедление, вращение).
        src: d01
      - kind: definition
        title: Синдром укачивания (кинетоз)
        body: |
          **Синдром укачивания** (кинетоз; морская, воздушная, транспортная болезнь; motion sickness) — реакция на непривычное движение или меняющееся ускорение. Проявляется тошнотой и/или рвотой, усталостью, сонливостью, холодным потом, бледностью.

          Это **нормальная реакция** на реальные или виртуальные двигательные раздражители, она возникает в основном у людей **со здоровой** вестибулярной системой.
        src: d01
      - kind: law
        title: Главная причина — сенсорный конфликт
        body: 'В салоне глаза видят неподвижную картину, а вестибулярный аппарат ощущает колебания, ускорения и покачивание. Мозг получает **противоречивые сигналы** от вестибулярного аппарата, глаз и рецепторов мышц и суставов — и отвечает тошнотой.'
        src: d01
      - kind: list
        title: Кто и когда укачивается сильнее
        body: |
          - **Дети 2–12 лет** — наиболее подвержены; у взрослых старше 65 лет — редко.
          - **Женщины** — чаще мужчин (гормональные особенности, мигрени); симптомы усиливаются при беременности и менструации.
          - Люди с мигренью, головокружениями, болезнью Меньера; с болезнями ЖКТ, ЦНС, глаз (косоглазие, астигматизм), отитами, шейным остеохондрозом.
        src: d01
      - kind: list
        title: Провоцирующие факторы
        body: |
          - Турбулентность, «воздушные ямы», болтанка.
          - **Место в хвосте** — там амплитуда колебаний выше; меньше укачивает впереди и над крылом.
          - Чтение книги или экрана телефона в полёте.
          - Духота, нехватка свежего воздуха, резкие запахи.
          - Тяжёлая жирная пища, алкоголь, газированные напитки перед полётом — или полёт на совсем пустой желудок.
          - Страх полёта, стресс, тревожность, усталость.
          - Небольшое снижение кислорода и давления в салоне.

          Пассажирам для профилактики используют безрецептурные средства (например, драмина за 30–40 мин до взлёта) и выбирают места в центре или у крыла.
        src: d02
    questions:
      - type: single
        cat: theory
        q: Какова главная причина воздушной болезни (кинетоза)?
        opts: ['Сенсорный конфликт между вестибулярным аппаратом, зрением и рецепторами тела', 'Недостаток кислорода', 'Шум двигателей', 'Перегрев салона']
        ans: a
        hint: Глаза видят одно, внутреннее ухо чувствует другое.
        explain: 'Мозг получает противоречивые сигналы от вестибулярного аппарата, глаз и рецепторов мышц — возникает тошнота.'
        src: d01
      - type: single
        cat: theory
        q: В каких плоскостях расположены полукружные каналы?
        opts: ['В трёх взаимно перпендикулярных плоскостях', 'В одной горизонтальной плоскости', 'В двух параллельных плоскостях', 'Они не имеют определённой ориентации']
        ans: a
        hint: Чтобы чувствовать вращение вокруг любой оси.
        explain: 'Три канала в трёх взаимно перпендикулярных плоскостях позволяют воспринимать вращение в любом направлении.'
        src: d01
      - type: single
        cat: theory
        q: Какая возрастная группа наиболее подвержена укачиванию?
        opts: ['Дети 2–12 лет', 'Взрослые старше 65 лет', 'Новорождённые', 'Все одинаково']
        ans: a
        hint: Нервная система ещё формируется.
        explain: 'Сильнее всего укачивает детей 2–12 лет; у взрослых старше 65 лет симптомы редки.'
        src: d02
      - type: single
        cat: theory
        q: В какой части самолёта укачивает сильнее всего?
        opts: ['В хвостовой', 'Над крылом', 'В центре салона', 'В кабине экипажа']
        ans: a
        hint: Там амплитуда колебаний наибольшая.
        explain: 'В хвостовой части амплитуда колебаний значительно выше, чем впереди или над крыльями.'
        src: d02
      - type: multiple
        cat: theory
        q: Что провоцирует укачивание в полёте?
        opts: ['Чтение книги или экрана телефона', 'Духота и резкие запахи', 'Жирная пища и алкоголь перед полётом', 'Взгляд на линию горизонта']
        ans: [a, b, c]
        hint: Взгляд на горизонт, наоборот, помогает.
        explain: 'Чтение, духота, запахи, тяжёлая пища, алкоголь, стресс усиливают конфликт ощущений; взгляд на горизонт его уменьшает.'
        src: d02
      - type: single
        cat: theory
        q: Является ли укачивание признаком болезни вестибулярного аппарата?
        opts: ['Нет, это нормальная реакция, обычно у людей со здоровой вестибулярной системой', 'Да, всегда', 'Только у пилотов', 'Только у детей']
        ans: a
        hint: Лекция называет его нормальной реакцией на раздражители.
        explain: 'Укачивание — нормальная реакция организма на непривычное движение; возникает в основном при здоровой вестибулярной системе.'
        src: d01

  - id: hpm-l4-airsickness
    title: Воздушная болезнь — формы и профилактика
    pages: [d03, d04]
    theory:
      - kind: definition
        title: Воздушная болезнь
        body: '**Воздушная болезнь (укачивание)** — патологическое состояние при длительном разнонаправленном перемещении тела в пространстве (болтанка, качка). Лётный состав редко страдает выраженным укачиванием, но **скрытая форма** ухудшает работоспособность и снижает безопасность полёта. Разновидности кинетоза: морская, автомобильная, вагонная, воздушная, космическая болезни, болезнь лифта, качелей, аттракционов.'
        src: d03
      - kind: list
        title: Степени тяжести кинетоза
        body: |
          - **Лёгкое** — похоже на усталость: вялость, сонливость, зевота, бледность или покраснение лица, холодный пот, слюнотечение
          - **Выраженное** — одышка, тошнота, метеоризм, многократная рвота с кратким облегчением, извращение вкуса, озноб или жар, головная боль, шум в ушах, тревога
          - **Тяжёлое** — нарушения сердечного ритма, дезориентация, обморочное состояние
        src: d03
      - kind: list
        title: Клинические формы
        body: |
          **Скрытая форма** — меняются только высшая нервная деятельность и работоспособность (хуже анализ приборной информации), вегетативные функции почти не меняются.

          **Выраженные формы:**
          - **неврологическая** — головокружение, нарушение координации, головная боль, вялость, сонливость, предобморочное состояние;
          - **желудочно-кишечная** — тошнота, рвота, потеря аппетита, извращение вкуса (привкус соли, металла), обострение обоняния;
          - **сердечно-сосудистая** — сначала тахикардия и рост давления, затем пульс замедляется, дыхание редкое и поверхностное, давление падает; опасна для людей с болезнями сердца;
          - **смешанная** — сочетание форм; встречается **чаще всего**.
        src: d03
      - kind: rule
        title: Профилактика воздушной болезни
        body: |
          **Для лётного состава:** медицинский отбор статокинетически устойчивых лиц при приёме в лётное училище; активные, пассивные и комбинированные тренировки; психопрофилактика, аутогенная тренировка. Лекарства против укачивания — **только пассажирам**; пилотам возможен витаминный препарат «Аэровит». Не есть обильную и жирную пищу; есть **не позже чем за 1,5–2 ч** до вылета; достаточный сон.

          **Для пассажиров:** ограничить движения головой; при первых признаках — закрыть глаза или смотреть на горизонт (видимую землю); откинуться назад; пересесть ближе к центру самолёта; струя воздуха на лицо; кислород; отвлекающие средства (лимон, леденцы).
        src: d04
    questions:
      - type: single
        cat: theory
        q: Почему скрытая форма воздушной болезни опасна для лётного состава?
        opts: ['Ухудшает работоспособность и анализ приборной информации без явных симптомов', 'Вызывает сильную рвоту', 'Приводит к баротравме', 'Она не опасна']
        ans: a
        hint: Вегетативные функции почти не меняются.
        explain: 'При скрытой форме снижается способность анализировать приборную индикацию — это снижает безопасность.'
        src: d03
      - type: single
        cat: theory
        q: Какая форма укачивания встречается чаще всего?
        opts: ['Смешанная', 'Неврологическая', 'Желудочно-кишечная', 'Сердечно-сосудистая']
        ans: a
        hint: Сочетание нескольких форм.
        explain: 'Смешанная форма — сочетание остальных — встречается наиболее часто.'
        src: d04
      - type: matching
        cat: theory
        q: Сопоставьте форму укачивания и её проявление.
        pairs:
          - ['Неврологическая', 'Головокружение, нарушение координации']
          - ['Желудочно-кишечная', 'Тошнота, рвота, извращение вкуса']
          - ['Сердечно-сосудистая', 'Тахикардия, затем падение давления']
        hint: По системе органов.
        explain: 'Неврологическая — головокружение и координация; ЖКТ — тошнота, рвота; ССС — пульс и давление.'
        src: d04
      - type: single
        cat: theory
        q: Кому, по лекции, можно применять фармакологические средства против укачивания?
        opts: ['Только пассажирам', 'Только пилотам', 'Всем членам экипажа', 'Никому']
        ans: a
        hint: Лекарства могут снижать внимание пилота.
        explain: 'Фармакологические средства — только пассажирам; пилотам возможен «Аэровит».'
        src: d04
      - type: single
        cat: theory
        q: За сколько часов до вылета лётному составу следует закончить приём пищи?
        opts: ['Не позже чем за 1,5–2 ч', 'Непосредственно перед вылетом', 'За 10 минут', 'За сутки']
        ans: a
        hint: Обильная еда перед полётом вредна.
        explain: 'Пищу следует принимать не позже чем за 1,5–2 ч до вылета, избегая обильной и жирной.'
        src: d04
      - type: multiple
        cat: theory
        q: Что помогает пассажиру при первых признаках воздушной болезни?
        opts: ['Смотреть на линию горизонта или закрыть глаза', 'Пересесть ближе к центру самолёта', 'Направить струю воздуха на лицо', 'Читать книгу']
        ans: [a, b, c]
        hint: Чтение усиливает сенсорный конфликт.
        explain: 'Ограничить движения головы, смотреть на горизонт или закрыть глаза, пересесть к центру, свежий воздух, кислород.'
        src: d04
      - type: sequence
        cat: theory
        q: Расположите течения кинетоза от лёгкого к тяжёлому.
        seq: ['Вялость, зевота, холодный пот', 'Тошнота, многократная рвота, головная боль', 'Нарушения ритма, дезориентация, обморок']
        hint: Тяжёлое — с нарушениями ритма сердца.
        explain: 'Лёгкое — как усталость; выраженное — тошнота и рвота; тяжёлое — аритмия, дезориентация, обморок.'
        src: d03

  - id: hpm-l4-altitude
    title: Высотная болезнь
    pages: [d04, d05]
    theory:
      - kind: definition
        title: Высотная болезнь
        body: |
          **Высотная болезнь** — патологическое состояние при дыхании воздухом с **пониженным парциальным давлением кислорода**: снижается и теряется работоспособность. Пониженное давление кислорода — профессиональное условие лётного состава; при **разгерметизации кабины** оно резко падает и вызывает острую кислородную недостаточность.

          Признаки очень индивидуальны: тошнота, рвота, тяжесть в голове, головная боль, слабость, вялость, сонливость; иногда сначала — **эйфория**. При кратковременной гипоксии на 5000–6000 м возможны симптомы, похожие на алкогольное опьянение. Самая частая жалоба — **головокружение**. Главное — нарушается критическая оценка собственного состояния и обстановки.
        src: d05
      - kind: list
        title: Стадии и высотный обморок
        body: |
          Три стадии: **эйфорическая → тормозная → обморочная**.

          **Высотный обморок** — самое опасное осложнение, особенно при внезапной разгерметизации. Главное проявление — **сердечно-сосудистый коллапс**: давление падает (иногда до неопределяемого), развивается брадикардия.

          Чувствительность разная: у одних симптомы уже на 1200–1500 м, у других нет симптомов и выше 4000 м.
        src: d05
      - kind: rule
        title: Профилактика и лечение
        body: |
          а) **Дыхание кислородом**: члены экипажа в полётах 4 ч и более каждые 2 ч дышат чистым кислородом 10 мин и за 15 мин до снижения на посадку.

          б) Повышение высотной устойчивости: физическая подготовка, туризм, альпинизм, отпуск в горах.

          в) Витамины группы B, C и поливитаминный препарат «Аэровит» в рационе.

          г) **Герметизация кабин** воздушных судов.
        src: d05
    questions:
      - type: sequence
        cat: theory
        q: Расположите стадии высотной болезни по порядку.
        seq: ['Эйфорическая', 'Тормозная', 'Обморочная']
        hint: Сначала — «весело».
        explain: 'Стадии: эйфорическая → тормозная → обморочная.'
        src: d05
      - type: single
        cat: theory
        q: Что является главным проявлением высотного обморока?
        opts: ['Сердечно-сосудистый коллапс с падением давления и брадикардией', 'Сильная тахикардия и рост давления', 'Боль в суставах', 'Кожный зуд']
        ans: a
        hint: Тахикардия при нём редка.
        explain: 'Высотный обморок — коллапс: давление падает, развивается брадикардия.'
        src: d05
      - type: single
        cat: theory
        q: Чем вызвана высотная болезнь?
        opts: ['Дыханием воздухом с пониженным парциальным давлением кислорода', 'Образованием пузырьков азота', 'Сенсорным конфликтом', 'Перегрузками']
        ans: a
        hint: Это форма гипоксии.
        explain: 'Высотная болезнь возникает при дыхании воздухом с пониженным парциальным давлением кислорода.'
        src: d04
      - type: single
        cat: theory
        q: Как часто экипажи в полётах 4 ч и более дышат чистым кислородом (по лекции)?
        opts: ['Каждые 2 ч по 10 мин и за 15 мин до снижения', 'Каждые 15 минут', 'Только после посадки', 'Один раз перед взлётом']
        ans: a
        hint: 'Два числа: 2 ч и 10 мин.'
        explain: 'Каждые 2 ч — 10 мин чистого кислорода, а также за 15 мин до снижения для посадки.'
        src: d05
      - type: multiple
        cat: theory
        q: Что входит в профилактику высотной болезни?
        opts: ['Дыхание кислородом', 'Герметизация кабин', 'Физическая подготовка, отпуск в горах', 'Курение перед полётом']
        ans: [a, b, c]
        hint: Курение снижает переносимость высоты.
        explain: 'Кислород, повышение высотной устойчивости, витамины, герметизация кабин.'
        src: d05
      - type: single
        cat: theory
        q: Какая жалоба при высотной болезни самая распространённая?
        opts: ['Головокружение', 'Боль в колене', 'Зуд кожи', 'Кровь из уха']
        ans: a
        hint: Связано с нервной системой.
        explain: 'Самая распространённая жалоба — головокружение.'
        src: d05

  - id: hpm-l4-dcs
    title: Высотная декомпрессионная болезнь
    pages: [d05, d06, d07, d08]
    theory:
      - kind: definition
        title: Декомпрессионная болезнь
        body: |
          **Высотная декомпрессионная болезнь (ВДБ)** — состояние, при котором при быстрой декомпрессии в жидкостях и тканях организма образуются **газовые пузырьки**. Возникает при разгерметизации кабины на высоте **7000–8000 м и более** или при «подъёмах» в барокамере.

          Главная причина — **быстрое снижение внешнего давления**. В основе — **закон Генри**: растворимость газа в жидкости прямо пропорциональна внешнему давлению.
        src: d05
      - kind: list
        title: Механизм
        body: |
          1. **Насыщение газами** при повышенном давлении (глубокое погружение, кессон): азот растворяется в крови и тканях.
          2. **Резкий сброс давления** — лёгкие не успевают вывести газ.
          3. **Образование пузырьков** — азот переходит в газ, как в открытой бутылке газировки.
          4. **Блокада кровотока** — пузырьки сливаются, повреждают сосуды, вызывают эмболию, гипоксию и разрушение тканей.

          Для активного образования пузырьков нужны **газовые зародыши**; пузырьки бывают внутри сосудов, в тканях и вне сосудов, давят на ткани и вызывают боль.
        src: d06
      - kind: list
        title: Факторы риска
        body: |
          - Нарушение режима декомпрессии при всплытии, слишком быстрый подъём (более 18 м/мин).
          - Глубина и время погружения (риск заметно растёт глубже 10–12 м).
          - **Полёт после погружения** — давление в салоне ниже наземного, остаточный азот «вспенивается».
          - Обезвоживание; **избыточный вес** (азот хорошо растворяется в жире и медленно выводится); переохлаждение, утомление.
          - Внезапная разгерметизация кабины на большой высоте.

          Единственное специфическое лечение — **экстренная рекомпрессия в барокамере**.
        src: d06
      - kind: list
        title: Клинические формы
        body: |
          | Форма | Проявления |
          |---|---|
          | **костно-суставная** (≈ 90% случаев) | боли в суставах (колени, локти, голеностопы) при движении; кожные высыпания, отёк |
          | лёгочная | боль в груди, сухой кашель, приступы удушья, возможен коллапс |
          | нейроциркуляторная | гипотония, нарушения ритма; в тяжёлых случаях — коллапс |
          | неврологическая (тяжёлая) | головная боль, судороги, парезы, параличи |
          | смешанная | сочетание симптомов |
        src: d07
      - kind: rule
        title: Полёты после подводного плавания
        body: |
          После погружения со сжатым воздухом в крови и тканях остаётся избыточный азот. Если взлететь слишком рано, пузырьки могут вызвать боль, затруднение дыхания и даже смерть — уже на высотах **около 2450 м (8000 футов)** и ниже, где летает большинство лёгких самолётов. Пожилые люди и люди с лишним весом более подвержены.

          **Правило лекции: после подводного плавания не летать 24 часа**; нельзя летать в тот же день.

          Если у дайвера уже развилась кессонная болезнь, эвакуация по воздуху к барокамере допустима — **на минимальной высоте**.
        src: d07
        errata: [hpm-e07]
      - kind: note
        title: 'Дополнение: правила FAA для полёта после дайвинга'
        body: |
          По циркуляру FAA AC 61-107B (**этого нет в лекции**):
          - полёт до 8000 футов — не раньше чем через **12 ч** после погружения без декомпрессионных остановок, через **24 ч** — после погружения с остановками;
          - полёт выше 8000 футов — не раньше чем через **24 ч** после любого погружения.
        src: d07
        web: [*faa]
