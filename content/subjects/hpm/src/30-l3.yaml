topics:
  - id: hpm-l3-blood
    title: Состав и функции крови
    pages: [c01, d08]
    theory:
      - kind: definition
        title: Кровь и её состав
        body: |
          **Кровь** — жидкая ткань, циркулирующая в кровеносной системе. Состоит из **плазмы** (жидкая часть) и **форменных элементов**:
          - **эритроциты** — переносят кислород;
          - **лейкоциты** — иммунитет, борьба с инфекцией;
          - **тромбоциты** — кровяные пластинки, участвуют в свёртывании крови и остановке кровотечения.

          Кровь, насыщенная кислородом (артериальная), ярко-красная; лишённая его (венозная) — темнее.
        src: c01
        errata: [hpm-e08]
      - kind: definition
        title: Гемоглобин
        body: '**Гемоглобин** — белок внутри эритроцитов; содержит **железо** и переносит кислород к тканям. В лекции норма — 120–150 г в 1 л крови взрослого.'
        src: c01
        errata: [hpm-e05]
      - kind: note
        title: 'Уточнение: норма гемоглобина зависит от пола'
        body: 'По критериям ВОЗ (2024) анемия у взрослых мужчин — гемоглобин **ниже 130 г/л**, у небеременных женщин — **ниже 120 г/л**. Поэтому 120–150 г/л — типичный диапазон для женщин, у мужчин норма выше. **Это уточнение не из лекции.**'
        src: c01
        web: [*who]
      - kind: list
        title: Функции крови
        body: |
          - **Дыхательная** — транспорт кислорода и углекислого газа
          - **Трофическая** — перенос глюкозы и других питательных веществ
          - **Экскреторная** — выведение продуктов обмена
          - **Регуляторная** — транспорт гормонов и медиаторов
          - **Гомеостатическая** — поддержание кислотности и концентрации важных веществ
          - **Защитная** — белки и вещества с антибактериальным и антивирусным действием
        src: c01
      - kind: definition
        title: Гемодинамика
        body: '**Гемодинамика** — движение крови по сосудам из-за разности давления в разных участках кровеносной системы: кровь движется из области высокого давления в область низкого.'
        src: d08
    questions:
      - type: matching
        cat: theory
        q: Сопоставьте форменный элемент крови и его функцию.
        pairs:
          - ['Эритроциты', 'Перенос кислорода']
          - ['Лейкоциты', 'Иммунитет, борьба с инфекцией']
          - ['Тромбоциты', 'Свёртывание крови, остановка кровотечения']
        hint: «Эритро» — красный.
        explain: 'Эритроциты переносят кислород, лейкоциты защищают от инфекций, тромбоциты останавливают кровотечение.'
        src: c01
      - type: single
        cat: theory
        q: Какой элемент входит в состав гемоглобина и позволяет ему переносить кислород?
        opts: ['Железо', 'Кальций', 'Натрий', 'Азот']
        ans: a
        hint: При его дефиците развивается анемия.
        explain: 'Гемоглобин — белок эритроцитов, содержащий железо; он переносит кислород.'
        src: c01
      - type: matching
        cat: theory
        q: Сопоставьте функцию крови и её содержание.
        pairs:
          - ['Дыхательная', 'Транспорт кислорода и углекислого газа']
          - ['Трофическая', 'Перенос глюкозы и питательных веществ']
          - ['Экскреторная', 'Выведение продуктов обмена']
          - ['Регуляторная', 'Транспорт гормонов']
        hint: «Трофе» — питание, «экскреция» — выведение.
        explain: 'Дыхательная — газы, трофическая — питание, экскреторная — выведение, регуляторная — гормоны.'
        src: c01
      - type: single
        cat: theory
        q: Из чего состоит кровь?
        opts: ['Из плазмы и форменных элементов', 'Только из эритроцитов', 'Из лимфы и воздуха', 'Из плазмы и гемоглобина без клеток']
        ans: a
        hint: Жидкая часть и клетки.
        explain: 'Кровь — плазма (жидкая часть) и взвешенные в ней форменные элементы.'
        src: c01
      - type: single
        cat: theory
        q: Куда движется кровь согласно определению гемодинамики?
        opts: ['Из области высокого давления в область низкого', 'Из области низкого давления в область высокого', 'Только вверх', 'Хаотично']
        ans: a
        hint: Как любая жидкость в трубах.
        explain: 'Кровь движется по разности давлений — от высокого к низкому.'
        src: d08
      - type: single
        cat: theory
        q: 'Ниже какого уровня гемоглобина у взрослого мужчины ВОЗ определяет анемию? (уточнение к лекции)'
        opts: ['130 г/л', '120 г/л', '100 г/л', '150 г/л']
        ans: a
        hint: У женщин порог на 10 г/л ниже.
        explain: 'По ВОЗ: мужчины — ниже 130 г/л, небеременные женщины — ниже 120 г/л.'
        src: c01
        web: [*who]

  - id: hpm-l3-hypoxia-types
    title: Гипоксия — определение и виды
    pages: [c01, c02, c03, c04]
    theory:
      - kind: definition
        title: Гипоксия
        body: |
          С ростом абсолютной высоты **уменьшается парциальное давление кислорода** — одна из важнейших характеристик среды полёта.

          **Гипоксия** — пониженное содержание кислорода в органах и тканях. В авиации — состояние, при котором организм или его часть **лишены адекватного снабжения кислородом на уровне тканей**, что ухудшает умственную и физическую работоспособность. Причины в полёте: пониженное давление на высоте, неисправность оборудования, физиологические ограничения пилота.
        src: c01
      - kind: definition
        title: Гипоксия головного мозга
        body: 'Недостаточное снабжение мозга кислородом повреждает и убивает нейроны. Мозг потребляет **около 20% всего кислорода** организма. Гипоксия мозга бывает острой и хронической; ухудшает мышление и координацию, вызывает головную боль, головокружение, спутанность сознания, в тяжёлых случаях — кому.'
        src: c01
      - kind: law
        title: Физиологическая основа
        body: 'На уровне моря давление ≈ **1013 гПа**. С высотой **процентное содержание кислорода (≈ 21%) остаётся постоянным**, но падает его парциальное давление — из лёгких в кровь переходит меньше кислорода. Мозг особенно чувствителен: даже небольшое снижение кислорода мешает сканировать приборы, вести радиосвязь и принимать решения. Поэтому правила устанавливают ограничения по высоте и требования к кислороду.'
        src: c02
      - kind: text
        title: Экзогенная и эндогенная гипоксия
        body: |
          **Экзогенная гипоксия** — из-за внешних факторов:
          - **нормобарическая** — давление нормальное, но кислорода во вдыхаемом воздухе мало: замкнутое невентилируемое помещение, шахта, колодец, неисправность подачи кислородной смеси;
          - **гипобарическая** — понижено атмосферное давление: высокогорье, высота более 3000–3500 м, барокамера; сюда относятся горная, высотная и декомпрессионная болезни.

          **Эндогенная гипоксия** — из-за внутренних нарушений:
          - **дыхательная (респираторная)** — проблемы дыхательной системы;
          - **циркуляторная** — нарушено кровообращение: сердечная недостаточность, гипотензия, инсульт;
          - **гемическая (кровяная)** — кровь плохо переносит кислород: мало гемоглобина или эритроцитов (анемия), отравление угарным газом;
          - **тканевая (гистотоксическая)** — ткани не могут использовать кислород: отравление лекарствами, алкоголем, наркотиками.
        src: c02
        errata: [hpm-e06]
      - kind: list
        title: Виды гипоксии, актуальные для пилотов
        body: |
          - **Гипоксическая** — снижено давление кислорода в артериальной крови; причина — низкое давление кислорода во вдыхаемом воздухе (гипобарическая гипоксия), гиповентиляция, нарушение газообмена в альвеолах.
          - **Анемическая** — снижена способность крови переносить кислород (мало эритроцитов или гемоглобина, аномальный гемоглобин — например, серповидноклеточная анемия).
          - **Ишемическая** — недостаточно кровообращение в тканях (закрытие артерии, спазм сосудов).
          - **Гистотоксическая** — клетки не могут использовать доставленный кислород (нарушения обмена, лекарства, наркотики, **алкоголь**).

          **В авиации самая распространённая — гипобарическая гипоксия.**
        src: c03
      - kind: note
        title: Алкоголь и гипоксия
        body: 'Даже небольшое количество алкоголя заметно повышает восприимчивость к гипоксии на высоте. Вещества, действующие на центральную нервную систему, усиливают эффекты гипоксии и **снижают высоту, на которой появляются симптомы**.'
        src: c03
    questions:
      - type: single
        cat: theory
        q: Какая форма гипоксии в авиации встречается чаще всего?
        opts: ['Гипобарическая', 'Гистотоксическая', 'Нормобарическая', 'Циркуляторная']
        ans: a
        hint: Связана с пониженным давлением на высоте.
        explain: 'В авиации наиболее распространена гипобарическая гипоксия.'
        src: c03
      - type: single
        cat: theory
        q: Что происходит с процентным содержанием кислорода в воздухе при подъёме на высоту?
        opts: ['Остаётся около 21% — падает парциальное давление', 'Снижается до 10% на 3000 м', 'Растёт', 'Становится равным нулю на 5000 м']
        ans: a
        hint: Меняется давление, а не состав.
        explain: 'Процент кислорода (~21%) постоянен; падает его парциальное давление.'
        src: c02
      - type: matching
        cat: theory
        q: Сопоставьте вид эндогенной гипоксии и его причину.
        pairs:
          - ['Дыхательная', 'Болезни дыхательной системы']
          - ['Циркуляторная', 'Нарушение кровообращения, сердечная недостаточность']
          - ['Гемическая', 'Мало гемоглобина или эритроцитов']
          - ['Тканевая', 'Отравление, ткани не используют кислород']
        hint: Лёгкие — кровоток — кровь — клетки.
        explain: 'Дыхательная — лёгкие, циркуляторная — кровообращение, гемическая — кровь, тканевая — клетки.'
        src: c02
      - type: single
        cat: theory
        q: Какой процент всего кислорода организма потребляет мозг?
        opts: ['Около 20%', 'Около 2%', 'Около 50%', 'Около 80%']
        ans: a
        hint: Пятая часть.
        explain: 'Мозг потребляет около 20% всего кислорода — у него высокая метаболическая активность.'
        src: c01
      - type: single
        cat: theory
        q: К какому виду гипоксии относится гипоксия от алкоголя и некоторых лекарств?
        opts: ['Гистотоксической (тканевой)', 'Гипобарической', 'Ишемической', 'Нормобарической']
        ans: a
        hint: Клетки не могут использовать кислород.
        explain: 'Алкоголь, лекарства и токсины мешают клеткам использовать кислород — гистотоксическая гипоксия.'
        src: c03
      - type: single
        cat: theory
        q: Как алкоголь влияет на высоту, на которой появляются симптомы гипоксии?
        opts: ['Снижает её — симптомы появляются ниже', 'Повышает её', 'Не влияет', 'Полностью защищает от гипоксии']
        ans: a
        hint: Восприимчивость к гипоксии растёт.
        explain: 'Вещества, действующие на ЦНС, усиливают гипоксию и снижают высоту появления симптомов.'
        src: c03
      - type: single
        cat: theory
        q: Как называется гипоксия при нормальном давлении, но недостатке кислорода во вдыхаемом воздухе (например, в колодце)?
        opts: ['Нормобарическая', 'Гипобарическая', 'Гистотоксическая', 'Ишемическая']
        ans: a
        hint: «Нормо» — нормальное давление.
        explain: 'Нормобарическая гипоксия — при нормальном давлении, но пониженном содержании кислорода (плохо вентилируемое помещение).'
        src: c03
      - type: single
        cat: theory
        q: 'К какому виду гипоксии относят отравление угарным газом (CO)? (по FAA)'
        opts: ['Гемической — CO связывается с гемоглобином', 'Гипобарической', 'Ишемической', 'Нормобарической гипоксической']
        ans: a
        hint: Кровь не может переносить кислород.
        explain: 'Угарный газ связывается с гемоглобином, и кровь не переносит достаточно кислорода — гемическая (кровяная) гипоксия.'
        src: c04
        web: [*phak]

  - id: hpm-l3-hypoxia-alt
    title: Пороги гипоксии по высоте и симптомы
    pages: [c04, c05]
    theory:
      - kind: law
        title: Пороговые высоты гипоксии
        body: |
          | Высота | Что происходит |
          |---|---|
          | 1000 м (3300 футов) | условный порог: ниже заметной физиологической реакции нет |
          | около 1500 м (5000 футов) | более реальный порог — первые обнаружимые симптомы |
          | выше 3000 м (10 000 футов) | симптомы заметнее — граница полётов на негерметичных ВС без кислорода |
          | 1500–2450 м (5000–8000 футов) | «высота» в салоне большинства лайнеров на крейсерской высоте |

          Системы герметизации поддерживают в кабине достаточное парциальное давление кислорода.
        src: c04
      - kind: list
        title: Признаки гипоксии
        body: |
          **Субъективные** (ощущает сам человек): одышка; головная боль, головокружение; тошнота, чувство тепла на лице; затуманивание, расплывчатость, двоение зрения; растерянность, **весёлость (эйфория)**; сонливость, вялость, слабость, оцепенение.

          **Объективные** (видны со стороны): гипервентиляция (учащённое глубокое дыхание); зевота, тремор; потоотделение, бледность; цианоз (синюшность); тревожное выражение лица; тахикардия; **брадикардия — опасный признак**; замедленное мышление, неразборчивая речь, нарушение координации; потеря сознания, судороги.
        src: c04
      - kind: list
        title: Чем гипоксия опасна для пилота
        body: |
          Гипоксия часто **развивается постепенно** и ухудшает суждение, зрение и координацию **раньше, чем пилот осознаёт проблему** — возможны неправильные решения, потеря ситуационной осведомлённости и потеря управления.

          Характерные симптомы: ухудшение **ночного зрения**; трудности с концентрацией, спутанность; **эйфория**, чрезмерная самоуверенность, неуместный смех; головная боль и головокружение; онемение и покалывание в пальцах; учащённое дыхание и одышка; цианоз губ и ногтей на поздних стадиях.
        src: c05
    examples:
      - title: Почему порог «без кислорода» — около 3000 м
        given: 'Давление на 3000 м ≈ 527 мм рт. ст. Во вдыхаемом воздухе он насыщается водяным паром (47 мм рт. ст. при 37 °C), доля кислорода — 0,21.'
        steps:
          - 'Парциальное давление кислорода во вдыхаемом (увлажнённом) воздухе: $p_{O_2} = 0{,}21 \cdot (527 - 47)$.'
          - '$p_{O_2} \approx 0{,}21 \cdot 480 \approx 101$ мм рт. ст. (у земли — около 150).'
        answer: 'около 100 мм рт. ст. — как и сказано в лекции: выше 3000–3500 м давление кислорода меньше 100 мм рт. ст.'
        computed: true
        src: c03
    questions:
      - type: single
        cat: theory
        q: Какая высота названа в лекции пороговой для полётов на негерметичных судах без кислородного оборудования?
        opts: ['3000 м (10 000 футов)', '1000 м (3300 футов)', '5500 м (18 000 футов)', '12 000 м (40 000 футов)']
        ans: a
        hint: Выше неё симптомы становятся заметнее.
        explain: 'Симптомы становятся заметнее выше 3000 м — это порог для полётов без кислорода.'
        src: c04
      - type: single
        cat: theory
        q: Какой «высоте» соответствует давление в салоне большинства лайнеров на крейсерской высоте?
        opts: ['1500–2450 м (5000–8000 футов)', '0 м', '5000–6000 м', '10 000–12 000 м']
        ans: a
        hint: Не выше 8000 футов.
        explain: 'Давление в салоне соответствует высоте 1500–2450 м.'
        src: c04
      - type: multiple
        cat: theory
        q: Какие признаки гипоксии относятся к объективным (видны со стороны)?
        opts: ['Цианоз', 'Тремор и зевота', 'Неразборчивая речь', 'Чувство тепла на лице']
        ans: [a, b, c]
        hint: Чувство тепла может ощутить только сам человек.
        explain: 'Цианоз, тремор, зевота, неразборчивая речь — объективные признаки; чувство тепла — субъективный.'
        src: c04
      - type: single
        cat: theory
        q: Почему гипоксия особенно опасна для пилота?
        opts: ['Она развивается постепенно и ухудшает суждение раньше, чем пилот это осознаёт', 'Она всегда сопровождается сильной болью', 'Она бывает только у пассажиров', 'Её легко заметить по запаху']
        ans: a
        hint: Пилот может чувствовать себя даже лучше обычного.
