  - id: hpm-l3-tuc
    title: Время полезного сознания и действия при гипоксии
    pages: [c05, c06]
    theory:
      - kind: definition
        title: Время полезного сознания (TUC)
        body: |
          **Время полезного сознания** (Time of Useful Consciousness, TUC) — период после снижения или прекращения подачи кислорода, в течение которого человек может **эффективно выполнять задачи**. Это **не время до потери сознания**, а время, пока работа ещё надёжна.

          TUC быстро уменьшается с высотой: на средних высотах — несколько минут, на очень больших — **несколько секунд**. Поэтому после разгерметизации первая задача — **немедленно надеть кислородную маску**, затем снижаться.
        src: c05
      - kind: note
        title: 'Дополнение: таблица TUC (FAA)'
        body: |
          Средние значения из циркуляра FAA AC 61-107B (у разных людей сильно различаются — ориентироваться на меньшее). **Таблицы нет в лекции.**

          | Высота | TUC | после быстрой разгерметизации |
          |---|---|---|
          | 18 000 футов (5,5 км) | 20–30 мин | 10–15 мин |
          | 22 000 футов (6,7 км) | 10 мин | 5–6 мин |
          | 25 000 футов (7,6 км) | 3–5 мин | 1,5–2,5 мин |
          | 30 000 футов (9,1 км) | 1–2 мин | 30 с – 1 мин |
          | 35 000 футов (10,7 км) | 30 с – 1 мин | 15–30 с |
          | 40 000 футов (12,2 км) | 15–20 с | практически нет |
        src: c05
        web: [*faa]
      - kind: list
        title: Взаимодействие с другими опасностями
        body: 'Гипоксия усиливается **усталостью, обезвоживанием и холодом**, и её труднее распознать: уставший пилот ночью может принять изменения от гипоксии за обычную усталость. **Курение, недавний алкоголь и некоторые лекарства** снижают переносимость высоты — симптомы появляются ниже, чем ожидалось.'
        src: c05
      - kind: list
        title: Предполётное планирование
        body: |
          - Ознакомиться с правилами: требования к кислороду для планируемой высоты и продолжительности.
          - Проверить ограничения ВС: максимальная высота, возможности кислородной системы, ограничения оборудования.
          - Осмотреть кислородное оборудование: баллоны заполнены, клапаны и регуляторы работают, маски исправны.
          - Учесть личные факторы: усталость, болезнь, алкоголь, курение, лекарства.
          - Планировать высоты и маршруты с безопасной высотой кабины и возможностью быстро снизиться.
        src: c06
      - kind: rule
        title: Немедленные действия при подозрении на гипоксию
        body: |
          1. **Надеть кислородную маску** (дополнительный кислород), проверить подачу.
          2. Установить **100% кислород** (аварийный режим по контрольному списку).
          3. **Начать снижение** до безопасной высоты.
          4. **Сообщить** диспетчеру, запросить приоритет, при необходимости объявить аварийную ситуацию.
          5. Проверить системы наддува, вентиляции и обогрева.
          6. Следить за восстановлением; если симптомы не проходят — посадка как можно скорее.
        src: c06
    questions:
      - type: single
        cat: theory
        q: Что такое время полезного сознания (TUC)?
        opts: ['Время, в течение которого человек ещё может эффективно выполнять задачи без кислорода', 'Время до полной потери сознания', 'Время полёта без посадки', 'Время, нужное для надевания маски']
        ans: a
        hint: Это не время до обморока.
        explain: 'TUC — период, пока человек способен эффективно и надёжно действовать после прекращения подачи кислорода.'
