topics:
  - id: hpm-l7-death
    title: Клиническая и биологическая смерть
    pages: [g01]
    theory:
      - kind: definition
        title: Клиническая смерть
        body: |
          **Клиническая смерть** — **обратимый** этап умирания, переходное состояние от жизни к смерти.

          Признаки прекращения жизнедеятельности:
          - отсутствие **сознания**;
          - отсутствие **пульса** на магистральных (крупных) артериях;
          - отсутствие **самостоятельного дыхания**;
          - а также расширение зрачков (через ~1 мин), отсутствие рефлексов (арефлексия), выраженная бледность, цианоз кожи.
        src: g01
      - kind: list
        title: Признаки биологической смерти
        body: |
          | Признаки | Когда появляются |
          |---|---|
          | **ранние:** помутнение и высыхание **роговицы** | около 20 мин |
          | **ранние:** «синдром кошачьего глаза» — при сдавлении глаза зрачок становится щелевидным | 30–40 мин после остановки сердца |
          | **поздние:** трупные пятна | через 1,5–3 ч |
          | **поздние:** трупное охлаждение | примерно на 1 °C в час до температуры окружающей среды |
          | **поздние:** трупное окоченение | через 2–3 ч; полное — через 24 ч, исчезает через 2–3 дня |
          | **поздние:** трупное разложение | через 3 суток |

          Признаки биологической смерти означают, что реанимация уже бесполезна.
        src: g01
        errata: [hpm-e19]
    questions:
      - type: single
        cat: theory
        q: Чем клиническая смерть отличается от биологической?
        opts: ['Клиническая смерть обратима', 'Клиническая смерть необратима', 'Это одно и то же', 'Биологическая смерть длится несколько минут']
        ans: a
        hint: Именно поэтому важна ранняя реанимация.
        explain: 'Клиническая смерть — обратимый этап умирания; при биологической реанимация бесполезна.'
        src: g01
      - type: multiple
        cat: theory
        q: Какие признаки относятся к основным признакам клинической смерти?
        opts: ['Нет сознания', 'Нет пульса на крупных артериях', 'Нет самостоятельного дыхания', 'Трупные пятна']
        ans: [a, b, c]
        hint: Трупные пятна — поздний признак биологической смерти.
        explain: 'Основные признаки клинической смерти — нет сознания, пульса на магистральных артериях и дыхания.'
        src: g01
      - type: sequence
        cat: theory
        q: Расположите признаки биологической смерти по времени появления.
        seq: ['Помутнение роговицы (около 20 мин)', 'Синдром кошачьего глаза (30–40 мин)', 'Трупные пятна (1,5–3 ч)', 'Трупное разложение (3 суток)']
        hint: Ранние — в первый час.
        explain: 'Роговица → кошачий глаз → трупные пятна → разложение.'
        src: g01
      - type: single
        cat: theory
        q: Что такое синдром «кошачьего глаза»?
        opts: ['При сдавлении глазного яблока зрачок становится щелевидным', 'Глаза светятся в темноте', 'Зрачки расширяются от света', 'Глаза краснеют']
        ans: a
        hint: Как у кошки — узкая щель.
        explain: 'Ранний признак биологической смерти: при сдавлении глаза зрачок деформируется в щель.'
        src: g01
      - type: single
        cat: theory
        q: Какая часть глаза мутнеет и высыхает как ранний признак биологической смерти?
        opts: ['Роговица', 'Радужная оболочка', 'Хрусталик', 'Сетчатка']
        ans: a
        hint: Так подписано и на рисунке лекции.
        explain: 'Мутнеет и высыхает роговица — прозрачная передняя оболочка глаза.'
        src: g01

  - id: hpm-l7-cpr
    title: Алгоритм базовой сердечно-лёгочной реанимации
    pages: [g02, g03, g04, g05]
    theory:
      - kind: text
        title: Почему важны минуты
        body: |
          Главное — **раннее распознавание** остановки кровообращения и **раннее начало СЛР** очевидцами: квалифицированная помощь всегда приходит с задержкой (5–8 мин даже в лучших центрах Европы).

          Выживаемость статистически повышают только два мероприятия — **ранние компрессии грудной клетки** (непрямой массаж сердца) и **ранняя дефибрилляция**. Раннее начало компрессий увеличивает выживаемость в 2–3 раза; компрессии и дефибрилляция в первые 3–5 мин дают выживаемость 49–75%.

          Базовую СЛР **может и должен** выполнить любой человек, даже без медицинского образования.
        src: g02
      - kind: rule
        title: Алгоритм (по лекции)
        body: |
          1. **Обеспечить безопасность** для себя и окружающих.
          2. **Проверить реакцию**: аккуратно встряхнуть за плечи и громко спросить «Что с вами?».
          3. **Открыть дыхательные пути** — приём Сафара: одна рука давит на лоб (запрокидывание головы), другая подтягивает подбородок.
          4. **Проверить дыхание** — увидеть движения груди, услышать дыхание, почувствовать воздух щекой; **не дольше 10 секунд**.
          5. **Позвать на помощь**: вызвать скорую (**103**), чётко сообщить адрес и что случилось, попросить принести **АНД** (автоматический наружный дефибриллятор).
          6. **30 компрессий** грудной клетки.
          7. **2 вдоха**.
        src: g03
      - kind: rule
        title: Компрессии грудной клетки
        body: |
          - Пострадавший — на **ровной твёрдой поверхности**, грудь и живот освобождены от стесняющей одежды.
          - Встать на колени сбоку; основание одной ладони — на **центр грудной клетки (нижняя половина грудины)**, другую ладонь — сверху; пальцы в замок, не давить на рёбра, верхнюю часть живота и нижний конец грудины.
          - Руки прямые, корпус — вертикально над грудью.
          - **Частота 100–120 в минуту, глубина 5–6 см**; сжатие и расслабление занимают примерно равное время; считать вслух.
        src: g04
        fig: hpm-cpr
      - kind: rule
        title: Искусственные вдохи «рот ко рту»
        body: |
          1. Открыть дыхательные пути (как выше).
          2. Зажать крылья носа пальцами руки, лежащей на лбу.
          3. Сделать нормальный вдох, плотно охватить губами рот пострадавшего.
          4. Равномерно вдохнуть **в течение 1 секунды**, наблюдая за подъёмом груди; избегать форсированных вдохов.
          5. Отпустить, дать груди опуститься, сделать второй вдох.

          Затем — снова 30 компрессий, цикл **30 : 2** повторяется.
        src: g04
      - kind: note
        title: 'Уточнение по ERC 2021: пульс очевидцу проверять не нужно'
        body: |
          По рекомендациям Европейского совета по реанимации (ERC 2021) **этого нет в лекции**:
          - очевидец начинает СЛР, если человек **не реагирует и не дышит нормально**; редкие «агональные» вдохи — тоже признак остановки сердца;
          - пульс очевидцу проверять не нужно — это ненадёжно и задерживает помощь (в лекции — проверка пульса на сонной артерии каждые 2–3 мин);
          - глубина компрессий — **не менее 5 и не более 6 см**, частота 100–120 в минуту, грудная клетка должна полностью расправляться;
          - АНД включают, как только его принесли; во время анализа ритма и разряда никто не касается пострадавшего.
        src: g02
        web: [*erc]
        errata: [hpm-e20]
      - kind: list
        title: Когда прекращают и когда не начинают реанимацию
        body: |
          **Прекращают** только при признании их абсолютно бесперспективными или констатации биологической смерти: при смерти мозга; при неэффективности реанимации **в течение 30 минут**.

          **Не проводят**: при признаках биологической смерти; при клинической смерти на фоне прогрессирования достоверно установленных неизлечимых заболеваний.
        src: g05
    questions:
      - type: single
        cat: theory
        q: Какие частота и глубина компрессий у взрослого?
        opts: ['100–120 в минуту, 5–6 см', '60–80 в минуту, 2–3 см', '150–200 в минуту, 8–10 см', '30 в минуту, 1 см']
        ans: a
        hint: Чуть меньше двух в секунду.
        explain: 'Частота 100–120 в минуту, глубина 5–6 см.'
        src: g04
      - type: single
        cat: theory
        q: Какое соотношение компрессий и вдохов у взрослого?
        opts: ['30 : 2', '15 : 1', '5 : 1', '2 : 30']
        ans: a
        hint: Сначала много компрессий, потом два вдоха.
        explain: 'Цикл — 30 компрессий и 2 вдоха.'
        src: g04
      - type: sequence
        cat: theory
        q: Расположите шаги базовой СЛР в порядке лекции.
        seq: ['Обеспечить безопасность', 'Проверить реакцию', 'Открыть дыхательные пути', 'Проверить дыхание (не более 10 с)', 'Вызвать помощь (103), попросить АНД', '30 компрессий и 2 вдоха']
        hint: Безопасность — всегда первая.
        explain: 'Безопасность → реакция → дыхательные пути → дыхание → вызов помощи и АНД → 30 : 2.'
        src: g03
      - type: single
        cat: theory
        q: Куда кладут основание ладони при компрессиях?
        opts: ['На центр грудной клетки — нижнюю половину грудины', 'На верхнюю часть живота', 'На левую сторону груди над соском', 'На шею']
        ans: a
        hint: Не на рёбра и не на живот.
        explain: 'Основание ладони — на центр груди (нижняя половина грудины); давить на рёбра и живот нельзя.'
        src: g04
      - type: single
        cat: theory
        q: Как долго проверяют наличие дыхания?
        opts: ['Не более 10 секунд', '1 минуту', '3 минуты', 'Пока не приедет скорая']
        ans: a
        hint: Нельзя терять время.
        explain: 'Видеть, слышать и ощущать дыхание — не дольше 10 секунд.'
        src: g03
      - type: single
        cat: theory
        q: Какие два мероприятия, по лекции, статистически повышают выживаемость при остановке кровообращения?
        opts: ['Ранние компрессии грудной клетки и ранняя дефибрилляция', 'Холод на голову и кислород', 'Приём нитроглицерина и аспирина', 'Поднятые ноги и сладкий чай']
        ans: a
        hint: Одно делают руками, другое — АНД.
        explain: 'Выживаемость статистически повышают только ранние компрессии и ранняя дефибрилляция.'
        src: g02
      - type: single
        cat: theory
        q: Как называется приём открытия дыхательных путей — запрокидывание головы и подтягивание подбородка?
        opts: ['Приём Сафара', 'Приём Геймлиха', 'Приём Вальсальвы', 'Приём Селье']
        ans: a
        hint: Геймлих — для удаления инородного тела.
        explain: 'Приём Сафара: одна рука давит на лоб, другая подтягивает подбородок.'
        src: g03
      - type: single
        cat: theory
        q: Через сколько минут неэффективной реанимации её прекращают (по лекции)?
        opts: ['Через 30 минут', 'Через 5 минут', 'Через 2 часа', 'Никогда']
        ans: a
        hint: Полчаса.
        explain: 'Реанимацию прекращают при её неэффективности в течение 30 минут.'
        src: g05
      - type: single
        cat: theory
        q: 'Нужно ли очевидцу без медицинской подготовки проверять пульс перед началом СЛР по ERC 2021? (уточнение к лекции)'
        opts: ['Нет — достаточно, что человек не реагирует и не дышит нормально', 'Да, обязательно 1 минуту', 'Да, на запястье', 'Только у детей']
        ans: a
        hint: Проверка пульса ненадёжна и задерживает помощь.
        explain: 'По ERC 2021 остановку кровообращения очевидец определяет по отсутствию реакции и нормального дыхания.'
        src: g02
        web: [*erc]
      - type: numeric
        cat: problem
        q: 'Сколько секунд займут 30 компрессий при частоте 110 в минуту? Ответ округлите до целого.'
        num: { value: 16, unit: 'с', check: '30*60/110', tolAbs: 0.5 }
        hint: 'Одна компрессия занимает $60/110$ с.'
        explain: '$30 \cdot 60/110 \approx 16{,}4$ с ≈ 16 с.'
        sol: { method: 'Время = число компрессий × период.', steps: ['$T = 60/110 \approx 0{,}545$ с', '$30 \cdot 0{,}545 \approx 16{,}4$ с'], answer: '≈ 16 с' }
        src: g04

  - id: hpm-l7-recovery
    title: Боковое стабильное положение
    pages: [g05, g06, g07]
    theory:
      - kind: rule
        title: Как уложить в боковое стабильное положение
        body: |
          Используют, если человек **без сознания, но дышит нормально**.
          1. Снять очки, положить в безопасное место.
          2. Встать на колени рядом, убедиться, что обе ноги выпрямлены.
          3. Ближнюю руку пострадавшего отвести в сторону под прямым углом к туловищу и согнуть в локте ладонью вверх.
          4. Дальнюю руку переместить через грудь, тыльную сторону ладони прижать к ближней к спасателю щеке.
          5. Захватить дальнюю ногу чуть выше колена и подтянуть вверх, не отрывая стопу от пола.
          6. Удерживая руку у щеки, потянуть за ногу и повернуть пострадавшего на бок лицом к себе.
          7. Согнуть верхнюю ногу в колене и бедре под прямым углом.
          8. Отклонить голову назад, чтобы дыхательные пути были открыты и был отток выделений; при необходимости — руку под щёку.
          9. Проверять дыхание (по лекции — каждые 5 мин).
          10. Каждые 30 мин перекладывать на другой бок, чтобы не было синдрома позиционного сдавления.
        src: g05
        errata: [hpm-e22]
      - kind: note
        title: 'Уточнение по ERC 2021'
        body: 'Боковое положение — только для тех, кто **дышит нормально** и кому не нужна СЛР. Дыхание нужно **контролировать постоянно**; если оно стало ненормальным или исчезло — перевернуть на спину и начать компрессии. **Этого нет в лекции.**'
        src: g07
        web: [*erc]
    questions:
      - type: single
        cat: theory
        q: Кого укладывают в боковое стабильное положение?
        opts: ['Человека без сознания, который дышит нормально', 'Человека без дыхания', 'Человека, который подавился и в сознании', 'Любого после перегрузки']
        ans: a
        hint: Если дыхания нет — нужна СЛР.
        explain: 'Боковое положение — для людей без сознания с нормальным дыханием: оно сохраняет дыхательные пути открытыми.'
        src: g05
      - type: sequence
        cat: theory
        q: Расположите шаги укладывания в боковое положение.
        seq: ['Ближнюю руку отвести под прямым углом', 'Дальнюю руку положить тыльной стороной к щеке', 'Подтянуть дальнюю ногу за колено', 'Повернуть пострадавшего на бок к себе', 'Согнуть верхнюю ногу под прямым углом и отклонить голову назад']
        hint: Сначала руки, потом нога, потом поворот.
        explain: 'Руки → нога → поворот → фиксация ноги и головы.'
        src: g06
      - type: single
        cat: theory
        q: Зачем в боковом положении отклоняют голову назад?
        opts: ['Чтобы дыхательные пути оставались открытыми и был отток выделений', 'Чтобы было удобнее говорить', 'Чтобы снизить давление', 'Чтобы согреть пострадавшего']
        ans: a
        hint: Главное — дыхание.
        explain: 'Голову отклоняют назад, чтобы сохранить проходимость дыхательных путей и отток секретов.'
        src: g07
      - type: single
        cat: theory
        q: Как часто, по лекции, перекладывают пострадавшего на другой бок?
        opts: ['Каждые 30 минут', 'Каждую минуту', 'Каждые 5 часов', 'Не перекладывают']
        ans: a
        hint: Чтобы не было синдрома сдавления.
        explain: 'Каждые 30 мин — во избежание синдрома позиционного сдавления.'
        src: g07
      - type: single
        cat: theory
        q: 'Что делать, если у человека в боковом положении дыхание стало ненормальным? (ERC 2021)'
        opts: ['Перевернуть на спину и начать компрессии', 'Оставить на боку и ждать', 'Дать воды', 'Посадить']
        ans: a
        hint: Это признак остановки кровообращения.
        explain: 'По ERC 2021 дыхание контролируют постоянно; при ненормальном дыхании начинают СЛР.'
        src: g07
        web: [*erc]

  - id: hpm-l7-choking
    title: Инородное тело в дыхательных путях — удары по спине и приём Геймлиха
    pages: [g07, g08, g09]
    theory:
      - kind: definition
        title: Как распознать
        body: 'Типичный признак нарушения проходимости дыхательных путей — человек **держится за горло** и пытается кашлять. При **частичной** обструкции главное — побуждать кашлять; при **полной** (не может говорить, кашлять, дышать) нужно удалять инородное тело.'
        src: g07
      - kind: rule
        title: Удары по спине
        body: |
          1. Попросить пострадавшего покашлять.
          2. Встать сбоку и немного сзади.
          3. Придерживая одной рукой, наклонить его вперёд — чтобы тело выпало в рот, а не ушло глубже.
          4. Нанести **5 резких ударов основанием ладони между лопатками**, проверяя после каждого, не вышло ли тело.
        src: g07
      - kind: rule
        title: Приём Геймлиха (толчки в живот)
        body: |
          Если после 5 ударов тело не удалено:
          - встать позади и обхватить пострадавшего руками на уровне верхней части живота;
          - сжать кулак и положить его стороной большого пальца на живот **чуть выше пупка и значительно ниже грудины** (мечевидного отростка);
          - обхватить кулак другой рукой и, слегка наклонив пострадавшего вперёд, резко надавить **внутрь и вверх**; диафрагма смещается вверх, возникает искусственный кашель.

          Если не помогло — **чередовать 5 ударов по спине и 5 толчков в живот**. Если пострадавший **потерял сознание** — начать СЛР (компрессии и вдохи), следя, не появилось ли инородное тело во рту.
        src: g08
        errata: [hpm-e23]
      - kind: note
        title: 'Уточнение: где держать кулак'
        body: 'По MedlinePlus (NIH): кулак кладут стороной большого пальца на живот **чуть выше пупка и значительно ниже грудины** и дают быстрый толчок внутрь и вверх. В лекции в одном месте сказано «подложить большой палец под мечевидный отросток» — это слишком высоко: можно повредить рёбра и органы. **Это уточнение не из лекции.**'
        src: g08
        web: [*mlp]
