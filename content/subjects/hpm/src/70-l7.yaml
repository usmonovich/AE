        title: СЛР у детей (по лекции)
        body: |
          1. Последовательность, частота и соотношение — как у взрослых: **30 : 2** у детей старше года; **до года — 15 : 2**.
          2. Глубина надавливания — **1/3 переднезаднего размера грудной клетки**.
          3. Детям до года надавливают **двумя пальцами**, детям старше — одной или двумя руками.
          4. Детям до года при вдохе губами охватывают **рот и нос** одновременно.
        src: g05
        errata: [hpm-e21]
      - kind: note
        title: 'Уточнение: рекомендации ERC для детей'
        body: 'По рекомендациям ERC (сводка GPnotebook): у младенцев и детей соотношение **15 : 2**, начинают с **5 вдохов**; одиночный спасатель может использовать 30 : 2. Глубина — не меньше 1/3 грудной клетки: около 4 см у младенца и 5 см у ребёнка, частота 100–120 в минуту. **Это уточнение не из лекции.**'
