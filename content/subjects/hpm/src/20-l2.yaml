  - id: hpm-l2-vision
    title: Орган зрения — освещение кабины и болезни глаз
    pages: [b07, b08, b09]
    theory:
      - kind: definition
        title: Уровень освещённости
        body: |
          **Освещённость** — физическая величина, показывающая, сколько света падает на поверхность; измеряется в **люксах (лк)**.

          На неё влияют время суток (пик в полдень), цвет стен и мебели (светлые отражают больше), загрязнение и неисправность светильников; в кабине — этап полёта и условия.
        src: b07
      - kind: text
        title: Освещение кабины
        body: |
          - **Красное освещение — на взлёте и посадке.** Глаз адаптируется к темноте и видит приборы. Недостатки: непривычная обстановка утомляет в долгом полёте; красные сигналы и знаки при красном свете становятся **невидимыми**.
          - **Белое освещение — в полёте.** Можно использовать обычные цветные знаки и сигналы; острота зрения выше, чем при красном.
          - **Пасмурная погода.** Настройка почти не нужна: яркость основных пилотажных приборов регулируется автоматически.
          - **Вечер.** Может автоматически включаться подсветка резервных приборов — при отказе основных можно быстро перейти на резервные.
        src: b07
      - kind: definition
        title: Бинокулярное и монокулярное зрение
        body: |
          - **Бинокулярное зрение** — способность видеть одновременно двумя глазами: объекты объёмны, легко определить **расстояние** до них.
          - **Монокулярное зрение** — человек видит одним глазом: воспринимаются форма, размер, высота и ширина, но плохо — глубина. Для человека это отклонение от нормы (у некоторых животных — норма).

          Для лётчика **особо важны бинокулярное зрение и правильное восприятие глубины и расстояния**.
        src: b08
      - kind: definition
        title: Катаракта и глаукома
        body: |
          **Катаракта** — нарушение прозрачности **хрусталика**: снижение остроты зрения, при выраженном помутнении — потеря зрения, без лечения — слепота. Причины: возрастные изменения (до 90% случаев), наследственность, травмы и воспаления глаза, сахарный диабет, лучевые поражения (инфракрасное, рентгеновское, ионизирующее излучение), авитаминоз A, B, C.

          **Глаукома** — большая группа заболеваний, при которых повышается **внутриглазное давление**. Факторы риска: возраст, семейный анамнез, уровень внутриглазного давления, лечение или отсутствие лечения гипертензии, близорукость или дальнозоркость, гипотиреоз, диабет, гипертония. Прогрессированию способствует нарушение сна.
        src: b08
      - kind: definition
        title: Астигматизм, близорукость, дальнозоркость
        body: |
          - **Астигматизм** — роговица или хрусталик неправильной формы — нечёткость зрения; на ранней стадии хуже в темноте, когда зрачок шире
          - **Близорукость (миопия)** — близкие предметы видны чётко, дальние — нет
          - **Дальнозоркость** — близкие предметы размыты, дальние видны чётко
        src: b09
    questions:
      - type: single
        cat: theory
        q: Зачем в кабине на взлёте и посадке включают красное освещение?
        opts: ['Чтобы глаз адаптировался к темноте и были видны приборы', 'Чтобы лучше различать красные сигналы', 'Чтобы повысить остроту зрения', 'Чтобы сэкономить электроэнергию']
        ans: a
        hint: Темновая адаптация.
        explain: 'Красное освещение сохраняет адаптацию глаза к темноте и позволяет видеть приборы.'
        src: b07
      - type: single
        cat: theory
        q: Какой недостаток красного освещения кабины назван в лекции?
        opts: ['Красные сигналы и знаки при нём становятся невидимыми', 'Оно повышает остроту зрения', 'Оно невозможно на взлёте', 'Оно вызывает баротравму']
        ans: a
        hint: Красное на красном не видно.
        explain: 'Принятые при обычном освещении красные сигналы и знаки в красном свете становятся невидимыми; кроме того, в долгом полёте оно утомляет.'
        src: b07
      - type: single
        cat: theory
        q: Почему для лётчика особенно важно бинокулярное зрение?
        opts: ['Оно даёт восприятие глубины и расстояния', 'Оно улучшает слух', 'Оно позволяет видеть в темноте без света', 'Оно защищает от перегрузок']
        ans: a
        hint: Посадка требует оценки расстояния до полосы.
        explain: 'Бинокулярное зрение даёт объёмное восприятие и оценку расстояния.'
        src: b08
      - type: matching
        cat: theory
        q: Сопоставьте заболевание глаза и его суть.
        pairs:
          - ['Катаракта', 'Помутнение хрусталика']
          - ['Глаукома', 'Повышение внутриглазного давления']
          - ['Астигматизм', 'Неправильная форма роговицы или хрусталика']
          - ['Миопия', 'Плохо видны дальние предметы']
        hint: Миопия — то же, что близорукость.
        explain: 'Катаракта — хрусталик; глаукома — внутриглазное давление; астигматизм — форма роговицы или хрусталика; миопия — близорукость.'
        src: b08
      - type: single
        cat: theory
        q: Какая причина катаракты встречается чаще всего?
        opts: ['Возрастные изменения (до 90% случаев)', 'Перегрузки', 'Укачивание', 'Высотный метеоризм']
        ans: a
        hint: С годами хрусталик мутнеет.
        explain: 'До 90% случаев катаракты связаны с возрастными изменениями.'
        src: b08
      - type: single
        cat: theory
        q: В каких единицах измеряется освещённость?
        opts: ['В люксах (лк)', 'В децибелах', 'В гектопаскалях', 'В зивертах']
        ans: a
        hint: Обозначение — «лк».
        explain: 'Освещённость измеряется в люксах.'
        src: b07
      - type: single
        cat: theory
        q: Когда на ранней стадии астигматизма зрение ухудшается сильнее?
        opts: ['В тёмное время суток, когда зрачок шире', 'В полдень', 'Только при чтении', 'Только на высоте']
        ans: a
        hint: Связано с размером зрачка.
        explain: 'Симптомы ранней стадии усугубляются в темноте, когда зрачок расширяется.'
        src: b09

  - id: hpm-l2-other
    title: Костно-мышечная, мочевыделительная и эндокринная системы
    pages: [b09, b10, b11]
    theory:
      - kind: definition
        title: Костно-мышечная система
        body: |
          Функции: **опора, передвижение и защита**.

          **Остеохондроз позвоночника** — дегенеративные изменения межпозвонковых дисков, суставов, связок. Факторы риска: избыточная статическая или динамическая нагрузка (подъём тяжестей), наследственность, травмы позвоночника. Главный симптом — **боль**: болезненный спазм мышц с нарушением их функции.

          **Межпозвоночная грыжа** — растяжение или разрыв диска, чаще от резких нагрузок; самая частая — **поясничная**. Факторы риска: ручной труд, **длительное вождение транспорта**, работа с наклонами и поворотами. Главный симптом — сильная боль.

          **Радикулит** — повреждение нервного корешка: боль и снижение двигательной функции.
        src: b09
      - kind: definition
        title: Мочевыделительная система и мочекаменная болезнь
        body: |
          Состоит из почек, мочеточников, мочевого пузыря и мочеиспускательного канала.

          **Мочекаменная болезнь** — хроническое заболевание с образованием камней в почках и мочевых путях. Обычно протекает без симптомов, пока камень не начнёт двигаться; застрявший в мочеточнике камень вызывает **резкую боль** в боку, спине, внизу живота, паху и жжение при мочеиспускании.

          Причины: нарушения обмена веществ; нерациональное питание; **недостаток жидкости** (минимум для здорового человека — 1,5 л в сутки, при мочекаменной болезни — не менее 2,5 л); жёсткая вода; малоподвижность; сухой жаркий климат и перегревания.
        src: b10
      - kind: definition
        title: Эндокринная система — щитовидная железа
        body: |
          - **Гипотиреоз** — мало гормонов щитовидной железы. Симптомы: утомляемость, слабость, рост массы тела, сонливость, отёки, выпадение волос.
          - **Тиреотоксикоз (гипертиреоз)** — избыток гормонов и их токсическое действие. Симптомы: потеря веса, тахикардия и сбои ритма, потливость, тревожность, нарушения сна, увеличение железы и «увеличение глаз».
        src: b10
    questions:
      - type: multiple
        cat: theory
        q: Какие функции выполняет костно-мышечная система?
        opts: ['Опора', 'Передвижение', 'Защита', 'Газообмен']
        ans: [a, b, c]
        hint: Газообмен — функция лёгких.
        explain: 'Функции костно-мышечной системы — опора, передвижение и защита.'
        src: b09
      - type: single
        cat: theory
        q: Какой отдел позвоночника чаще всего поражает межпозвоночная грыжа?
        opts: ['Поясничный', 'Шейный', 'Грудной', 'Крестцовый']
        ans: a
        hint: Он несёт наибольшую нагрузку при сидении.
        explain: 'Чаще всего грыжа возникает в поясничном отделе, реже — в шейном и грудном.'
        src: b09
      - type: single
        cat: theory
        q: Сколько жидкости в сутки рекомендуется пить при мочекаменной болезни?
        opts: ['Не менее 2,5 л', 'Не более 0,5 л', 'Ровно 1 л', 'Пить не нужно']
        ans: a
        hint: Здоровому — минимум 1,5 л.
        explain: 'Минимум для здорового — 1,5 л в сутки, при мочекаменной болезни — не менее 2,5 л.'
        src: b10
      - type: matching
        cat: theory
        q: Сопоставьте состояние щитовидной железы и симптом.
        pairs:
          - ['Гипотиреоз', 'Рост массы тела и сонливость']
          - ['Тиреотоксикоз', 'Потеря веса и тахикардия']
        hint: «Гипо» — мало гормонов, обмен замедлен.
        explain: 'При гипотиреозе обмен замедлен (вес растёт, сонливость); при тиреотоксикозе ускорен (потеря веса, тахикардия).'
        src: b10
      - type: multiple
        cat: theory
        q: Какие факторы риска межпозвоночной грыжи названы в лекции?
        opts: ['Длительное вождение транспорта', 'Ручной труд', 'Работа с наклонами и поворотами', 'Регулярное плавание']
        ans: [a, b, c]
        hint: Все они нагружают позвоночник.
        explain: 'Факторы риска: ручной труд, длительное вождение, работа с наклонами и вращениями.'
        src: b09
      - type: single
        cat: theory
        q: Когда мочекаменная болезнь обычно начинает проявляться болью?
        opts: ['Когда камень начинает двигаться или застревает в мочеточнике', 'Сразу при образовании камня', 'Только после полёта', 'Никогда']
        ans: a
        hint: Камень блокирует отток мочи.
        explain: 'Болезнь обычно бессимптомна, пока камень не начнёт перемещаться или не застрянет в мочеточнике.'
        src: b10
