topics:
  - id: hpm-l2-ear
    title: Орган слуха и равновесия, баротравма уха, аэроотит
    pages: [b01, b02]
    theory:
      - kind: definition
        title: Строение уха и вестибулярный аппарат
        body: |
          Ухо состоит из трёх отделов: **наружное**, **среднее** и **внутреннее** ухо.

          **Вестибулярный аппарат** — орган равновесия, часть внутреннего уха. Функция: воспринимать изменения положения головы и тела в пространстве и направление движения тела.
        src: b01
      - kind: definition
        title: Баротравма уха
        body: '**Баротравма уха** — механическое повреждение стенок барабанной полости из-за внезапных или больших перепадов внешнего давления (повышения или понижения). Тяжёлая форма — **разрыв барабанной перепонки**.'
        src: b01
      - kind: list
        title: Клиническая картина баротравмы уха
        body: |
          Общие симптомы: заложенность уха, шум в ухе, понижение слуха.

          - **Первая** — заложенность, снижение слуха, чувство давления в ухе
          - **Вторая** — сильная боль в ухе, шум
          - **Третья** — чувство переливания жидкости, тепла и выход крови из уха
        src: b01
      - kind: list
        title: Причины и факторы риска
        body: |
          **Причины:** полёты — у лётчиков при скоростных подъёмах и спусках (пикировании); разгерметизация кабины или салона при авариях; удары; взрывы и выстрелы.

          **Факторы риска:** закрытие слухового прохода серными пробками или инородными телами; дефекты среднего уха; заболевания носа — ринит, синуситы, искривление перегородки.
        src: b01
      - kind: definition
        title: Аэроотит
        body: '**Аэроотит** — воспаление слизистой оболочки среднего уха вследствие баротравмы (у лётчиков, водолазов). Симптомы: боли, заложенность, нарушения слуха и шум, возможны головокружение и общее недомогание.'
        src: b02
      - kind: note
        title: 'Дополнение: как выровнять давление в ухе'
        body: 'В справочнике FAA для пилотов: чтобы выровнять давление в среднем ухе при снижении, нужно зажать нос, закрыть рот и **медленно и мягко** выдохнуть в нос (так называемый приём Вальсальвы); помогают также глотание и зевота. Не стоит летать при насморке или аллергическом отёке носа — они закрывают слуховую трубу. **Этого нет в лекции.**'
        src: b01
        web: [*phak]
    questions:
      - type: sequence
        cat: theory
        q: Расположите отделы уха снаружи внутрь.
        seq: ['Наружное ухо', 'Среднее ухо', 'Внутреннее ухо']
        hint: Вестибулярный аппарат — в последнем.
        explain: 'Наружное → среднее → внутреннее; вестибулярный аппарат — часть внутреннего уха.'
        src: b01
      - type: single
        cat: theory
        q: Частью какого отдела уха является вестибулярный аппарат?
        opts: ['Внутреннего уха', 'Наружного уха', 'Среднего уха', 'Барабанной перепонки']
        ans: a
        hint: Он находится глубже всего.
        explain: 'Вестибулярный аппарат — орган равновесия, часть внутреннего уха.'
        src: b01
      - type: matching
        cat: theory
        q: Сопоставьте степень баротравмы уха и её признаки.
        pairs:
          - ['Первая', 'Заложенность, снижение слуха, чувство давления']
          - ['Вторая', 'Сильная боль в ухе, шум']
          - ['Третья', 'Чувство переливания жидкости, выход крови из уха']
        hint: Чем выше степень, тем тяжелее повреждение.
        explain: 'Первая — заложенность; вторая — боль и шум; третья — переливание жидкости, тепло, кровь из уха.'
        src: b01
      - type: multiple
        cat: theory
        q: Какие состояния повышают риск баротравмы уха?
        opts: ['Ринит и синусит', 'Искривление носовой перегородки', 'Серные пробки', 'Хорошая проходимость носа']
        ans: [a, b, c]
        hint: Всё, что мешает выравниванию давления.
        explain: 'Факторы риска: закрытие слухового прохода, дефекты среднего уха, ринит, синусит, искривление перегородки.'
        src: b01
      - type: single
        cat: theory
        q: Что такое аэроотит?
        opts: ['Воспаление слизистой среднего уха вследствие баротравмы', 'Воспаление наружного слухового прохода от холода', 'Укачивание в самолёте', 'Опухоль внутреннего уха']
        ans: a
        hint: «Аэро» — от перепадов давления в полёте.
        explain: 'Аэроотит — воспаление слизистой оболочки среднего уха вследствие баротравмы.'
        src: b02
      - type: single
        cat: theory
        q: 'Почему не рекомендуется летать с насморком? (дополнение FAA)'
        opts: ['Отёк закрывает путь для выравнивания давления в среднем ухе и пазухах', 'Насморк усиливает перегрузки', 'Насморк снижает парциальное давление кислорода', 'Это запрещено только пассажирам']
        ans: a
        hint: Воздух должен проходить из носоглотки в среднее ухо.
        explain: 'При отёке слизистой давление в среднем ухе и пазухах не выравнивается, растёт риск баротравмы.'
        src: b01
        web: [*phak]

  - id: hpm-l2-cardio-angina
    title: Сердечно-сосудистая система и стенокардия
    pages: [b02, b03]
    theory:
      - kind: definition
        title: Сердечно-сосудистая система
        body: |
          Состоит из **сердца** и **сосудов** — артерий, вен и капилляров.
          - **Артерии** несут кровь **от сердца**.
          - **Вены** несут кровь **к сердцу**.

          В большом круге кровообращения по артериям идёт кровь, богатая кислородом, а по венам — бедная кислородом и богатая углекислым газом. В малом (лёгочном) круге — наоборот: лёгочная артерия несёт венозную кровь к лёгким, лёгочные вены — артериальную к сердцу.
        src: b02
        errata: [hpm-e03]
      - kind: definition
        title: Стенокардия
        body: '**Стенокардия** — сердечное заболевание с внезапными приступами боли в груди, особенно при физической нагрузке или ходьбе. Боль сжимающая, давящая, распирающая, жгучая; может отдавать в левое плечо, руку, шею, нижнюю челюсть.'
        src: b02
      - kind: list
        title: Характеристика боли при стенокардии
        body: |
          - **Локализация** — за грудиной (верхняя или средняя часть), реже слева от грудины, в эпигастрии, у левой лопатки, левого плеча
          - **Связь с нагрузкой** — начинается при нагрузке, проходит через 1–2 мин после её прекращения
          - **Иррадиация** — в левую руку, плечо, нижнюю челюсть, зубы, лопатку, спину, иногда в живот
          - **Характер** — сжимающая, давящая
          - **Продолжительность** — 2–5 мин, редко до 10 мин

          **Причины:** нарушение кровообращения в сердце, **атеросклероз** (высокий холестерин и его отложение на стенках артерий).
        src: b02
      - kind: rule
        title: Неотложная помощь при приступе стенокардии
        body: |
          - Успокоить больного, измерить давление и пульс; помочь сесть (положение полусидя) или уложить, обеспечить полный покой.
          - Дать увлажнённый кислород.
          - **Нитроглицерин** — 1 таблетка под язык; при сохранении боли — повторно через 3–5 минут. В лекции: не давать при давлении ниже 110/70 мм рт. ст.
          - Дать разжевать **0,25 г аспирина**.
        src: b03
        errata: [hpm-e04]
      - kind: note
        title: 'Уточнение: сколько таблеток нитроглицерина'
        body: 'По инструкции Mayo Clinic: при сохранении боли можно принять ещё по одной таблетке **каждые 5 минут**, но **не более 3 таблеток за 15 минут**. Если боль не прошла после третьей таблетки — сразу вызвать скорую помощь (в Узбекистане — 103). **Это уточнение не из лекции**: в лекции сказано «не более 5 раз».'
        src: b03
        web: [*mayo]
      - kind: list
        title: Профилактика стенокардии
        body: |
          1. Отказ от курения.
          2. Умеренная физическая активность.
          3. Здоровое питание: мало насыщенных жиров, трансжиров и холестерина; много фруктов, овощей, цельнозерновых продуктов и рыбы.
          4. Контроль веса — здоровый индекс массы тела.
          5. Управление стрессом.
          6. Сон 7–9 часов в сутки.
          7. Регулярный медицинский контроль.
        src: b03
    questions:
      - type: single
        cat: theory
        q: Чем артерии отличаются от вен?
        opts: ['Артерии несут кровь от сердца, вены — к сердцу', 'В артериях всегда меньше кислорода', 'Вены есть только в лёгких', 'Артерии тоньше капилляров']
        ans: a
        hint: Важно направление, а не кислород.
        explain: 'Артерии несут кровь от сердца, вены — к сердцу. Кислорода в артериальной крови много в большом круге, а лёгочная артерия несёт венозную кровь.'
        src: b02
      - type: single
        cat: theory
        q: Как долго обычно длится приступ стенокардии?
        opts: ['2–5 минут, редко до 10', 'Несколько секунд', '1–2 часа', 'Сутки']
        ans: a
        hint: Боль проходит через 1–2 минуты после прекращения нагрузки.
        explain: 'Продолжительность приступа — 2–5 мин, редко — до 10 мин.'
        src: b02
      - type: multiple
        cat: theory
        q: Куда может отдавать (иррадиировать) боль при стенокардии?
        opts: ['В левую руку и плечо', 'В нижнюю челюсть и зубы', 'В лопатку и спину', 'Только в правую ногу']
        ans: [a, b, c]
        hint: Чаще — влево и вверх.
        explain: 'Иррадиация — в левую руку, плечо, нижнюю челюсть, зубы, лопатку, спину, иногда в живот.'
        src: b02
      - type: sequence
        cat: theory
        q: Расположите действия при приступе стенокардии в порядке, данном в лекции.
        seq: ['Успокоить, измерить давление и пульс', 'Усадить полусидя или уложить, обеспечить покой', 'Дать увлажнённый кислород', 'Нитроглицерин под язык', 'Дать разжевать 0,25 г аспирина']
        hint: Сначала оценка и покой, потом лекарства.
        explain: 'Порядок в лекции: успокоить и измерить, обеспечить покой, кислород, нитроглицерин, аспирин.'
        src: b03
      - type: single
        cat: theory
        q: Что является основной причиной стенокардии по лекции?
        opts: ['Атеросклероз — отложение холестерина на стенках артерий', 'Укачивание', 'Баротравма уха', 'Недостаток витамина C']
        ans: a
        hint: Связано с холестерином.
        explain: 'Причины — нарушение кровообращения в сердце и атеросклероз.'
        src: b02
      - type: single
        cat: theory
        q: 'Сколько таблеток нитроглицерина можно принять за 15 минут по инструкции Mayo Clinic? (уточнение к лекции)'
        opts: ['Не более 3', 'Не более 5', 'Не более 10', 'Сколько угодно']
        ans: a
        hint: По одной каждые 5 минут в течение 15 минут.
        explain: 'Не более 3 таблеток за 15 минут; если боль не прошла — вызвать скорую помощь.'
        src: b03
        web: [*mayo]

  - id: hpm-l2-cardio-other
    title: Гипертония, кардиомиопатии, пороки сердца, нарушения ритма
    pages: [b03, b04, b05, b06]
    theory:
      - kind: definition
        title: Артериальная гипертензия
        body: '**Гипертония (артериальная гипертензия)** — состояние, при котором давление в сосудах регулярно превышает норму. Норма — **120/80 мм рт. ст.**; 130/80 в лекции названо высоким нормальным давлением. Гипертензия часто развивается **бессимптомно** и выявляется случайно.'
        src: b03
      - kind: list
        title: Неспецифические симптомы гипертензии
        body: 'Частые головные боли в затылке; внезапные головокружения; шум в ушах; «мушки» и туман перед глазами; ноющие ощущения за грудиной; расстройство зрения; учащённое сердцебиение; одышка при небольшой нагрузке или в покое; повышенная потливость; нарушения сна; эпизоды ухудшения координации.'
        src: b03
      - kind: list
        title: Факторы риска и профилактика гипертензии
        body: |
          **Факторы риска:** стрессы; лишний вес; гиподинамия; избыток соли; повышенный холестерин; курение и алкоголь; генетическая предрасположенность; возраст старше 50 лет; мужской пол; заболевания почек и надпочечников.

          **Профилактика:** снижение веса; ограничение соли; питание по принципам **DASH-диеты** (меньше жирной и переработанной пищи, больше овощей, фруктов, цельнозерновых); аэробные нагрузки **не менее 150 минут в неделю**; отказ от курения, ограничение алкоголя; регулярный сон и отдых.
        src: b04
      - kind: definition
        title: Кардиомиопатии
        body: '**Кардиомиопатии** — группа заболеваний, при которых повреждаются клетки сердечной мышцы (миокарда). Проявления: постоянная усталость, одышка при привычной нагрузке и в покое, боли в груди, перебои в работе сердца, приступы сердцебиения, потемнение в глазах, обмороки, отёки.'
        src: b04
      - kind: definition
        title: Врождённые пороки сердца
        body: |
          **Врождённые пороки сердца** — структурные аномалии развития сердца. Частые причины: хромосомные аномалии, вредные привычки родителей, болезни матери, запрещённые при беременности лекарства, наследственность.

          Лёгкие и умеренные пороки в первые месяцы или годы протекают без симптомов; тяжёлые — с одышкой, отёками стоп и голеней, **цианозом** (синюшностью) кожи, аритмией, кашлем.
        src: b05
      - kind: definition
        title: Нарушения ритма
        body: |
          **Аритмия** — любое нарушение регулярности или частоты нормального сердечного ритма. Функциональные нарушения:
          - **синусовая брадикардия** — ЧСС < 60 в минуту (часто у здоровых во сне, у спортсменов);
          - **синусовая тахикардия** — ЧСС 90–180 в минуту (у молодых до 200): реакция на нагрузку, эмоции, боль, лихорадку;
          - **синусовая (дыхательная) аритмия**.
        src: b05
      - kind: list
        title: Факторы риска аритмий и методы исследования
        body: |
          **Факторы риска:** любые болезни сердца и многие внесердечные (тиреотоксикоз, сахарный диабет, холецистит, ХОБЛ, болезни почек, инфекции); сильный стресс, много кофеина и других стимуляторов, недосыпание, некоторые лекарства; нарушения электролитного баланса (магний, калий, натрий, кальций).

          **Методы исследования в кардиологии:** анализы крови, УЗИ щитовидной железы и почек, допплер сосудов почек, электрокардиография (ЭКГ), УЗИ сердца, холтеровское мониторирование, нагрузочные тесты.
        src: b06
    questions:
      - type: single
        cat: theory
        q: Какое артериальное давление названо в лекции нормой?
        opts: ['120/80 мм рт. ст.', '140/90 мм рт. ст.', '90/60 мм рт. ст.', '160/100 мм рт. ст.']
        ans: a
        hint: Классическая «норма».
        explain: 'В лекции норма — 120/80 мм рт. ст.'
        src: b03
      - type: single
        cat: theory
        q: Почему гипертензию часто выявляют случайно?
        opts: ['Она часто развивается бессимптомно', 'Её невозможно измерить', 'Она бывает только ночью', 'Она проходит за минуту']
        ans: a
        hint: Человек долго не подозревает об опасности.
        explain: 'Артериальная гипертензия достаточно часто развивается без симптомов.'
        src: b03
      - type: multiple
        cat: theory
        q: Что входит в профилактику гипертензии?
        opts: ['Ограничение соли', 'Аэробные нагрузки не менее 150 минут в неделю', 'Питание по принципам DASH-диеты', 'Больше переработанной пищи']
        ans: [a, b, c]
        hint: DASH — больше овощей и фруктов.
        explain: 'Снижение веса, ограничение соли, DASH-диета, ≥150 мин аэробной нагрузки в неделю, отказ от курения, сон.'
        src: b04
      - type: matching
        cat: theory
        q: Сопоставьте нарушение ритма и частоту сердечных сокращений.
        pairs:
          - ['Синусовая брадикардия', 'Меньше 60 в минуту']
          - ['Синусовая тахикардия', '90–180 в минуту']
        hint: «Бради» — медленно, «тахи» — быстро.
        explain: 'Брадикардия — ЧСС < 60/мин; тахикардия — 90–180/мин (у молодых до 200).'
        src: b05
      - type: single
        cat: theory
        q: Что повреждается при кардиомиопатиях?
        opts: ['Клетки сердечной мышцы (миокарда)', 'Клапаны вен ног', 'Барабанная перепонка', 'Хрусталик глаза']
        ans: a
        hint: «Мио» — мышца.
        explain: 'Кардиомиопатии — группа заболеваний с повреждением клеток миокарда.'
        src: b04
