  - id: hpm-l2-neuro
    title: Нервная система — эпилепсия и нарушения мозгового кровообращения
    pages: [b06, b07]
    theory:
      - kind: definition
        title: Эпилепсия
        body: |
          Нервная система состоит из головного и спинного мозга и нервов.

          **Эпилепсия** — хроническое заболевание головного мозга; проявляется **судорогами** и изменениями сознания (вплоть до его потери).

          **Причины:** генетические заболевания; повреждение мозга; врождённые пороки его развития; травмы головы; инсульт; инфекции и опухоли мозга.

          **Провоцирующие факторы** при некоторых видах: дефицит сна, алкоголь, **мигающий свет**, изменения температуры, громкие звуки.
        src: b06
      - kind: definition
        title: Нарушение мозгового кровообращения
        body: |
          **Нарушение мозгового кровообращения** (инсульт; cerebrovascular accident) — состояние, при котором мозг или его часть получает меньше крови, что может необратимо повредить ткань мозга. Причина — **закупорка, разрыв или спазм** артерий и вен.

          **Факторы риска:** атеросклероз; курение; сахарный диабет; повышенный холестерин; гиподинамия (сидячий образ жизни); артериальная гипертензия; заболевания сердца.
        src: b07
    questions:
      - type: single
        cat: theory
        q: Чем клинически проявляется эпилепсия?
        opts: ['Судорогами и изменениями сознания', 'Только головной болью', 'Повышением аппетита', 'Шумом в ушах']
        ans: a
        hint: Вплоть до потери сознания.
        explain: 'Эпилепсия проявляется судорогами и изменениями сознания вплоть до его потери.'
        src: b06
      - type: multiple
        cat: theory
        q: Что может спровоцировать приступ при некоторых видах эпилепсии?
        opts: ['Дефицит сна', 'Мигающий свет', 'Приём алкоголя', 'Спокойный сон 8 часов']
        ans: [a, b, c]
        hint: 'Особенно важно для лётной работы: вспышки света в кабине.'
        explain: 'Провоцируют дефицит сна, алкоголь, мигающий свет, изменения температуры, громкие звуки.'
        src: b06
      - type: multiple
        cat: theory
        q: Почему нарушается движение крови по сосудам мозга?
        opts: ['Закупорка сосуда', 'Разрыв сосуда', 'Спазм сосуда', 'Рост парциального давления кислорода']
        ans: [a, b, c]
        hint: Три механизма.
        explain: 'Движение крови нарушается из-за закупорки, разрыва или спазма сосудов.'
        src: b07
