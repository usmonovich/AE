        steps:
          - 'Мощность дозы в полёте: $\dot H = 30 \cdot 0{,}1 = 3$ мкЗв/ч.'
          - 'Время до 100 мкЗв: $t = H/\dot H = 100/3 \approx 33$ ч.'
        answer: 'около 33 часов — как в лекции'
