topics:
  - id: hpm-l6-atmosphere
    title: Атмосфера — слои и состав
    pages: [f01, f02]
    theory:
      - kind: definition
        title: Атмосфера
        body: |
          У Земли три оболочки: твёрдая (**литосфера**), жидкая (**гидросфера**) и газообразная (**атмосфера**).

          **Атмосфера** — газообразная оболочка Земли без резкой верхней границы; среда полётов ракет, самолётов, вертолётов, планеров. Её состояние ограничивает максимальную высоту и скорость полёта. Состояние атмосферы описывают **метеорологические элементы**: давление, температура и влажность, направление и скорость ветра, облачность, видимость, осадки.
        src: f01
      - kind: text
        title: Слои атмосферы
        body: |
          По таблице лекции:

          - **Тропосфера** (0–12 км; от +20 до −55 °C): ~90% водяного пара, ~80% массы атмосферы; температура падает на 0,65 °C на 100 м; облака.
          - **Стратосфера** (12–50 км; от −55 до 0 °C): ~20% массы; температура растёт с высотой; перламутровые облака; **озоновый слой**; верхняя граница биосферы.
          - **Мезосфера** (50–90 км; от 0 до −90 °C): ~0,3% массы; температура падает на 0,3 °C на 100 м.
          - **Термосфера** (90–500 км; от −90 до +1200 °C): ~0,05% массы; ионизация воздуха (полярное сияние).
          - **Экзосфера** (500–2500 км; от +1200 до +2500 °C): очень разрежена; радиационные пояса.
        src: f01
      - kind: definition
        title: Гомосфера и гетеросфера
        body: |
          - **Гомосфера** — от поверхности до ~**100 км**: процентное содержание основных газов и молекулярная масса воздуха не меняются с высотой.
          - **Гетеросфера** — выше 100 км: тяжёлых газов меньше, лёгких больше; под действием рентгеновского и ультрафиолетового излучения Солнца молекулы распадаются на атомы, возникают ионы и электроны.
        src: f01
      - kind: list
        title: Состав воздуха
        body: |
          **Постоянные газы:** азот — 78,08%, кислород — 20,95%, аргон — 0,93%, а также гелий, водород, неон, криптон, ксенон. До 100 км проценты постоянны, но **концентрация убывает вместе с плотностью**: выше 4–5 км кислорода мало, и человек испытывает кислородное голодание.

          **Переменные газы (примеси):** водяной пар, озон, углекислый газ, оксиды азота и серы. Пар, CO₂ и озон сильно поглощают инфракрасное излучение Земли (особенно 5,5–7 мкм и более 17 мкм); волны 8,5–12 мкм почти не поглощаются — это **«окна прозрачности атмосферы»**.
        src: f02
    questions:
      - type: matching
        cat: theory
        q: Сопоставьте слой атмосферы и его особенность.
        pairs:
          - ['Тропосфера', 'Около 80% массы атмосферы, облака']
          - ['Стратосфера', 'Озоновый слой']
          - ['Термосфера', 'Ионизация воздуха, полярное сияние']
          - ['Экзосфера', 'Радиационные пояса']
        hint: Озон — в стратосфере.
        explain: 'Тропосфера — масса и облака; стратосфера — озон; термосфера — ионизация; экзосфера — радиационные пояса.'
        src: f01
      - type: sequence
        cat: theory
        q: Расположите слои атмосферы снизу вверх.
        seq: ['Тропосфера', 'Стратосфера', 'Мезосфера', 'Термосфера', 'Экзосфера']
        hint: Тропосфера начинается у земли.
        explain: 'Тропосфера (0–12 км) → стратосфера (12–50) → мезосфера (50–90) → термосфера (90–500) → экзосфера.'
        src: f01
      - type: numeric
        cat: problem
        q: 'В тропосфере температура падает на 0,65 °C на каждые 100 м. У земли +15 °C. Какая температура на высоте 3000 м?'
        num: { value: -4.5, unit: '°C', check: '15-0.65*3000/100', tolAbs: 0.05 }
        hint: '3000 м — это 30 раз по 100 м.'
        explain: '$15 - 0{,}65 \cdot 30 = 15 - 19{,}5 = -4{,}5$ °C.'
        sol: { method: 'Линейное падение температуры.', steps: ['$\Delta T = 0{,}65 \cdot \dfrac{3000}{100} = 19{,}5$ °C', '$T = 15 - 19{,}5 = -4{,}5$ °C'], answer: '−4,5 °C' }
        src: f01
      - type: single
        cat: theory
        q: Какой процент воздуха (по объёму) составляет кислород?
        opts: ['20,95%', '78,08%', '0,93%', '50%']
        ans: a
        hint: 78,08% — это азот.
        explain: 'Азот — 78,08%, кислород — 20,95%, аргон — 0,93%.'
        src: f02
      - type: single
        cat: theory
        q: Что такое гомосфера?
        opts: ['Слой до ~100 км, где процентный состав газов не меняется с высотой', 'Слой выше 100 км с меняющимся составом', 'Озоновый слой', 'Слой облаков']
        ans: a
        hint: «Гомо» — одинаковый.
        explain: 'В гомосфере (до ~100 км) процентное содержание основных газов постоянно.'
        src: f01
      - type: single
        cat: theory
        q: Почему выше 4–5 км человек испытывает кислородное голодание, хотя доля кислорода та же?
        opts: ['Концентрация газов убывает вместе с плотностью атмосферы', 'Кислород превращается в озон', 'Доля кислорода падает до 5%', 'Кислород уходит в гетеросферу']
        ans: a
        hint: Процент тот же, но молекул в каждом вдохе меньше.
        explain: 'Проценты постоянны до 100 км, но плотность воздуха и концентрация кислорода с высотой падают.'
        src: f02
      - type: single
        cat: theory
        q: Что называют «окнами прозрачности атмосферы»?
        opts: ['Участки спектра (8,5–12 мкм), которые атмосфера почти не поглощает', 'Разрывы в облаках', 'Озоновые дыры', 'Слои без кислорода']
        ans: a
        hint: Эти волны уходят в космос.
        explain: 'Инфракрасные волны 8,5–12 мкм почти не поглощаются и уходят в космос.'
        src: f02

  - id: hpm-l6-ozone
    title: Озон — озоновый слой и озон в кабине
    pages: [f02, f03, f04]
    theory:
      - kind: definition
        title: Озон и озоновый слой
        body: |
          **Озон (O₃)** — молекула из **трёх атомов кислорода**; бесцветный газ с характерным запахом, очень сильный окислитель, **ядовит**. Образуется из кислорода под действием ультрафиолета Солнца (на высоте 10–30 км) и при грозовых разрядах.

          Основная масса озона — в **стратосфере** («озоносфере»); наибольшая концентрация — на высоте около **20–25 км** («озоновый экран»). Но даже там озона всего несколько миллионных долей — основная часть кислорода остаётся в виде O₂.
        src: f02
        errata: [hpm-e14]
      - kind: note
        title: 'Уточнение: где находится озон'
        body: 'По данным NOAA, около **90%** атмосферного озона находится в стратосфере и около **10%** — в тропосфере; наибольшая концентрация — в слое примерно 15–35 км. У земли озона — миллиардные доли объёма (в лекции ошибочно сказано «5% по объёму»). **Это уточнение не из лекции.**'
        src: f02
        web: [*noaa]
      - kind: list
        title: Роль озона и ультрафиолет
        body: |
          1. Озон не пропускает к земле губительный ультрафиолет с длиной волны меньше ~0,29 мкм (290 нм).
          2. Поглощая излучение, нагревает воздух: на высоте ~50 км — максимум температуры (около −2,5 °C).
          3. Задерживает часть инфракрасного излучения Земли — без озона Земля была бы холоднее.

          - **УФ-C (100–280 нм)** почти полностью поглощается кислородом (100–200 нм) и озоном (200–280 нм).
          - **УФ-B (280–315 нм)** большей частью задерживается озоном; остаток вызывает солнечные ожоги и повреждает ДНК, но он же нужен для выработки витамина D.
          - **УФ-A (315–400 нм)** озон почти не задерживает — большая часть доходит до земли.

          Пик поглощения озона — около **250 нм**. Содержание озона меняется по сезонам и широте; разрушение озонового слоя связано с деятельностью человека.
        src: f03
      - kind: list
        title: Озон в кабине и здоровье пилота
        body: |
          На крейсерских высотах (выше 9–10 км) концентрация озона резко растёт; он может попасть в кабину через систему кондиционирования. Действие усиливают **низкое давление и очень сухой воздух** кабины.
          - **Дыхание:** раздражение слизистых, першение, сухой кашель, жжение в груди, затруднённое дыхание, снижение функции лёгких (что усиливает высотную гипоксию).
          - **Глаза и нервная система:** резь в глазах, слезотечение, головная боль, утомляемость, головокружение, медленнее реакции, хуже внимание.
          - **Скрытая опасность:** обоняние быстро **привыкает** к запаху озона — пилот перестаёт его замечать.
          - **Хронически:** бронхит, снижение иммунитета, ускоренное старение лёгочной ткани.

          **Защита:** воздух для кабины отбирается от компрессоров двигателей и проходит через **каталитические конвертеры озона**, которые при высокой температуре разлагают O₃ на O₂.
        src: f03
    questions:
      - type: single
        cat: theory
        q: Из скольких атомов кислорода состоит молекула озона?
        opts: ['Из трёх', 'Из двух', 'Из одного', 'Из четырёх']
        ans: a
        hint: Формула — O₃.
        explain: 'Озон — трёхатомный кислород O₃.'
        src: f02
      - type: single
        cat: theory
        q: На какой высоте находится слой максимальной концентрации озона (по лекции)?
        opts: ['Около 20–25 км', 'Около 1 км', 'Около 100 км', 'Около 500 км']
        ans: a
        hint: Это стратосфера.
        explain: 'Озоновый экран — на высоте около 20–25 км.'
        src: f02
      - type: matching
        cat: theory
        q: Сопоставьте полосу ультрафиолета и то, что с ней происходит в атмосфере.
        pairs:
          - ['УФ-C (100–280 нм)', 'Почти полностью поглощается кислородом и озоном']
          - ['УФ-B (280–315 нм)', 'В основном задерживается озоном, остаток вызывает ожоги']
          - ['УФ-A (315–400 нм)', 'Почти не задерживается озоном']
        hint: Чем короче волна, тем сильнее поглощается.
        explain: 'УФ-C поглощается полностью, УФ-B — большей частью, УФ-A доходит до земли.'
        src: f03
      - type: single
        cat: theory
        q: Как в современных лайнерах защищают экипаж от озона?
        opts: ['Каталитическими конвертерами, разлагающими O₃ на O₂', 'Открытием форточек', 'Кислородными масками всё время полёта', 'Никак']
        ans: a
        hint: Воздух проходит через устройство при высокой температуре.
        explain: 'Каталитические конвертеры озона разлагают O₃ на безопасный O₂ до того, как воздух попадёт в кабину.'
        src: f03
      - type: single
        cat: theory
        q: В чём «скрытая опасность» озона для пилота?
        opts: ['Обоняние быстро привыкает к его запаху', 'Он бесшумно взрывается', 'Он невидим на радаре', 'Он вызывает перегрузки']
        ans: a
        hint: Пилот перестаёт замечать газ.
        explain: 'Организм быстро теряет способность чувствовать запах озона, хотя вредное действие продолжается.'
        src: f03
      - type: multiple
        cat: theory
        q: Как озон действует на организм пилота?
        opts: ['Раздражает дыхательные пути, вызывает сухой кашель', 'Вызывает резь в глазах и слезотечение', 'Снижает скорость реакции и внимание', 'Повышает остроту зрения']
        ans: [a, b, c]
        hint: Озон — сильный окислитель.
        explain: 'Озон раздражает дыхательные пути и глаза, вызывает головную боль, утомляемость, замедляет реакции.'
        src: f03
      - type: single
        cat: theory
        q: 'Какая доля атмосферного озона находится в стратосфере по данным NOAA? (уточнение к лекции)'
        opts: ['Около 90%', 'Около 10%', 'Около 50%', 'Около 5%']
        ans: a
        hint: В тропосфере — оставшиеся 10%.
        explain: 'Около 90% озона — в стратосфере, около 10% — в тропосфере.'
        src: f02
        web: [*noaa]

  - id: hpm-l6-radiation
    title: Радиация в полёте и её действие на организм
    pages: [f04, f05, f06]
    theory:
      - kind: text
        title: Радиация на высоте полёта
        body: |
          Самолёты летают на высоте около 10 км; высоту атмосферы принимают за 100 км. Самый опасный ультрафиолет УФ-C полностью поглощается выше 35 км, УФ-B на 99% задерживается озоновым слоем.

          **Мощность дозы** у поверхности Земли — около **0,1 мкЗв/ч**; в полёте она возрастает в **30–40 раз**. На высотах 9000–12 000 м дозы экипажей превышают естественный фон:

          | Высота | Во сколько раз выше фона |
          |---|---|
          | 9000 м | в 31 раз |
          | 11 000 м | в 35 раз |
          | 12 000 м | в 41 раз |

          **Солнечные вспышки** на 10–12 км на несколько часов повышают мощность дозы — от 0,7 до 200 мбэр/ч, иногда до 2000 мбэр/ч.
        src: f04
      - kind: definition
        title: Единицы дозы
        body: |
          - Доза облучения измеряется в **зивертах**: 1 Зв = 1000 мЗв; 1 мЗв = 1000 мкЗв.
          - Мощность дозы — доза за час: мкЗв/ч.
          - Старая единица — бэр: **1 мбэр = 10 мкЗв**.

          Пример из лекции: рентген грудной клетки — около 0,1 мЗв (100 мкЗв); такую дозу пассажир набирает примерно за **33 часа** полёта.
        src: f04
        errata: [hpm-e15]
      - kind: list
        title: Нормативы (по лекции) и уточнение
        body: 'В лекции приведены нормативы: для лётчиков — 5 мЗв в год, при работе на АЭС — 20 мЗв в год, для космонавтов — 500 мЗв в год.'
        src: f04
        errata: [hpm-e16, hpm-e17]
      - kind: note
        title: 'Уточнение: сколько получают люди и экипажи'
        body: |
          **Этих данных нет в лекции.**
          - От природных источников человек получает в среднем около **2,4 мЗв в год**: около 2 мЗв от земных источников и 0,4 мЗв — от космических (ICRP).
          - Средняя доза экипажей — **менее 1 мЗв в год**; на дальних полярных рейсах — около **6 мЗв в год**. Предел для профессионального облучения — **20 мЗв в год** (МАГАТЭ).
        src: f04
        web: [*icrp, *iaea]
      - kind: list
        title: Накопление дозы
        body: 'Однократный полёт для пассажира не опасен, специальное восстановление не нужно. Но доза **накапливается**: она растёт пропорционально времени в воздухе, поэтому для экипажей важен **налёт часов**. В лекции приводятся данные исследований: у бортпроводниц с налётом более 15 лет рак молочной железы встречается на 30% чаще, у пилотов с налётом более 5000 часов на 20–30% чаще встречаются лейкемия и меланома.'
        src: f05
      - kind: list
        title: Как радиация повреждает клетки
        body: |
          Ионизирующее излучение повреждает атомы и молекулы клеток; вред зависит от **дозы, времени и типа излучения** (альфа, бета, гамма, нейтронное).
          - **Ионизация воды:** излучение расщепляет молекулы воды на агрессивные **свободные радикалы** (OH, H), разрушающие белки и клеточные структуры.
          - **Повреждение ДНК:** разрывы цепочек → мутации, гибель клеток или их бесконтрольное деление.
          - **Наиболее уязвимы** быстро делящиеся клетки: красный костный мозг, эпителий кишечника, половые железы, щитовидная железа.
        src: f05
        errata: [hpm-e18]
      - kind: note
        title: 'Уточнение: сколько воды в организме'
        body: 'У взрослых вода составляет в среднем около **50–60% массы тела** (у мужчин больше, у женщин меньше), а не «более 80%», как в лекции. **Это уточнение не из лекции.**'
        src: f05
        web: [*water]
      - kind: list
        title: Влияние доз радиации
        body: |
          - **До 1 Зв** — скрытые изменения в клетках, рост риска опухолей и мутаций в будущем
          - **1–2 Зв** — порог острой лучевой болезни: лёгкая форма, тошнота, слабость, изменения крови
          - **3–5 Зв** — без лечения — гибель около 50% пострадавших за 1–2 месяца (поражение костного мозга)
          - **10–50 Зв** — кишечный и церебральный синдромы, гибель за 1–2 недели или быстрее

          При превышении допустимых доз: мутации, онкологические заболевания, нарушения обмена, обострение инфекций, лучевая болезнь, лучевое бесплодие, **лучевая катаракта**. Облучение особенно опасно для детей (делящиеся клетки).
        src: f06
