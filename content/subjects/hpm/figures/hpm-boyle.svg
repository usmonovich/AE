<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" font-family="inherit"><title>Закон Бойля — Мариотта: пузырь газа в кишечнике при подъёме. Давление стандартной атмосферы 1013 → 753 → 506 → 265 гПа (0; 2440; 5500; 10 000 м), объём V = V₀·p₀/p растёт в 1,35; 2,0 и 3,8 раза</title><path class="s-mute" d="M50,210V30" stroke-width="1.5"/><path class="s-mute" d="M46,210H54" stroke-width="1.5"/><text class="t-s" x="42" y="214" text-anchor="end">0</text><path class="s-mute" d="M46,170.07H54" stroke-width="1.5"/><text class="t-s" x="42" y="174.07" text-anchor="end">2,4 км</text><path class="s-mute" d="M46,120H54" stroke-width="1.5"/><text class="t-s" x="42" y="124" text-anchor="end">5,5 км</text><path class="s-mute" d="M46,46.36H54" stroke-width="1.5"/><text class="t-s" x="42" y="50.36" text-anchor="end">10 км</text><text class="t-s" x="50" y="20" text-anchor="middle">высота</text><circle class="f-red" cx="50" r="6"><animate attributeName="cy" values="210;210;170.07;170.07;120;120;46.36;46.36;210" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="12s" repeatCount="indefinite"/></circle><circle class="s-acc" cx="235" cy="125" r="30" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/><circle class="s-acc" cx="235" cy="125" stroke-width="2.6" fill="none"><animate attributeName="r" values="30;30;33.12;33.12;37.81;37.81;46.91;46.91;30" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="12s" repeatCount="indefinite"/></circle><text class="t-acc" x="235" y="130" text-anchor="middle">газ</text><g opacity="0"><animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="12s" repeatCount="indefinite"/><text class="t" x="330" y="60" text-anchor="middle">0 м</text><text class="t-s" x="330" y="84" text-anchor="middle">p = 1013 гПа</text><text class="t-red" x="330" y="108" text-anchor="middle">V = 1,00 V<tspan baseline-shift="sub" font-size="0.72em">0</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="12s" repeatCount="indefinite"/><text class="t" x="330" y="60" text-anchor="middle">2 440 м</text><text class="t-s" x="330" y="84" text-anchor="middle">p = 753 гПа</text><text class="t-red" x="330" y="108" text-anchor="middle">V = 1,35 V<tspan baseline-shift="sub" font-size="0.72em">0</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="12s" repeatCount="indefinite"/><text class="t" x="330" y="60" text-anchor="middle">5 500 м</text><text class="t-s" x="330" y="84" text-anchor="middle">p = 506 гПа</text><text class="t-red" x="330" y="108" text-anchor="middle">V = 2,00 V<tspan baseline-shift="sub" font-size="0.72em">0</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.2;0.25;0.45;0.5;0.7;0.75;0.95;1" dur="12s" repeatCount="indefinite"/><text class="t" x="330" y="60" text-anchor="middle">10 000 м</text><text class="t-s" x="330" y="84" text-anchor="middle">p = 265 гПа</text><text class="t-red" x="330" y="108" text-anchor="middle">V = 3,82 V<tspan baseline-shift="sub" font-size="0.72em">0</tspan></text></g><text class="t-s" x="235" y="226" text-anchor="middle">p·V = const: давление падает — объём растёт</text></svg>
