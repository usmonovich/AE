errata:
  - id: ct-e01
    page: a04
    severity: unclear
    target: direction of the electric current
    original: 'Slides L1·4–L1·8: «Electric current = directional motion of electrons»; slide L1·10 asks «What is the direction of the electric current?» without an answer.'
    issue: 'Circuit analysis uses conventional current: it is defined as the direction in which positive charge would move, i.e. opposite to the motion of electrons in a metal wire. The slides do not state this.'
    suggestion: 'Add: «the direction of conventional current is opposite to electron flow». In the app this is a separate note with a source (OpenStax University Physics 2, §9.1).'
  - id: ct-e02
    page: b31
    severity: typo
    target: slide title
    original: '«APPLICATION LIGHTNING BULBS»'
    issue: 'Lightning (молния) instead of lighting (освещение).'
    suggestion: '«Application: lighting bulbs».'
  - id: ct-e03
    page: b54
    severity: note
    target: rounding in the light-bulb example
    original: '$I_2 = 5 - 2.222 = 2.778$ A, but $R_2 = 15/2.777^2$ and $R_3 = 10/2.777^2$.'
    issue: 'The same current is rounded in two different ways (2.778 and 2.777). The results 1.945 Ω and 1.297 Ω are still correct to three digits.'
    suggestion: 'Use $I_2 = 25/9 \approx 2.778$ A everywhere: $R_2 \approx 1.944$ Ω, $R_3 \approx 1.296$ Ω.'
  - id: ct-e04
    page: e05
    severity: note
    target: op-amp gain notation
    original: '$A = 200.000\ (\sim 10^5 \div 10^6)$'
    issue: 'A dot is used as a thousands separator (European style): 200.000 means two hundred thousand, not two hundred.'
    suggestion: 'Write $A = 200\,000$ or $2\times10^5$.'
  - id: ct-e05
    page: s05
    severity: note
    target: percent error formula in the labs
    original: '$\frac{\text{Measured} - \text{Theoretical}}{\text{Theoretical}} \times 100 = \text{Percent Error}$'
    issue: 'The formula gives a signed value. Percent error is often reported as an absolute value; a negative result only means that the measured value is below the theoretical one.'
    suggestion: 'State whether the sign should be kept, or use $\left|\frac{\text{Measured}-\text{Theoretical}}{\text{Theoretical}}\right|\times100\%$.'
  - id: ct-e06
    page: q01
    severity: unclear
    target: title of PS02
    original: 'PS02 has the same title as PS01: «Solution of circuits by reduction. Voltage and current division rules».'
    issue: 'PS02 actually contains other exercises (equivalent resistance of a resistor network and two circuits with sources).'
    suggestion: 'Rename PS02 according to its content.'
  - id: ct-e07
    page: e01
    severity: typo
    target: spelling on title slides
    original: '«Mechanical ad Aerospace Engineering» (L5·1, L6·1), «Indcutors» (L6·1), «CONTRLLED SOURCES» (PS5·5).'
    issue: 'Spelling mistakes.'
    suggestion: '«Mechanical and Aerospace Engineering», «Inductors», «Controlled sources».'
