# ⚡ Circuit Theory — course structure, source files, errata.
# Source: 6 lecture presentations and 7 practice files by Sarvar Ruzimov (course [AE-26-II] Circuit Theory, edu.turin.uz),
# downloaded by the owner on 01.11.2026. Content in English, as the owner asked.
# A page = a slide (PDF page). Prefixes: a–f — Lectures 1–6; p — PS01, q — PS02, r — PS03, s — PS03 Lab-1,
# t — PS04, u — PS04 Lab-2, v — PS05. Example: c13 = Lecture 3, PDF page 13.
# Pages left out: exact duplicates (b52, c34, d15, d18, d28, d31, d44) and the closing pictures (b55, c45, d45).
# Section «Foundations» is NOT from the presentations: it was added for beginners; every record there has web sources.
# IDs start with «ct-».

