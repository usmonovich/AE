        num: { value: 20, unit: 'V', check: '100*0.5*40/100' }
        hint: '$(60 + 40)\parallel100 = 50\ \Omega$.'
        explain: 'Node voltage $50$ V, then $v_1 = 50\cdot40/100 = 20$ V.'
        fromSource: true
