      - type: numeric
        cat: problem
        q: 'PS02: a $10$ V source feeds two branches: $2\ \Omega$ above $1\ \Omega$ (node A between them) and $1\ \Omega$ above $2\ \Omega$ (node B between them). Find $v_{AB}$ (V).'
        num: { value: -3.333, unit: 'V', tolAbs: 0.01, check: '10*1/3 - 10*2/3' }
        hint: 'Voltage division in each branch, measured from the bottom node.'
        explain: '$v_A = 10\cdot\frac13 = 3.33$ V, $v_B = 10\cdot\frac23 = 6.67$ V; $v_{AB} = -3.33$ V (sheet: −3.3 V).'
        sol: { method: 'Voltage divider.', steps: ['$v_A = 10\cdot1/(2+1)$', '$v_B = 10\cdot2/(1+2)$', '$v_{AB} = v_A - v_B = -3.33$ V'], answer: '≈ −3.33 V' }
