        sol: { method: 'Worked solution.', steps: ['Node voltage $50$ V, then $v_1 = 50\cdot40/100 = 20$ V.'], answer: '20 V' }
      - type: numeric
        cat: problem
        q: 'PS02: a $20$ A source feeds $60\ \Omega$ in parallel with a branch of $32\ \Omega$ in series with ($10\ \Omega \parallel 40\ \Omega$). Find the current $i_1$ through the $10\ \Omega$ (A).'
        num: { value: 9.6, unit: 'A', check: '20*60/100*40/50' }
        hint: '$32 + 10\parallel40 = 40\ \Omega$; then two current divisions.'
        explain: 'Branch current $20\cdot\frac{60}{60+40} = 12$ A; $i_1 = 12\cdot\frac{40}{10+40} = 9.6$ A (sheet: 9.6 A).'
        sol: { method: 'Current division twice.', steps: ['$10\parallel40 = 8$; $32 + 8 = 40\ \Omega$', '$i_{40} = 20\cdot60/100 = 12$ A', '$i_1 = 12\cdot40/50 = 9.6$ A'], answer: '9.6 A' }
        fromSource: true
        src: q04
      - type: numeric
        cat: problem
        q: 'PS03, Exercise 9: $10$ V source, $2\ \Omega$ ($v_1$), $8\ \Omega$ ($v_2$) to ground, $4\ \Omega$ ($v_3$) to a $6$ V source. The answer sheet gives $v_2 = 4$ V. Find $i_1$ through the $2\ \Omega$ (A).'
        num: { value: 3, unit: 'A', check: '(10-4)/2' }
        hint: '$v_1 = 10 - v_2$.'
        explain: '$v_1 = 6$ V, $i_1 = 3$ A; $i_2 = 4/8 = 0.5$ A, $i_3 = i_1 - i_2 = 2.5$ A, $v_3 = 10$ V — as on the sheet.'
        sol: { method: 'KVL in the left loop + KCL.', steps: ['$v_1 = 10 - 4 = 6$ V', '$i_1 = 6/2 = 3$ A', '$i_2 = 0.5$ A, $i_3 = 2.5$ A'], answer: '3 A' }
        fromSource: true
        src: [r07, r08]
      - type: numeric
        cat: problem
        q: 'PS05: find the equivalent resistance between A and B of the network with $3\ \Omega$ (top), $1\ \Omega$ (middle), $3\ \Omega$ (right), $2\ \Omega$ and $1\ \Omega$ (vertical).'
        num: { value: 0.857, unit: 'Ω', tolAbs: 0.002, check: '1/(1/2 + 1/(0.75+0.75))' }
        hint: 'The top $3\ \Omega$ and the middle $1\ \Omega$ join the same two nodes; so do the right $3\ \Omega$ and the vertical $1\ \Omega$.'
        explain: '$3\parallel1 = 0.75$ twice; $0.75 + 0.75 = 1.5\ \Omega$; $1.5\parallel2 = 6/7 \approx 0.857\ \Omega$. (No answer on the sheet.)'
        sol: { method: 'Identify nodes, then reduce.', steps: ['$3\parallel1 = 0.75$ (between A-node and right node)', '$3\parallel1 = 0.75$ (right node to B)', '$(0.75+0.75)\parallel2 = 6/7\ \Omega$'], answer: '6/7 ≈ 0.857 Ω' }
        fromSource: true
        src: v02
      - type: numeric
        cat: problem
        q: 'PS05: in the network with the $2$ V battery, the battery drives a loop made of $3\ \Omega$ and two $2\ \Omega$ resistors in parallel (the left $2\ \Omega$ is directly across the battery). Find the magnitude of $v_2$ across the top $2\ \Omega$ resistor (V).'
        num: { value: 0.5, unit: 'V', check: '2/(3+1)*1' }
        hint: '$2\parallel2 = 1\ \Omega$; loop current $= 2/(3+1)$.'
        explain: 'Loop current $0.5$ A; the voltage across the parallel pair (and across the top resistor) is $0.5\cdot1 = 0.5$ V; $|v_1| = 1.5$ V across $3\ \Omega$. The sign of $v_2$ follows the arrow of the drawing (the right end is $0.5$ V above the left one). (No answer on the sheet.)'
        sol: { method: 'Ignore the resistor that is directly across the ideal source; reduce the rest.', steps: ['$2\parallel2 = 1\ \Omega$', '$i = 2/(3+1) = 0.5$ A', '$|v_2| = 0.5$ V, $|v_1| = 1.5$ V'], answer: '0.5 V' }
        fromSource: true
        src: v03
      - type: single
        cat: theory
        q: 'The equivalent resistance of resistors in parallel is'
        opts: ['smaller than the smallest of them', 'larger than the largest of them', 'equal to their average', 'equal to their sum']
        ans: a
        hint: 'Slide L2·24.'
        explain: '$R_{eq}$ of a parallel combination is always smaller than the smallest resistor; for $N$ equal resistors $R/N$.'
        src: b23
      - type: numeric
        cat: problem
        q: 'A current of $6$ A divides between $R_1 = 2\ \Omega$ and $R_2 = 4\ \Omega$ in parallel. Find $i_1$ (A).'
        num: { value: 4, unit: 'A', check: '6*4/6' }
        hint: '$i_1 = \frac{R_2}{R_1+R_2}i$.'
        explain: '$i_1 = 6\cdot4/6 = 4$ A, $i_2 = 2$ A: the smaller resistor takes the larger current.'
        sol: { method: 'Current divider.', steps: ['$i_1 = \frac{4}{2+4}\cdot6 = 4$ A'], answer: '4 A' }
        src: b24

  - id: ct-l2-delta-wye
    title: Delta–wye (Δ–Y) transformations
    pages: [b27, b28, b29, b30, b45, b46, b47, b48, b49]
    theory:
      - kind: definition
        title: Wye and delta connections
        body: 'Sometimes resistors are neither in series nor in parallel. Three resistors joined at a common node $n$ form a **wye (Y, star, T)** network; three resistors forming a triangle between three terminals form a **delta (Δ, pi)** network.'
        src: b27
      - kind: law
        title: Delta → wye
        body: '$R_1 = \frac{R_bR_c}{R_a+R_b+R_c}$, $R_2 = \frac{R_cR_a}{R_a+R_b+R_c}$, $R_3 = \frac{R_aR_b}{R_a+R_b+R_c}$. Each Y resistor is the product of the two adjacent Δ resistors divided by the sum of the three Δ resistors.'
        src: b28
      - kind: law
        title: Wye → delta
        body: '$R_a = \frac{R_1R_2+R_2R_3+R_3R_1}{R_1}$, $R_b = \frac{R_1R_2+R_2R_3+R_3R_1}{R_2}$, $R_c = \frac{R_1R_2+R_2R_3+R_3R_1}{R_3}$. Each Δ resistor is the sum of all products of Y resistors taken two at a time divided by the opposite Y resistor.'
        src: b29
      - kind: law
        title: Balanced networks
        body: 'If $R_1 = R_2 = R_3 = R_Y$ and $R_a = R_b = R_c = R_\Delta$ (balanced), then $R_Y = \frac{R_\Delta}{3}$, $R_\Delta = 3R_Y$.'
        src: b30
    formulas:
      - title: Δ → Y
        tex: 'R_1 = \frac{R_b R_c}{R_a + R_b + R_c},\quad R_2 = \frac{R_c R_a}{R_a + R_b + R_c},\quad R_3 = \frac{R_a R_b}{R_a + R_b + R_c}'
        src: b28
      - title: Y → Δ
        tex: 'R_a = \frac{R_1R_2 + R_2R_3 + R_3R_1}{R_1}'
        cond: 'Similarly $R_b$ (divide by $R_2$) and $R_c$ (divide by $R_3$).'
        src: b29
      - title: Balanced networks
        tex: 'R_\Delta = 3R_Y'
        src: b30
    examples:
      - title: 'Δ → Y (Example 1, slide L2·34)'
        given: '$R_a = 15\ \Omega$, $R_b = 10\ \Omega$, $R_c = 25\ \Omega$.'
        steps:
          - 'Sum $= 50\ \Omega$.'
          - '$R_1 = \frac{10\cdot25}{50} = 5\ \Omega$, $R_2 = \frac{25\cdot15}{50} = 7.5\ \Omega$, $R_3 = \frac{15\cdot10}{50} = 3\ \Omega$.'
        answer: '$R_1 = 5\ \Omega$, $R_2 = 7.5\ \Omega$, $R_3 = 3\ \Omega$'
        src: b45
      - title: 'Y → Δ and current (Example 2, slides L2·35)'
        given: '$120$ V source; network $12.5, 10, 5, 15, 20, 30\ \Omega$. Convert the Y of $5, 10, 20\ \Omega$.'
        steps:
          - '$R_1 = 10$, $R_2 = 20$, $R_3 = 5$: $\Sigma = 10\cdot20 + 20\cdot5 + 5\cdot10 = 350$.'
          - '$R_a = 350/10 = 35\ \Omega$, $R_b = 350/20 = 17.5\ \Omega$, $R_c = 350/5 = 70\ \Omega$.'
          - '$70\parallel30 = 21$, $12.5\parallel17.5 = 7.292$, $15\parallel35 = 10.5\ \Omega$.'
          - '$R_{ab} = (7.292 + 10.5)\parallel21 = 9.632\ \Omega$; $i = 120/9.632$.'
        answer: '$R_{ab} = 9.632\ \Omega$, $i = 12.458$ A'
        src: [b48, b49]
    questions:
      - type: numeric
        cat: problem
        q: 'Convert the Δ ($R_a = 15$, $R_b = 10$, $R_c = 25\ \Omega$) to Y. Find $R_2$ (Ω).'
        num: { value: 7.5, unit: 'Ω', check: '25*15/50' }
        hint: '$R_2 = R_cR_a/\Sigma$.'
        explain: '$25\cdot15/50 = 7.5\ \Omega$.'
        fromSource: true
        src: b45
        sol: { method: 'Worked solution.', steps: ['$25\cdot15/50 = 7.5\ \Omega$.'], answer: '7.5 Ω' }
      - type: numeric
        cat: problem
        q: 'Example 2 (L2·35): find the current $i$ (A).'
        num: { value: 12.458, unit: 'A', tolAbs: 0.01, check: '120/(1/(1/(12.5*17.5/30 + 15*35/50) + 1/21))' }
        hint: '$R_{ab} = 9.632\ \Omega$.'
        explain: '$i = 120/9.632 = 12.46$ A.'
        fromSource: true
        src: b49
        sol: { method: 'Worked solution.', steps: ['$i = 120/9.632 = 12.46$ A.'], answer: '12.458 A' }
      - type: numeric
        cat: problem
        q: 'A balanced Y has $R_Y = 4\ \Omega$. Find the equivalent Δ resistance (Ω).'
        num: { value: 12, unit: 'Ω', check: '3*4' }
        hint: '$R_\Delta = 3R_Y$.'
        explain: '$3\cdot4 = 12\ \Omega$.'
        src: b30
        sol: { method: 'Worked solution.', steps: ['$3\cdot4 = 12\ \Omega$.'], answer: '12 Ω' }
      - type: numeric
        cat: problem
        q: 'Y network $R_1 = 10$, $R_2 = 20$, $R_3 = 5\ \Omega$. Find $R_c$ of the equivalent Δ (Ω).'
        num: { value: 70, unit: 'Ω', check: '350/5' }
        hint: 'Divide $\Sigma R_iR_j$ by the opposite resistor $R_3$.'
        explain: '$350/5 = 70\ \Omega$.'
        fromSource: true
        src: b48
        sol: { method: 'Worked solution.', steps: ['$350/5 = 70\ \Omega$.'], answer: '70 Ω' }
      - type: single
        cat: theory
        q: 'When is a Δ–Y transformation needed?'
        opts: ['When resistors are neither in series nor in parallel', 'Only in AC circuits', 'When all resistors are equal', 'When the circuit contains a dependent source']
        ans: a
        hint: 'Slide L2·30.'
        explain: 'It lets us simplify networks (bridges, etc.) that cannot be reduced by series–parallel rules alone.'
        src: b27

  - id: ct-l2-application
    title: 'Application: light bulbs'
    pages: [b31, b50, b51, b53, b54]
    theory:
      - kind: text
        title: Resistors as models of devices
        body: 'Resistors model devices that convert electrical energy into heat or other forms of energy: wires, light bulbs, electric heaters, ovens, loudspeakers. Light bulbs may be connected in **parallel** (each bulb gets the full supply voltage; one failing bulb does not switch off the others) or in **series** (one current through all bulbs).'
        src: b31
    examples:
      - title: 'Three bulbs on a 9-V battery (Example 1, slide L2·37)'
        given: 'Bulbs of $15$ W and $10$ W in series, together in parallel with a $20$ W bulb, all on $9$ V.'
        steps:
          - 'Total power $p = 15 + 10 + 20 = 45$ W, so $I = p/V = 45/9 = 5$ A.'
          - 'The 20-W bulb ($R_1$) has the full $9$ V: $I_1 = 20/9 = 2.222$ A.'
          - 'KCL: $I_2 = I - I_1 = 2.778$ A through $R_2$ and $R_3$.'
          - '$R_1 = 20/2.222^2 = 4.05\ \Omega$, $R_2 = 15/2.778^2 = 1.944\ \Omega$, $R_3 = 10/2.778^2 = 1.296\ \Omega$.'
        answer: '$I = 5$ A; $I_1 = 2.222$ A, $I_2 = 2.778$ A; $R_1 = 4.05$, $R_2 = 1.944$, $R_3 = 1.296\ \Omega$'
        src: [b50, b53, b54]
    questions:
      - type: numeric
        cat: problem
        q: 'Three bulbs (15 W, 10 W, 20 W) take their rated power from a $9$ V battery. Find the battery current (A).'
        num: { value: 5, unit: 'A', check: '45/9' }
        hint: 'Total power / voltage.'
        explain: '$I = 45/9 = 5$ A.'
        fromSource: true
        src: b53
        sol: { method: 'Worked solution.', steps: ['$I = 45/9 = 5$ A.'], answer: '5 A' }
      - type: numeric
        cat: problem
        q: 'Same circuit: find the resistance of the 20-W bulb (Ω).'
        num: { value: 4.05, unit: 'Ω', tolAbs: 0.01, check: '9**2/20' }
        hint: 'It has the full $9$ V: $R = V^2/P$.'
        explain: '$R_1 = 81/20 = 4.05\ \Omega$ (the slide gets the same value as $20/2.222^2$).'
        fromSource: true
        src: b54
        sol: { method: 'Worked solution.', steps: ['$R_1 = 81/20 = 4.05\ \Omega$ (the slide gets the same value as $20/2.222^2$).'], answer: '4.05 Ω' }
      - type: numeric
