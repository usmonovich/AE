        explain: '$R_{ab} = 10 + 1.2 = 11.2\ \Omega$.'
        fromSource: true
        src: b44
        sol: { method: 'Worked solution.', steps: ['$R_{ab} = 10 + 1.2 = 11.2\ \Omega$.'], answer: '11.2 Ω' }
      - type: numeric
        cat: problem
        q: 'PS01: all resistors of the network are $1000\ \Omega$. Find the equivalent resistance between A and B (Ω).'
        num: { value: 631.6, unit: 'Ω', tolAbs: 1, check: '1/(1/1000 + 1/(1000 + 1/(1/1000 + 1/2500)))' }
        hint: 'The two lower-left resistors are in parallel (500 Ω); the path B–D–E–R (2500 Ω) is in parallel with the B–R resistor.'
