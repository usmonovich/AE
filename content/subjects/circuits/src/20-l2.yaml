        sol: { method: 'Identify nodes joined by wires.', steps: ['$c$–$d$, $d$–$e$, $e$–$f$ are wires ⇒ one node, connected to B.', 'Both ends of $R_2$, $R_3$, $R_4$ are on that node ⇒ no current.', '$R_{eq} = R_1 = 15\ \Omega$'], answer: '15 Ω' }
