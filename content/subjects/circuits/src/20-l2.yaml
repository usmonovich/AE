      - type: numeric
        cat: problem
        q: 'PS01, Exercise 2.6: find $R_{eq}$ (Ω) of the network with resistors $1/2, 3, 7, 6, 10, 3, 5, 1/4, 2, 1\ \Omega$.'
        num: { value: 0.4452, unit: 'Ω', tolAbs: 0.001, check: '1/(1/0.5 + 1/10 + 1/(6 + 1/(1/10 + 1/(1/(1/8+4) + 2/3))))' }
        hint: 'Right part: $2\parallel1$, $(3+5)\parallel\frac14$, then add and combine with $10$; finally $6 + \dots$ in parallel with $3+7$ and $\frac12$.'
        explain: '$2\parallel1 = \frac23$; $8\parallel\frac14 = 0.2424$; $0.2424 + 0.6667 = 0.909$; $0.909\parallel10 = 0.833$; $6 + 0.833 = 6.833$; $6.833 \parallel 10 \parallel 0.5 = 0.445\ \Omega$. (No answer on the sheet; computed here.)'
        sol: { method: 'Series–parallel reduction from the far end.', steps: ['$2\parallel1 = 2/3$', '$(3+5)\parallel(1/4) = 2/8.25 = 0.242$', '$(0.242 + 0.667)\parallel10 = 0.833$', '$6 + 0.833 = 6.833$', '$6.833\parallel(3+7)\parallel0.5 = 410/921 \approx 0.445\ \Omega$'], answer: '≈ 0.445 Ω' }
