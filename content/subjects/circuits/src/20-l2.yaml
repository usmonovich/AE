        sol: { method: 'Name the nodes, then reduce.', steps: ['$1000\parallel1000 = 500$; $500 + 1000 + 1000 = 2500$', '$2500 \parallel 1000 = 714.3$', '$(1000 + 714.3)\parallel1000 = 631.6\ \Omega$'], answer: '≈ 631.6 Ω' }
