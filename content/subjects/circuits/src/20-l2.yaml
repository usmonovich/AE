      - type: numeric
        cat: problem
        q: 'PS01: $R_1 = 15\ \Omega$, $R_2 = R_3 = 100\ \Omega$, $R_4 = 5\ \Omega$. Find the equivalent resistance (Ω).'
        num: { value: 15, unit: 'Ω', check: '15' }
        hint: 'Find the nodes first: points $c$, $d$, $e$, $f$ are joined by wires.'
