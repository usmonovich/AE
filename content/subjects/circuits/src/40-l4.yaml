  - id: ct-l4-max-power
    title: Maximum power transfer
    pages: [d39, d40, d41, d42, d43]
    theory:
      - kind: law
        title: Maximum power transfer
        fig: ct-max-power
        body: |
          A circuit is often designed to deliver power to a load (e.g. in communications). With the Thevenin equivalent, the load power is
          $p = i^2R_L = \left(\frac{V_{Th}}{R_{Th} + R_L}\right)^2 R_L$.
          **Maximum power is transferred when the load resistance equals the Thevenin resistance: $R_L = R_{Th}$.** Then $p_{\max} = \frac{V_{Th}^2}{4R_{Th}}$.
        src: d39
      - kind: text
        title: Proof
        body: 'Differentiate $p$ with respect to $R_L$: $\frac{dp}{dR_L} = V_{Th}^2\left[\frac{(R_{Th}+R_L)^2 - 2R_L(R_{Th}+R_L)}{(R_{Th}+R_L)^4}\right] = V_{Th}^2\frac{R_{Th} - R_L}{(R_{Th}+R_L)^3} = 0 \Rightarrow R_L = R_{Th}$.'
        src: d40
    formulas:
      - title: Condition for maximum power
        tex: 'R_L = R_{Th}'
        src: d40
      - title: Maximum power
        tex: 'p_{\max} = \frac{V_{Th}^2}{4R_{Th}}'
        src: d39
    examples:
      - title: 'Maximum power transfer, Example 1 (slide L4·27)'
        given: '$12$ V, $6\ \Omega$, $12\ \Omega$, $3\ \Omega$, $2$ A source, $2\ \Omega$, load $R_L$.'
        steps:
          - '$R_{Th} = 6\parallel12 + 3 + 2 = 4 + 5 = 9\ \Omega$.'
          - '$V_{Th}$ (by nodal analysis or superposition) $= 22$ V.'
          - '$R_L = R_{Th} = 9\ \Omega$; $p_{\max} = \frac{22^2}{4\cdot9} = 13.44$ W.'
        answer: '$R_L = 9\ \Omega$, $p_{\max} = 13.44$ W'
        src: [d41, d42, d43]
    questions:
      - type: numeric
        cat: problem
        q: 'Example 1 (L4·27): find $R_L$ for maximum power transfer (Ω).'
        num: { value: 9, unit: 'Ω', check: '6*12/18+3+2' }
        hint: '$R_L = R_{Th}$.'
        explain: '$R_{Th} = 4 + 3 + 2 = 9\ \Omega$.'
        sol: { method: 'Thevenin resistance.', steps: ['$6\parallel12 = 4$', '$R_{Th} = 4 + 3 + 2 = 9\ \Omega$'], answer: '9 Ω' }
        fromSource: true
        src: d41
      - type: numeric
        cat: problem
        q: 'Example 1: with $V_{Th} = 22$ V, find the maximum power (W).'
        num: { value: 13.44, unit: 'W', tolAbs: 0.01, check: '22**2/36' }
        hint: '$p_{\max} = V_{Th}^2/(4R_{Th})$.'
        explain: '$484/36 = 13.44$ W.'
        sol: { method: 'Maximum power formula.', steps: ['$p_{\max} = 22^2/(4\cdot9) = 13.44$ W'], answer: '13.44 W' }
        fromSource: true
        src: d42
      - type: numeric
        cat: problem
        q: 'A source has $V_{Th} = 30$ V, $R_{Th} = 4\ \Omega$. Find the maximum power it can deliver (W).'
        num: { value: 56.25, unit: 'W', check: '900/16' }
        hint: '$V_{Th}^2/(4R_{Th})$.'
        explain: '$900/16 = 56.25$ W at $R_L = 4\ \Omega$.'
        sol: { method: 'Maximum power formula.', steps: ['$p_{\max} = 30^2/16 = 56.25$ W'], answer: '56.25 W' }
        src: d39
      - type: single
        cat: theory
        q: 'Maximum power is delivered to the load when'
        opts: ['$R_L = R_{Th}$', '$R_L = 0$', '$R_L \to \infty$', '$R_L = 2R_{Th}$']
        ans: a
        hint: 'Set $dp/dR_L = 0$.'
        explain: 'At $R_L = R_{Th}$ the derivative vanishes; the efficiency is then 50 %.'
