  - id: ct-l3-compare
    title: Nodal or mesh analysis?
    pages: [c43, c44]
    theory:
      - kind: rule
        title: Choosing the method
        body: |
          - Many series elements, voltage sources or supermeshes → **mesh analysis**.
          - Many parallel elements, current sources or supernodes → **nodal analysis**.
          - Fewer nodes than meshes → nodal; fewer meshes than nodes → mesh. The key is the **smallest number of equations**.
          - If node voltages are required → nodal; if branch or mesh currents are required → mesh may be better.
          - For **nonplanar** networks nodal analysis is the only option (mesh analysis applies only to planar networks). Nodal analysis is easily programmed on computers.
        src: [c43, c44]
    questions:
      - type: single
        cat: theory
        q: 'For a nonplanar network you must use'
        opts: ['nodal analysis', 'mesh analysis', 'either one', 'neither']
        ans: a
        hint: 'Meshes are defined only for planar circuits.'
        explain: 'Mesh analysis applies only to planar networks.'
        src: c44
      - type: single
        cat: theory
        q: 'A circuit has many current sources and parallel elements. Which method is usually more convenient?'
        opts: ['nodal analysis', 'mesh analysis', 'Δ–Y transformation', 'maximum power transfer']
        ans: a
        hint: 'Slide L3·22.'
        explain: 'Current sources enter KCL equations directly.'
        src: c43
      - type: single
        cat: theory
        q: 'A circuit has 5 nodes and 2 meshes. Which method needs fewer equations?'
        opts: ['mesh analysis (2 equations)', 'nodal analysis (4 equations)', 'they need the same number', 'neither method applies']
        ans: a
        hint: 'Nodal: $n - 1$; mesh: number of meshes.'
        explain: '2 mesh equations vs 4 nodal equations.'
        src: c43
