# Lecture 3. Methods of analysis (slides c01–c44) + PS02 (q05), PS04 (t01, t02), PS05 (v04).
subsection: ct-l3

topics:
  - id: ct-l3-nodal
    title: Nodal analysis (no voltage sources) and Cramer's rule
    pages: [c01, c02, c03, c04, c05, c06, c07, c08, c09, c10, c11, c12, c13]
    theory:
      - kind: text
        title: Two general methods
        body: 'Using Ohm''s and Kirchhoff''s laws we now build two powerful techniques: **nodal analysis**, based on KCL, and **mesh analysis**, based on KVL. Any linear circuit can be analysed by writing a set of simultaneous equations and solving them for the unknown voltages or currents. This part should be regarded as the most important in the course.'
        src: c02
      - kind: rule
        title: Steps of nodal analysis
        body: |
          Nodal analysis uses **node voltages** as circuit variables: this reduces the number of simultaneous equations.
          1. Select a node as the **reference node** (ground, $v = 0$). Assign voltages $v_1, v_2, \dots, v_{n-1}$ to the remaining $n - 1$ nodes; they are measured with respect to the reference.
          2. Apply **KCL** to each of the $n - 1$ non-reference nodes. Use Ohm's law to express the branch currents in terms of node voltages: current from node $a$ to node $b$ through $R$ is $\frac{v_a - v_b}{R}$.
          3. Solve the resulting simultaneous equations.
        src: [c04, c16]
      - kind: text
        title: The reference node
        body: 'Common symbols for the reference node: (a) common ground, (b) ground, (c) chassis ground. The choice is free; a node with many connections (often the bottom wire) gives the simplest equations.'
        src: c05
      - kind: text
        title: Example of the equations
        body: |
          For the circuit with $I_1$, $I_2$, $R_1$, $R_2$, $R_3$ (slides L3·7–9):
          node 1: $I_1 = I_2 + i_1 + i_2$; node 2: $I_2 + i_2 = i_3$, with $i_1 = \frac{v_1}{R_1} = G_1v_1$, $i_2 = \frac{v_1 - v_2}{R_2} = G_2(v_1 - v_2)$, $i_3 = \frac{v_2}{R_3} = G_3v_2$.
          In matrix form: $\begin{bmatrix}G_1+G_2 & -G_2\\ -G_2 & G_2+G_3\end{bmatrix}\begin{bmatrix}v_1\\ v_2\end{bmatrix} = \begin{bmatrix}I_1 - I_2\\ I_2\end{bmatrix}$.
        src: [c06, c08, c09]
      - kind: law
        title: Cramer's rule
        body: |
          For $A\mathbf{x} = \mathbf{b}$ with $\det A \ne 0$ the system has exactly one solution: $x_k = \frac{\Delta_k}{\Delta}$, where $\Delta = \det A$ and $\Delta_k$ is the determinant of $A$ with column $k$ replaced by $\mathbf{b}$.
          - 2×2: $\det\begin{bmatrix}a & b\\ c & d\end{bmatrix} = ad - bc$; $x = \frac{ed - bf}{\Delta}$, $y = \frac{af - ce}{\Delta}$ for $ax + by = e$, $cx + dy = f$.
          - 3×3: expand along the first row, $\det A = a_1(b_2c_3 - b_3c_2) - a_2(b_1c_3 - b_3c_1) + a_3(b_1c_2 - b_2c_1)$, or use the diagonal (Sarrus) rule.
          If the determinant is 0, the matrix has no inverse.
        src: [c10, c11]
    formulas:
      - title: Branch current from node voltages
        tex: 'i = \frac{v_{\text{higher}} - v_{\text{lower}}}{R} = G\,(v_a - v_b)'
        src: c09
      - title: Cramer's rule
        tex: 'x_k = \frac{\Delta_k}{\Delta}, \qquad \Delta = \det A \ne 0'
        src: c10
      - title: 2×2 determinant
        tex: '\det\begin{bmatrix}a & b\\ c & d\end{bmatrix} = ad - bc'
        src: c11
    examples:
      - title: 'Node voltages (Example 1, slide L3·11)'
        given: 'A $5$ A source whose current enters node 1 and leaves node 2, $4\ \Omega$ between nodes 1 and 2, $2\ \Omega$ (node 1) and $6\ \Omega$ (node 2) to ground, a $10$ A source into node 2.'
        steps:
          - 'Node 1: $i_1 = i_2 + i_3 \Rightarrow 5 = \frac{v_1 - v_2}{4} + \frac{v_1}{2} \Rightarrow 3v_1 - v_2 = 20$.'
          - 'Node 2: $i_2 + i_4 = i_1 + i_5 \Rightarrow \frac{v_1 - v_2}{4} + 10 = 5 + \frac{v_2}{6} \Rightarrow -3v_1 + 5v_2 = 60$.'
          - 'Adding: $4v_2 = 80 \Rightarrow v_2 = 20$ V; $v_1 = 40/3 = 13.333$ V.'
          - 'Currents: $i_2 = \frac{v_1 - v_2}{4} = -1.667$ A (it flows opposite to the assumed direction), $i_3 = 6.667$ A, $i_5 = 3.333$ A.'
        answer: '$v_1 = 13.333$ V, $v_2 = 20$ V'
        src: [c12, c13]
    questions:
      - type: single
        cat: theory
        q: 'Nodal analysis is based on'
        opts: ['KCL', 'KVL', 'the superposition theorem', 'source transformation']
        ans: a
        hint: 'Slide L3·3.'
        explain: 'Nodal analysis applies KCL at the non-reference nodes; mesh analysis applies KVL around meshes.'
        src: c01
      - type: numeric
        cat: theory
        q: 'A circuit has $n = 5$ nodes. How many KCL equations does nodal analysis need (no voltage sources)?'
        num: { value: 4, unit: '', check: '5-1' }
        hint: 'One node is the reference.'
        explain: '$n - 1 = 4$ equations.'
        sol: { method: 'Count non-reference nodes.', steps: ['$n - 1 = 4$'], answer: '4' }
        src: c01
      - type: numeric
        cat: problem
        q: 'Example 1 (L3·11): find $v_1$ (V).'
        num: { value: 13.333, unit: 'V', tolAbs: 0.01, check: '40/3' }
        hint: '$3v_1 - v_2 = 20$, $-3v_1 + 5v_2 = 60$.'
        explain: '$v_2 = 20$ V, $v_1 = 40/3 \approx 13.33$ V.'
        sol: { method: 'Nodal analysis.', steps: ['Node 1: $3v_1 - v_2 = 20$', 'Node 2: $-3v_1 + 5v_2 = 60$', 'Add: $v_2 = 20$; $v_1 = 13.33$ V'], answer: '13.33 V' }
        fromSource: true
        src: c13
      - type: numeric
        cat: problem
        q: 'Example 1 (L3·11): the current $i_2$ through the $4\ \Omega$ resistor from node 1 to node 2 (A).'
        num: { value: -1.6667, unit: 'A', tolAbs: 0.002, check: '(40/3-20)/4' }
        hint: '$i_2 = (v_1 - v_2)/4$.'
        explain: '$i_2 = (13.333 - 20)/4 = -1.667$ A: it actually flows from node 2 to node 1.'
        sol: { method: 'Ohm''s law with node voltages.', steps: ['$i_2 = (13.333 - 20)/4 = -1.667$ A'], answer: '−1.667 A' }
        fromSource: true
        src: c13
      - type: numeric
        cat: problem
        q: 'Use Cramer''s rule: $\begin{bmatrix}3 & -1\\ -3 & 5\end{bmatrix}\begin{bmatrix}v_1\\ v_2\end{bmatrix} = \begin{bmatrix}20\\ 60\end{bmatrix}$. Find $\Delta_2$ (column 2 replaced).'
        num: { value: 240, unit: '', check: '3*60-20*(-3)' }
        hint: '$\Delta_2 = \det\begin{bmatrix}3 & 20\\ -3 & 60\end{bmatrix}$.'
        explain: '$\Delta_2 = 180 + 60 = 240$, $\Delta = 12$, so $v_2 = 20$ V.'
        sol: { method: 'Cramer''s rule.', steps: ['$\Delta = 15 - 3 = 12$', '$\Delta_2 = 3\cdot60 - 20\cdot(-3) = 240$', '$v_2 = 240/12 = 20$ V'], answer: '240' }
        src: c10
      - type: numeric
        cat: problem
        q: 'PS04: $I = 2$ A, $E = 80$ V, $R_1 = 10$, $R_2 = 15$, $R_3 = 50$, $R_4 = 60\ \Omega$ (bridge with $E$ on the diagonal, «+» at the node of $R_1$ and $R_2$). Find the power dissipated by $R_2$ (W).'
        num: { value: 4.2667, unit: 'W', tolAbs: 0.005, check: '15*((88-80)/15)**2' }
        hint: 'Take the «−» end of $E$ as reference: the node between $R_2$ and $R_4$ is fed by the current source; write KCL there.'
        explain: 'With $v_Q = 0$, $v_P = 80$ V: $\frac{v - 80}{15} + \frac{v}{60} = 2 \Rightarrow v = 88$ V. $i_{R_2} = 8/15 = 0.533$ A, $p = 15\cdot0.533^2 = 64/15 \approx 4.27$ W. (No answer on the sheet; computed here.)'
        sol: { method: 'Nodal analysis with a voltage source fixing two nodes.', steps: ['$E$ fixes $v_P - v_Q = 80$ V; choose $v_Q = 0$.', 'KCL at the node between $R_2$ and $R_4$: $(v - 80)/15 + v/60 = 2$', '$5v = 440 \Rightarrow v = 88$ V', '$p_{R_2} = (8)^2/15 = 4.27$ W'], answer: '≈ 4.27 W' }
        fromSource: true
        src: t02
      - type: single
        cat: theory
        q: 'If the determinant of the coefficient matrix is zero, then'
        opts: ['the system has no unique solution (the matrix has no inverse)', 'all unknowns are zero', 'Cramer''s rule still gives the answer', 'the circuit has no reference node']
        ans: a
        hint: 'Slide L3·10.'
        explain: 'Cramer''s rule needs $\Delta \ne 0$.'
        src: c01

  - id: ct-l3-supernode
    title: Nodal analysis with voltage sources, supernode
    pages: [c14, c15, c16, c17, c18, c19, c20, c21, c22, c23, c24, c25]
    theory:
      - kind: rule
        title: Two cases
        body: |
          **Case 1:** a voltage source is connected between the reference node and a non-reference node — simply set the node voltage equal to the source voltage (e.g. $v_1 = 10$ V).

          **Case 2:** a voltage source (dependent or independent) is connected between two non-reference nodes — the two nodes form a **generalized node or supernode**. Apply both KCL and KVL to determine the node voltages.
        src: c14
      - kind: definition
        title: Supernode
        body: 'A **supernode** is formed by enclosing a (dependent or independent) voltage source connected between two non-reference nodes and any elements connected in parallel with it. KCL is written for the whole supernode (sum of currents leaving the closed surface $= 0$), and KVL across the source gives the extra equation, e.g. $-v_2 + 5 + v_3 = 0 \Rightarrow v_2 - v_3 = 5$.'
        src: [c14, c15]
      - kind: text
        title: Why nodal analysis?
        body: 'It simplifies complex circuits (we solve for node voltages instead of many currents); it works well with many components, especially current sources; a circuit with $N$ nodes needs only $N - 1$ equations; once node voltages are known, every current follows from Ohm''s law.'
        src: c16
    examples:
      - title: 'Supernode (Example 1, slide L3·14)'
        given: '$2$ A source into node 1, $2\ \Omega$ from node 1 to ground, $2$ V source between nodes 1 and 2, $4\ \Omega$ from node 2 to ground, $7$ A source out of node 2, $10\ \Omega$ in parallel with the 2 V source.'
        steps:
          - 'Nodes 1 and 2 form a supernode (the $10\ \Omega$ is inside it and drops out of KCL).'
          - 'KCL: $2 = i_1 + i_2 + 7 \Rightarrow 2 = \frac{v_1}{2} + \frac{v_2}{4} + 7 \Rightarrow 2v_1 + v_2 = -20$.'
          - 'KVL across the source: $v_2 - v_1 = 2$ (with the polarity of the drawing).'
          - '$2v_1 + v_1 + 2 = -20 \Rightarrow v_1 = -7.333$ V, $v_2 = -5.333$ V.'
        answer: '$v_1 = -7.333$ V, $v_2 = -5.333$ V'
        src: [c17, c18]
      - title: 'Two supernodes (Example 2, slides L3·15)'
        given: 'Nodes 1–2 joined by a $20$ V source, nodes 3–4 by a dependent source $3v_x$; $v_x = v_1 - v_4$.'
        steps:
          - 'Supernode 1–2: $5v_1 + v_2 - v_3 - 2v_4 = 60$; supernode 3–4: $4v_1 + 2v_2 - 5v_3 - 16v_4 = 0$.'
          - 'Loop 1: $v_1 - v_2 = 20$; loop 2: $-v_3 + 3v_x + v_4 = 0 \Rightarrow 3v_1 - v_3 - 2v_4 = 0$.'
          - 'Eliminate $v_2 = v_1 - 20$: $\begin{bmatrix}3 & -1 & -2\\ 6 & -1 & -2\\ 6 & -5 & -16\end{bmatrix}\begin{bmatrix}v_1\\ v_3\\ v_4\end{bmatrix} = \begin{bmatrix}0\\ 80\\ 40\end{bmatrix}$.'
          - 'Cramer: $\Delta = -18$, $\Delta_1 = -480$, $\Delta_3 = -3120$, $\Delta_4 = 840$.'
        answer: '$v_1 = 26.67$ V, $v_2 = 6.667$ V, $v_3 = 173.33$ V, $v_4 = -46.67$ V'
        src: [c19, c20, c21, c22, c23, c24, c25]
    questions:
      - type: single
        cat: theory
        q: 'A voltage source connected between two non-reference nodes creates'
        opts: ['a supernode', 'a supermesh', 'a reference node', 'a short circuit that can be removed']
        ans: a
        hint: 'Case 2 on slide L3·12.'
        explain: 'The two nodes are treated together: KCL for the supernode + KVL for the source.'
        src: c14
      - type: single
        cat: theory
        q: 'A $10$ V source is connected between node 1 and the reference node («+» at node 1). Then'
        opts: ['$v_1 = 10$ V, no KCL is needed at node 1', 'a supernode must be formed', '$v_1 = 0$', 'node 1 is removed from the circuit']
        ans: a
        hint: 'Case 1.'
        explain: 'The source fixes the node voltage directly.'
        src: c14
      - type: numeric
        cat: problem
        q: 'Supernode Example 1 (L3·14): find $v_2$ (V).'
        num: { value: -5.3333, unit: 'V', tolAbs: 0.01, check: '-22/3+2' }
        hint: '$2v_1 + v_2 = -20$, $v_2 = v_1 + 2$.'
        explain: '$3v_1 = -22 \Rightarrow v_1 = -7.333$ V, $v_2 = -5.333$ V.'
        sol: { method: 'Supernode: KCL + KVL.', steps: ['$2 = v_1/2 + v_2/4 + 7$', '$v_2 = v_1 + 2$', '$v_1 = -7.333$, $v_2 = -5.333$ V'], answer: '−5.333 V' }
        fromSource: true
        src: c17
      - type: numeric
        cat: problem
        q: 'Example 2 (L3·15): find $v_3$ (V).'
        num: { value: 173.33, unit: 'V', tolAbs: 0.05, check: '-3120/-18' }
        hint: '$v_3 = \Delta_3/\Delta$.'
        explain: '$v_3 = -3120/(-18) = 173.33$ V.'
        sol: { method: 'Cramer''s rule.', steps: ['$\Delta = -18$, $\Delta_3 = -3120$', '$v_3 = 173.33$ V'], answer: '173.33 V' }
        fromSource: true
        src: c25
      - type: numeric
        cat: problem
        q: 'Compute $\Delta = \det\begin{bmatrix}3 & -1 & -2\\ 6 & -1 & -2\\ 6 & -5 & -16\end{bmatrix}$ (Example 2).'
        num: { value: -18, unit: '', check: '3*((-1)*(-16)-(-2)*(-5)) - (-1)*(6*(-16)-(-2)*6) + (-2)*(6*(-5)-(-1)*6)' }
        hint: 'Expand along the first row.'
        explain: '$3(16 - 10) + 1(-96 + 12) - 2(-30 + 6) = 18 - 84 + 48 = -18$.'
        sol: { method: 'Cofactor expansion along row 1.', steps: ['$3\cdot(16-10) = 18$', '$-(-1)\cdot(-96+12) = -84$', '$-2\cdot(-30+6) = 48$', 'Sum $= -18$'], answer: '−18' }
        fromSource: true
        src: c25
      - type: numeric
        cat: problem
        q: 'PS02: a $2$ A source (pointing down), $4\ \Omega$, a branch with $2\ \Omega$ in series with a $5$ V source («+» at top), and $4\ \Omega$ (current $I$ downward) are all between the top node and the bottom node. Find $I$ (A).'
        num: { value: 0.125, unit: 'A', check: '0.5/4' }
        hint: 'One unknown: the top node voltage $v$. KCL: $2 + \frac v4 + \frac{v - 5}{2} + \frac v4 = 0$.'
        explain: '$v(1/4 + 1/2 + 1/4) = 5/2 - 2 \Rightarrow v = 0.5$ V; $I = v/4 = 1/8$ A; the voltage across the $2\ \Omega$ is $V = v - 5 = -4.5$ V (sheet: $-9/2$ V and $1/8$ A).'
        sol: { method: 'Nodal analysis with one non-reference node.', steps: ['KCL at the top node: $2 + v/4 + (v-5)/2 + v/4 = 0$', '$v = 0.5$ V', '$I = 0.125$ A, $V = v - 5 = -4.5$ V'], answer: '1/8 A' }
        fromSource: true
        src: [q05, v04]
      - type: numeric
        cat: problem
        q: 'PS02 (same circuit): find the voltage $V$ across the $2\ \Omega$ resistor (V).'
        num: { value: -4.5, unit: 'V', check: '0.5-5' }
        hint: '$V = v_{\text{top}} - 5$.'
        explain: '$V = 0.5 - 5 = -4.5$ V $= -9/2$ V, as on the sheet.'
        sol: { method: 'KVL in the branch.', steps: ['$v_{\text{top}} = 0.5$ V', '$V = 0.5 - 5 = -4.5$ V'], answer: '−4.5 V' }
        fromSource: true
        src: [q05, v04]

  - id: ct-l3-mesh
    title: Mesh analysis (no current sources)
    pages: [c26, c27, c28, c29, c30, c31, c32, c33, c35, c36]
    theory:
      - kind: definition
        title: Mesh
        body: 'Mesh analysis (loop analysis) uses **mesh currents** as circuit variables and is based on KVL. A **mesh** is the smallest closed loop in a circuit that does not contain another loop inside it. It reduces the number of equations that must be solved simultaneously. It applies to **planar** circuits.'
        src: c26
      - kind: rule
        title: Steps of mesh analysis
        body: |
          1. Identify all meshes in the circuit.
          2. Assign a mesh current (usually clockwise) to each mesh.
          3. Apply KVL around each mesh.
          4. Use Ohm's law $V = IR$ to express voltages; a resistor shared by meshes 1 and 2 carries $i_1 - i_2$ (seen from mesh 1).
          5. Solve the equations for the mesh currents; branch currents follow (e.g. $I_3 = i_1 - i_2$).
        src: [c27, c28]
    examples:
      - title: 'Branch currents (Example 1, slide L3·17)'
        given: '$15$ V, $5\ \Omega$, $10\ \Omega$ with a $10$ V source in the middle branch, $6\ \Omega$, $4\ \Omega$.'
        steps:
          - 'Mesh 1: $-15 + 5i_1 + 10(i_1 - i_2) + 10 = 0 \Rightarrow 3i_1 - 2i_2 = 1$.'
          - 'Mesh 2: $6i_2 + 4i_2 + 10(i_2 - i_1) - 10 = 0 \Rightarrow i_1 = 2i_2 - 1$.'
          - '$3(2i_2 - 1) - 2i_2 = 1 \Rightarrow i_2 = 1$ A, $i_1 = 1$ A.'
        answer: '$I_1 = 1$ A, $I_2 = 1$ A, $I_3 = i_1 - i_2 = 0$'
        src: [c29, c30, c31]
      - title: 'Three meshes with a dependent source (Example 2, slide L3·18)'
        given: '$24$ V, $10$, $12$, $24$, $4\ \Omega$, dependent source $4I_o$, $I_o = i_1 - i_2$.'
        steps:
          - 'Mesh 1: $11i_1 - 5i_2 - 6i_3 = 12$; mesh 2: $-5i_1 + 19i_2 - 2i_3 = 0$; mesh 3: $4I_o + 12(i_3 - i_1) + 4(i_3 - i_2) = 0 \Rightarrow -i_1 - i_2 + 2i_3 = 0$.'
          - 'Cramer: $\Delta = 192$, $\Delta_1 = 432$, $\Delta_2 = 144$, $\Delta_3 = 288$.'
          - '$i_1 = 2.25$ A, $i_2 = 0.75$ A, $i_3 = 1.5$ A.'
        answer: '$I_o = i_1 - i_2 = 1.5$ A'
        src: [c32, c33, c35, c36]
    questions:
      - type: single
        cat: theory
        q: 'A mesh is'
        opts: ['the smallest closed loop that does not contain another loop inside it', 'any closed path', 'a node with three branches', 'a loop that contains a current source']
        ans: a
        hint: 'Slide L3·16.'
        explain: 'Every mesh is a loop, but not every loop is a mesh.'
        src: c26
      - type: numeric
        cat: problem
        q: 'Mesh Example 1 (L3·17): find $I_3 = i_1 - i_2$ (A).'
        num: { value: 0, unit: 'A', tolAbs: 1e-6, check: '1-1' }
        hint: '$3i_1 - 2i_2 = 1$, $i_1 = 2i_2 - 1$.'
        explain: '$i_1 = i_2 = 1$ A, so the middle branch carries no current.'
        sol: { method: 'Mesh analysis.', steps: ['$3i_1 - 2i_2 = 1$', '$i_1 = 2i_2 - 1$', '$i_2 = 1$, $i_1 = 1$, $I_3 = 0$'], answer: '0 A' }
        fromSource: true
        src: c31
      - type: numeric
        cat: problem
        q: 'Mesh Example 2 (L3·18): find $I_o$ (A).'
        num: { value: 1.5, unit: 'A', check: '432/192-144/192' }
        hint: '$I_o = i_1 - i_2$ with $i_1 = \Delta_1/\Delta$, $i_2 = \Delta_2/\Delta$.'
        explain: '$i_1 = 2.25$ A, $i_2 = 0.75$ A ⇒ $I_o = 1.5$ A.'
        sol: { method: 'Cramer''s rule.', steps: ['$\Delta = 192$', '$i_1 = 432/192 = 2.25$, $i_2 = 144/192 = 0.75$', '$I_o = 1.5$ A'], answer: '1.5 A' }
        fromSource: true
        src: c36
      - type: numeric
        cat: problem
        q: 'PS04: in the circuit with the $10$ V source, $10\ \Omega$, a $4$ A current source, a $2$ V source, $5\ \Omega$ and a $4$ V source, find the current $i$ through the $2$ V source (A).'
        num: { value: -3.2, unit: 'A', check: '-48/15' }
        hint: 'Take the common bottom-left node as reference: the $10$ V source fixes the top-left node at $-10$ V. Write KCL at the top node and KVL along the right branch.'
        explain: 'Top node $v_T$: KCL $\frac{-10 - v_T}{10} = 4 + i$; right branch: $v_T - 2 - 5i = -4 \Rightarrow v_T = 5i - 2$. Then $-8 - 5i = 40 + 10i \Rightarrow i = -3.2$ A. (No answer on the sheet; computed here.)'
        sol: { method: 'Combine KCL at the top node with KVL along the branch.', steps: ['reference: bottom-left node; $v_{TL} = -10$ V', 'KCL at the top node: $(-10 - v_T)/10 = 4 + i$', 'branch: $v_T = 2 + 5i - 4 = 5i - 2$', '$i = -48/15 = -3.2$ A'], answer: '−3.2 A' }
        fromSource: true
        src: t01
      - type: numeric
        cat: problem
        q: 'In a two-mesh circuit, mesh currents are $i_1 = 3$ A and $i_2 = 1$ A (both clockwise). Find the current in the shared resistor, in the direction of $i_1$ (A).'
        num: { value: 2, unit: 'A', check: '3-1' }
        hint: 'The shared branch carries $i_1 - i_2$.'
        explain: '$3 - 1 = 2$ A.'
        sol: { method: 'Branch current from mesh currents.', steps: ['$i_1 - i_2 = 2$ A'], answer: '2 A' }
        src: c27

  - id: ct-l3-supermesh
    title: Mesh analysis with current sources, supermesh
    pages: [c37, c38, c39, c40, c41, c42]
    theory:
      - kind: rule
        title: Case 1 — current source in one mesh only
        body: 'The mesh current equals the source current. Example: $i_2 = -5$ A, then KVL for the other mesh: $-10 + 4i_1 + 6(i_1 - i_2) = 0 \Rightarrow i_1 = -2$ A.'
        src: c37
      - kind: rule
        title: Case 2 — current source between two meshes (supermesh)
        body: |
          Create a **supermesh** by excluding the current source and any elements connected in series with it; write KVL around the supermesh. A supermesh results when two meshes have a (dependent or independent) current source in common.

          Properties: 1) the current source provides the constraint equation (KCL at a node of the shared branch); 2) a supermesh has no current of its own; 3) it requires both KVL and KCL.
        src: [c37, c38]
    examples:
      - title: 'Supermesh (slide L3·20)'
        given: '$20$ V, $6\ \Omega$, $10\ \Omega$, $4\ \Omega$; a $6$ A source (with $2\ \Omega$ in series) shared by meshes 1 and 2.'
        steps:
          - 'KVL around the supermesh: $-20 + 6i_1 + 10i_2 + 4i_2 = 0 \Rightarrow 6i_1 + 14i_2 = 20$.'
          - 'KCL at node 0: $i_2 = i_1 + 6$.'
          - '$6i_1 + 14i_1 + 84 = 20 \Rightarrow i_1 = -3.2$ A.'
