# Labs 1–2 (PS03 Lab-1: s01–s08, PS04 Lab-2: u01–u04).
subsection: ct-labs

topics:
  - id: ct-lab1-equipment
    title: 'Lab 1: introduction to lab equipment'
    pages: [s01, s02, s03, s04, s05, s06, s07, s08]
    theory:
      - kind: text
        title: Objective and equipment
        body: 'Objective: be able to measure resistance, voltage and current. Equipment: power supply, digital multimeter (DMM), breadboard, resistors.'
        src: s01
      - kind: text
        title: Breadboard
        body: 'A breadboard has two internal connections. The **vertical** rails are connected from top to bottom: 5 V on the first pin is present on every pin of that rail. The **horizontal** strips connect groups of 5 pins: pins A1–E1 are joined internally.'
        src: s01
      - kind: rule
        title: Digital multimeter
        body: |
          Parts: power button; 10 A jack (not used in this course); voltage jack (red lead, positive); display; range selector; measurement type (V, A, Ω); AC/DC button; **COM** jack (always used, black lead); 2 A jack (red lead for current measurements).

          **Choosing the range:** select the next range above the expected value — $1.1\ \text{k}\Omega \to$ «2K», $6$ V $\to$ «20», $1$ mA $\to$ «2m».
        src: [s02, s03]
      - kind: rule
        title: Power supply
        body: 'The «+6V» knob sets the 6-V output when the «+6V» meter button is pressed; the «±20V» knob sets the ±20-V outputs. The output terminals are always active while the supply is on, whatever meter button is selected — so set the voltage first, switch off, then connect the circuit.'
        src: s04
      - kind: rule
        title: How to measure (good lab practice)
        body: |
          - **Resistance:** measure the resistor alone (out of the circuit, supply off).
          - **Voltage:** the DMM is connected **in parallel** with the element.
          - **Current:** switch the supply off, **break the circuit** and insert the DMM **in series** (positive lead toward $R_1$, negative toward $R_2$), then switch on.
        src: [s06, s07, s08]
      - kind: text
        title: Theory and preliminary calculations
        body: 'Ohm''s law in three forms: $V = IR$, $I = \frac VR$, $R = \frac VI$. Series resistors add. Figure 1.8: $6$ V, $R_1 = 1.1\ \text{k}\Omega$, $R_2 = 3.3\ \text{k}\Omega$; Figure 1.9: the same resistors with $10$ V. Compute $R_T$, $V_1$, $V_2$ and $I$ before the lab, then compare with the measurements (percent error).'
        src: s05
    examples:
      - title: 'Preliminary calculations, Figure 1.8'
        given: '$6$ V, $R_1 = 1.1\ \text{k}\Omega$, $R_2 = 3.3\ \text{k}\Omega$ in series.'
        steps:
          - '$R_T = 1.1 + 3.3 = 4.4\ \text{k}\Omega$; $I = 6/4.4\ \text{k} = 1.364$ mA.'
          - '$V_1 = IR_1 = 1.5$ V, $V_2 = IR_2 = 4.5$ V (check: $1.5 + 4.5 = 6$ V).'
        answer: '$R_T = 4.4\ \text{k}\Omega$, $I = 1.364$ mA, $V_1 = 1.5$ V, $V_2 = 4.5$ V'
        src: s05
    questions:
      - type: numeric
        cat: problem
        q: 'Lab 1, Figure 1.9: $10$ V across $1.1\ \text{k}\Omega$ and $3.3\ \text{k}\Omega$ in series. Find $V_2$ (V).'
        num: { value: 7.5, unit: 'V', check: '10*3.3/4.4' }
        hint: 'Voltage divider.'
        explain: '$V_2 = 10\cdot3.3/4.4 = 7.5$ V, $V_1 = 2.5$ V, $I = 2.273$ mA.'
        sol: { method: 'Voltage divider.', steps: ['$R_T = 4.4\ \text{k}\Omega$', '$V_2 = 10\cdot3.3/4.4 = 7.5$ V'], answer: '7.5 V' }
        fromSource: true
        src: s05
      - type: numeric
        cat: problem
        q: 'Lab 1, Figure 1.8: find the current $I$ (mA).'
        num: { value: 1.3636, unit: 'mA', tolAbs: 0.001, check: '6/4.4' }
        hint: '$I = V/R_T$ with $R_T$ in kΩ gives mA.'
        explain: '$6/4.4 = 1.364$ mA.'
        sol: { method: 'Ohm''s law.', steps: ['$R_T = 4.4\ \text{k}\Omega$', '$I = 6/4.4 = 1.364$ mA'], answer: '≈ 1.364 mA' }
        fromSource: true
        src: s05
      - type: single
        cat: theory
        q: 'You expect about $6$ V. Which DMM voltage range do you select?'
        opts: ['20', '2', '200', '2m']
        ans: a
        hint: 'The next range above the expected value.'
        explain: '«20» is the next range above 6 V (slide Lab1·7).'
        fromSource: true
        src: s03
      - type: single
        cat: theory
        q: 'To measure the current through a resistor with a DMM you must'
        opts: ['break the circuit and connect the DMM in series', 'connect the DMM in parallel with the resistor', 'remove the resistor and measure it alone', 'connect the DMM across the power supply']
        ans: a
        hint: 'The current has to flow through the meter.'
        explain: 'An ammeter goes in series; a voltmeter goes in parallel. (Connecting an ammeter in parallel can short the circuit.)'
        src: s07
      - type: single
        cat: theory
        q: 'On a breadboard, pins A1 and E1 are'
        opts: ['connected internally', 'isolated from each other', 'connected to the power rail', 'connected only through a resistor']
        ans: a
        hint: 'Horizontal strips of 5 pins.'
        explain: 'Each horizontal strip joins 5 pins (A–E) of the same row.'
        src: s01

  - id: ct-lab2-series-parallel
    title: 'Lab 2: series and parallel circuits'
    pages: [u01, u02, u03, u04]
    theory:
      - kind: text
        title: Theory
        body: |
          - KVL: the algebraic sum of the voltages around any closed path is zero, $\sum v_i = 0$; KCL: the algebraic sum of the currents at any node is zero, $\sum i_i = 0$.
          - Series circuit: same current through each element, different voltages; $R_T = R_1 + \dots + R_N$ and $V_S = V_1 + \dots + V_N$.
          - Parallel circuit: same voltage across each branch, different currents; $\frac{1}{R_T} = \frac{1}{R_1} + \dots + \frac{1}{R_N}$ and $I_P = I_1 + \dots + I_N$.
        src: u01
      - kind: rule
        title: Percent error
        body: '$\text{Percent error} = \frac{\text{Measured} - \text{Theoretical}}{\text{Theoretical}}\times100$. Compare every measured value ($R$, $V$, $I$) with the calculated one; a negative value means the measurement is below the theory; the magnitude is often reported.'
        src: u03
    examples:
      - title: 'Preliminary calculations, Figure 2.2'
        given: '$10$ V across $1.5$, $2.4$ and $2.7\ \text{k}\Omega$ in parallel.'
        steps:
          - '$V_1 = V_2 = V_3 = 10$ V.'
          - '$I_1 = 6.667$ mA, $I_2 = 4.167$ mA, $I_3 = 3.704$ mA; $I_T = 14.54$ mA.'
          - '$R_T = 10/14.54\ \text{mA} = 0.688\ \text{k}\Omega$.'
        answer: '$R_T \approx 688\ \Omega$, $I_T \approx 14.54$ mA'
        src: u02
    questions:
      - type: numeric
        cat: problem
        q: 'Lab 2, Figure 2.1: $10$ V across $1.1\ \text{k}\Omega$ and $2.7\ \text{k}\Omega$ in series. Find $I$ (mA).'
        num: { value: 2.6316, unit: 'mA', tolAbs: 0.001, check: '10/3.8' }
        hint: '$R_T = 3.8\ \text{k}\Omega$.'
        explain: '$I = 10/3.8 = 2.632$ mA; $V_1 = 2.895$ V, $V_2 = 7.105$ V.'
        sol: { method: 'Series circuit.', steps: ['$R_T = 1.1 + 2.7 = 3.8\ \text{k}\Omega$', '$I = 2.632$ mA'], answer: '≈ 2.632 mA' }
        fromSource: true
        src: u02
      - type: numeric
        cat: problem
        q: 'Lab 2, Figure 2.2: find $R_T$ of $1.5$, $2.4$ and $2.7\ \text{k}\Omega$ in parallel (kΩ).'
        num: { value: 0.6879, unit: 'kΩ', tolAbs: 0.001, check: '1/(1/1.5+1/2.4+1/2.7)' }
        hint: 'Add the conductances.'
        explain: '$1/(0.6667 + 0.4167 + 0.3704) = 0.688\ \text{k}\Omega$.'
        sol: { method: 'Parallel resistors.', steps: ['$G_T = 0.6667 + 0.4167 + 0.3704 = 1.4537$ mS', '$R_T = 0.688\ \text{k}\Omega$'], answer: '≈ 0.688 kΩ' }
        fromSource: true
        src: u02
      - type: numeric
        cat: problem
        q: 'A resistor with theoretical value $2.70\ \text{k}\Omega$ measures $2.65\ \text{k}\Omega$. Find the percent error (%).'
        num: { value: -1.852, unit: '%', tolAbs: 0.005, check: '(2.65-2.70)/2.70*100' }
        hint: '$(\text{M} - \text{T})/\text{T}\times100$.'
        explain: '$-0.05/2.70\times100 = -1.85$ % (magnitude 1.85 %).'
        sol: { method: 'Percent error formula of the lab.', steps: ['$(2.65 - 2.70)/2.70 = -0.0185$', '$\times100 = -1.85$ %'], answer: '−1.85 %' }
        src: u03
      - type: single
        cat: theory
        q: 'In a parallel circuit, every branch has'
        opts: ['the same voltage', 'the same current', 'the same resistance', 'the same power']
        ans: a
        hint: 'Lab 2 theory.'
        explain: 'Parallel ⇒ same voltage, currents add (KCL).'
        src: u01
