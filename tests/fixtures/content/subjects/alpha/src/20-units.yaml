    pages: [a03]
    web:
      - { title: 'Тестовая ссылка на внешний источник', url: 'https://example.org/si-units' }
    theory:
      - kind: text
        title: Основные единицы
        body: В СИ длину измеряют в метрах, время — в секундах, массу — в килограммах.
        src: a03
    questions:
      - type: single
        cat: theory
        q: В чём измеряют время в СИ?
        opts: ['В секундах', 'В минутах', 'В часах', 'В сутках']
        ans: a
        hint: Основная единица времени — самая короткая из вариантов.
        explain: Единица времени в СИ — секунда.
        src: a03
      - type: single
        cat: theory
        q: В чём измеряют массу в СИ?
        opts: ['В килограммах', 'В граммах', 'В тоннах', 'В ньютонах']
        ans: a
        hint: Это единственная основная единица с приставкой.
        explain: Единица массы в СИ — килограмм.
        src: a03
