subsection: tb-1-1

x-sources:
  ref: &ref { title: 'Тестовый открытый источник', org: 'Тестовая организация', url: 'https://example.org/arithmetic', checked: '2026-10-30' }

topics:
  - id: tb-1-1-1
    num: '1.1.1'
    title: Порядок действий
    pages: [b003, b004]
    book:
      place: 'Ч. 1, 1.1 «Действия с числами», пункт 1.1.1'
      summary: 'Задания пункта — на вычисление значений выражений.'
    stage: verified
    sourcesChecked: '2026-10-30'
    web: [*ref]
    theory:
      - kind: rule
        title: Порядок действий
        body: |
          Сначала выполняют действия в скобках, затем умножение и деление слева направо, затем сложение и вычитание.

          | действие | очередь |
          |---|---|
          | скобки | 1 |
          | умножение и деление | 2 |
          | сложение и вычитание | 3 |
        src: b003
    formulas:
      - title: Распределительное свойство
        tex: 'a(b + c) = ab + ac'
        meaning: '$a, b, c$ — любые числа.'
        use: 'Чтобы вынести общий множитель и упростить счёт.'
        src: b003
    examples:
      - title: Общий множитель
        given: 'Вычислите $7 \cdot 13 + 7 \cdot 87$.'
        find: 'значение выражения.'
        method: 'Вынести общий множитель $7$.'
        steps: ['$7 \cdot (13 + 87) = 7 \cdot 100$.', '$7 \cdot 100 = 700$.']
        check: '$91 + 609 = 700$.'
        answer: '$700$'
        src: b003
    questions:
      - type: numeric
        cat: problem
        q: 'Вычислите $25 \cdot 4 \cdot 10$.'
        num: { value: 1000, unit: '', check: '25*4*10' }
        hint: 'Какие два множителя дают круглое число?'
        explain: '$25 \cdot 4 = 100$, $100 \cdot 10 = 1000$.'
        sol: { method: 'Сгруппировать множители.', steps: ['$25 \cdot 4 = 100$.', '$100 \cdot 10 = 1000$.'], answer: '1000' }
        src: b003
      - type: numeric
        cat: problem
        q: 'Вычислите $19 \cdot 7$.'
        num: { value: 133, unit: '', check: '19*7' }
        hint: '$19 = 20 - 1$.'
        explain: '$20 \cdot 7 - 7 = 133$.'
        sol: { method: 'Число, близкое к круглому.', steps: ['$19 \cdot 7 = 20 \cdot 7 - 7$.', '$140 - 7 = 133$.'], answer: '133' }
        src: b004
      - type: single
        cat: theory
        q: 'Какое действие выполняют первым в выражении без скобок $8 - 6 : 2$?'
        opts: ['Деление', 'Вычитание', 'Любое', 'Слева направо — вычитание']
        ans: a
        hint: Деление старше вычитания.
        explain: 'Сначала $6 : 2 = 3$, затем $8 - 3 = 5$.'
        sol: { method: 'Порядок действий.', steps: ['$6 : 2 = 3$.', '$8 - 3 = 5$.'], answer: 'деление' }
        src: b004
